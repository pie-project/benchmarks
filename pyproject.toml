[project]
name = "pie-evals"
version = "0.1.0"
description = "Benchmark & evaluation framework for pie: performance vs other engines, accuracy preservation, coverage and regression tracking."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "click>=8.1",
    "huggingface_hub>=0.24",
    "hf_xet>=1.1",  # DeepSeek-V4.1-Flash's shards download only through Xet ("too large ... install hf_xet")
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
accuracy = ["torch; sys_platform != 'darwin'", "mlx-lm; sys_platform == 'darwin'", "transformers>=4.44"]
orchestrate = ["requests>=2.31"]
quality = ["lm-eval[ifeval]>=0.4", "transformers", "jinja2", "tiktoken", "blobfile"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.5"]
web = ["pyyaml"]

[project.scripts]
pie-evals-node = "pie_evals.node.cli:main"
pie-evals = "pie_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pie_evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# a test that runs past this fails instead of holding CI for hours; the whole-matrix checks are "slow" and stay out of CI
timeout = 120
markers = ["slow: expands the whole matrix (about a minute each); not run in CI"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP017", "B008", "B905"]
