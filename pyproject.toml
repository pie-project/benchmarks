[project]
name = "pie-bench"
version = "0.1.2"
description = "Measure pie against other inference engines on your own machine and publish the results."
readme = "PYPI.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "click>=8.1",
    "requests>=2.31",
    "huggingface_hub>=0.24",
    "hf_xet>=1.1",
    "transformers>=4.44",
    "mlx-lm; sys_platform == 'darwin'",
]

[project.optional-dependencies]
quality = ["lm-eval[ifeval]>=0.4", "jinja2", "tiktoken", "blobfile"]
torch = ["torch"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pyjwt>=2.8"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.115", "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pyjwt>=2.8"]

[project.urls]
Homepage = "https://pie-project.org/benchmarks"
Source = "https://github.com/pie-project/benchmarks"

[project.scripts]
pie-bench = "pie_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pie_bench"]

[tool.hatch.build.targets.sdist]
include = ["/src/pie_bench", "/PYPI.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
markers = ["slow: expands the whole matrix"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "UP017", "B008", "B905", "E402", "B023", "B904"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
