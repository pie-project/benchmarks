# The device evaluation: one representative model per architecture, measured on one device with every engine,
# every setup and a quality check, nothing missing. tools/device_coverage.py reads this file and the site's data
# (web/data/db.js) and lists every cell that is not done. docs/device-eval-prompt.md is the agent's prompt.
#
# model: the site's model id (web/data/db.js `models`). alternates: smaller or larger variants of the same
# architecture that may stand in for it where it does not fit, or that may be skipped; the first one present counts.
engines: [pie, vllm, sglang]
# the four setups of the compare pages: Raw gives Decode Latency and Prefill Latency from one run
setups:
  - {id: decode_latency, workload: raw, metric: decode_tok_s}
  - {id: prefill_latency, workload: raw, metric: prefill_tok_s}
  - {id: decode_throughput, workload: throughput, metric: output_tok_s}
  - {id: prefill_throughput, workload: prefill_batch, metric: prefill_tok_s}
# quality: pie against vLLM on the same weights (teacher-forced KL, top-1 agreement), the parity workflow's rows
quality: {task_prefix: "parity@", max_kl: 0.05, min_top1: 0.90}
models:
  - {n: 1, model: deepseek-v4.1-flash, family: deepseek_v41, covers: "CSA2 + single-pass mHC + Engram + MoE"}
  - {n: 2, model: deepseek-v4-flash, family: deepseek_v4, covers: "CSA/HCA sparse attention + mHC + MoE"}
  - {n: 3, model: qwen3.8-flash-next, family: qwen4_exp, covers: "GDN hybrid + routed experts + n-gram embedding"}
  - {n: 4, model: mimo-v2.6-flash-rl, family: mimo_v2, covers: "hybrid sliding/full attention + MoE"}
  - {n: 5, model: kimi-k3, family: kimi_k3, covers: "KDA + MLA + latent MoE + AttnRes"}
  - {n: 6, model: glm-5.3, family: glm_moe_dsa, covers: "MLA + DSA sparse attention + MoE"}
  - {n: 7, model: glm-5.3-flash, family: glm5_next, covers: "KDA linear attention + DSA + mHC + MoE"}
  - {n: 8, model: hy4-preview, family: hy_v4, covers: "sparse MLA + MoE"}
  - {n: 9, model: muse-spark-open-816b-a42b, family: muse_spark, covers: "Muse large MoE"}
  - {n: 10, model: muse-glimmer-30b, family: muse_glimmer, covers: "Muse 30B"}
  - {n: 11, model: minimax-m3.1-flash, family: minimax_m3, covers: "lightning attention hybrid MoE"}
  - {n: 12, model: nemotron-3-super, family: nemotron_h, covers: "Mamba-2 + MoE + attention hybrid",
     alternates: [nvidia-nemotron-3-ultra-550b-a55b, nemotron-h-8b]}
  - {n: 13, model: qwen3.6-35b-a3b, family: qwen3_6_moe, covers: "GDN hybrid MoE, 256 experts"}
  - {n: 14, model: qwen3.8-27b, family: qwen3_6, covers: "GDN hybrid dense",
     alternates: [qwen3.6-27b, qwen3.5-9b, qwen3.5-4b, qwen3.5-0.8b]}
  - {n: 15, model: qwen3-0.6b, family: qwen3, covers: "standard dense transformer baseline"}
  - {n: 16, model: gemma-4-26b-a4b, family: gemma4_moe, covers: "Gemma-4 global/sliding MoE"}
  - {n: 17, model: gemma-4-31b, family: gemma4, covers: "Gemma-4 standard dense", alternates: [gemma-4-12b]}
  - {n: 18, model: gemma-4-e4b, family: gemma4, covers: "Gemma-4 per-layer embeddings dense", alternates: [gemma-4-e2b]}
  - {n: 19, model: gpt-oss-20b, family: gpt_oss, covers: "attention sinks + sliding window + MXFP4 MoE",
     alternates: [gpt-oss-120b]}
