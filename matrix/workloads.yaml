# Workload shapes. All synthetic shapes are pre-tokenized with a fixed seed
# so every engine sees byte-identical token ids (prompt-token parity is then
# checked, not hoped for). `params` are consumed by
# pie_evals.node.workloads.<kind>. `est_minutes` feeds the budget check.
workloads:
  # -- harness self-check: the engine against itself, must read ~0 difference
  - id: control-aa
    kind: control_aa
    params: {prefill: 128, decode: 64, rounds: 2}
    tiers: [smoke, nightly, weekly]
    est_minutes: 0.5

  # -- single stream (the headline on Macs; host-in-the-loop efficiency)
  - id: ss-128-64
    kind: single_stream
    params: {prefill: 128, decode: 64}
    tiers: [smoke, nightly, weekly]
    est_minutes: 0.5
  - id: ss-512-256
    kind: single_stream
    # cold prompts (a unique leading tag per request): the row's prefill is a real prefill for every engine
    params: {prefill: 512, decode: 256, requests: 8, cold_cache: true}
    tiers: [nightly, weekly, targeted]
    est_minutes: 1

  # -- concurrency sweep (closed loop; num_requests = 4 x concurrency as in pie-bench)
  - id: c8
    kind: concurrency
    params: {concurrency: 8, num_requests: 32, prefill: 128, decode: 128}
    tiers: [smoke, nightly, weekly]
    est_minutes: 1
  - id: c32
    kind: concurrency
    # a dense 27B on a 48 GB Mac serves 128 requests in 12-25 min: requests and rounds get the time to finish
    params: {concurrency: 32, num_requests: 128, prefill: 128, decode: 128, request_timeout_s: 2400, round_timeout_s: 3000}
    tiers: [smoke, nightly, weekly, targeted]
    est_minutes: 1.5
  - id: c64
    kind: concurrency
    params: {concurrency: 64, num_requests: 256, prefill: 128, decode: 256}
    tiers: [nightly, weekly]
    est_minutes: 3
  - id: c256
    kind: concurrency
    params: {concurrency: 256, num_requests: 1024, prefill: 128, decode: 256}
    tiers: [nightly, weekly]
    est_minutes: 6

  # -- long context
  - id: lc-1k-128
    kind: long_context
    params: {prefill: 1024, decode: 128, concurrency: 1}
    tiers: [smoke, nightly, weekly]
    est_minutes: 0.7
  - id: lc-2k-128
    kind: long_context
    params: {prefill: 2048, decode: 128, concurrency: 1}
    tiers: [smoke, nightly, weekly]
    est_minutes: 1
  - id: lc-8k-128
    kind: long_context
    params: {prefill: 8192, decode: 128, concurrency: 1}
    tiers: [smoke, nightly, weekly]
    est_minutes: 1.5
  - id: lc-32k-128
    kind: long_context
    params: {prefill: 32768, decode: 128, concurrency: 1}
    tiers: [nightly, weekly]
    est_minutes: 3
  - id: lc-128k-64
    kind: long_context
    params: {prefill: 131072, decode: 64, concurrency: 1}
    tiers: [weekly]
    est_minutes: 8

  # -- prefix sharing (system prompt + variants); exercises prefix cache / prefix-tree
  - id: prefix-1k-x64
    kind: prefix_shared
    params: {shared_prefix: 1024, unique_suffix: 64, variants: 64, decode: 64, concurrency: 16}
    tiers: [smoke, nightly, weekly]
    est_minutes: 1.5

  # -- length mix (lognormal, ShareGPT-like) closed loop
  - id: mixed-256
    kind: mixed_length
    params: {num_requests: 256, concurrency: 32, prompt_lognormal: [6.0, 0.8], output_lognormal: [5.0, 0.7], max_prompt: 4096, max_output: 1024}
    tiers: [smoke, nightly, weekly]
    est_minutes: 3

  # -- KV oversubscription (contention shape D): more lanes than the pool holds
  - id: kv-oversub
    kind: concurrency
    params: {concurrency: 128, num_requests: 256, prefill: 2048, decode: 512, kv_oversubscribe: true}
    tiers: [nightly, weekly]
    est_minutes: 6

  # -- real traffic replay (open loop, arrival timestamps honored)
  - id: replay-azure-2024
    kind: replay
    params: {trace: azure-llm-2024, minutes: 10, speedup: 1.0}
    tiers: [weekly]
    est_minutes: 15
  - id: replay-mooncake
    kind: replay
    params: {trace: mooncake-conv, minutes: 10, speedup: 1.0}
    tiers: [weekly]
    est_minutes: 15
  - id: replay-burstgpt
    kind: replay
    params: {trace: burstgpt-v2, minutes: 10, speedup: 1.0}
    tiers: [weekly]
    est_minutes: 15

  # -- targeted: single-stream shapes, pie against the other engines on the Macs
  - id: ob-story-200
    kind: single_stream
    params:
      label: Story
      description: "story prompt, 200 tokens out, 6 runs"
      prompt: "Please write a descriptive story about a llama named Alonso who grows up to be President of the Land of Llamas. Include details about Alonso's childhood, adolescent years, and how he grew up to be a political mover and shaker. Write the story with a sense of whimsy."
      decode: 200
      requests: 6
      warmup: 1
    tiers: [targeted]
    est_minutes: 1
  - id: ob-512-200
    kind: single_stream
    params:
      label: Prompt 512
      description: "512 token prompt, 200 tokens out"
      prefill: 512
      decode: 200
      requests: 6
      warmup: 1
    tiers: [targeted]
    est_minutes: 1
  - id: ob-short-100
    kind: single_stream
    params:
      label: Short story
      description: "\"Write me a short story\", 100 tokens out"
      prompt: Write me a short story
      decode: 100
      requests: 6
      warmup: 1
    tiers: [targeted]
    est_minutes: 0.5
  - id: ob-advanced-500
    kind: single_stream
    params:
      label: Sampled 500
      description: "story prompt, temperature 0.7, top-p 0.95, seed 42, 500 tokens out, 10 runs"
      prompt: "Please write a descriptive story about a llama named Alonso who grows up to be President of the Land of Llamas. Include details about Alonso's childhood, adolescent years, and how he grew up to be a political mover and shaker. Write the story with a sense of whimsy."
      decode: 500
      requests: 10
      warmup: 2
      temperature: 0.7
      top_p: 0.95
      seed: 42
    tiers: [targeted]
    est_minutes: 2
  - id: ctx-4k-256
    kind: long_context
    params:
      label: Long prompt 4k
      description: "4k token prompt, 256 tokens out: prefill speed and decode on a long context"
      prefill: 4096
      decode: 256
      concurrency: 1
      requests: 4
      warmup: 1
    tiers: [targeted]
    est_minutes: 1.5
  - id: ctx-8k-256
    kind: long_context
    params:
      label: Long context 8k
      description: "8k token prompt, 256 tokens out: how speed holds as context grows"
      prefill: 8192
      decode: 256
      concurrency: 1
      requests: 3
      warmup: 1
    tiers: [targeted]
    est_minutes: 2.5
  - id: c4
    kind: concurrency
    params:
      label: 4 at once
      description: "4 requests sent together, 128 tokens in, 256 out: serving throughput and first token under load"
      concurrency: 4
      num_requests: 4
      prefill: 128
      decode: 256
    tiers: [targeted]
    est_minutes: 1.5

  # -- cold-cache prefill (fair definition): every request starts with its own
  # tag, so no engine's prefix cache can hit; prefill_tok_s needs cold_cache_verified
  - id: cold-ss-128-64
    kind: single_stream
    params:
      label: Cold 128
      description: "128-token prompt, 64 out, unique leading tag per request; prefill and TTFT with a cold cache"
      prefill: 128
      decode: 64
      requests: 6
      warmup: 1
      cold_cache: true
    tiers: [targeted]
    est_minutes: 1
  - id: cold-ss-512-200
    kind: single_stream
    params:
      label: Cold 512
      description: "512-token prompt, 200 out, unique leading tag per request; prefill and TTFT with a cold cache"
      prefill: 512
      decode: 200
      requests: 6
      warmup: 1
      cold_cache: true
    tiers: [targeted]
    est_minutes: 1
  - id: cold-ctx-4k-256
    kind: long_context
    params:
      label: Cold 4k
      description: "4k-token prompt, 256 out, unique leading tag per request; prefill and TTFT with a cold cache"
      prefill: 4096
      decode: 256
      concurrency: 1
      requests: 4
      warmup: 1
      cold_cache: true
    tiers: [targeted]
    est_minutes: 1.5
