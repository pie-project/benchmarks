  - {name: DeepSeek-V4.1-Flash, base_model: deepseek-ai/DeepSeek-V4.1-Flash, family: deepseek_v41, params_b: 552, active_b: 16, layers: 40, hidden_size: 5120, experts: 384, top_k: 6, context: 1048576, license: MIT, precision: fp8, mtp: true}  # plus a 196B Engram memory module
