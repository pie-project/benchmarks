# Tier composition. The base rule is the intersection of `tiers` across every
# component of a cell (engine, platform, artifact, workload, program, mode).
# `exclude` removes cells from a tier; `include` forces cells in. Selectors
# use the same fields as support.yaml.
#
# Time policy (applies to every tier):
#   * every job is sharded to ~`job_budget_minutes` of estimated work; one
#     job = one pod (or one Mac slot). A process group (one loaded model) is
#     never split across shards.
#   * a job that runs past budget × `kill_factor` is force-killed at three
#     levels: the node runner's watchdog, the workflow's timeout-minutes, and
#     the pod's own self-destruct timer. Cells it never reached are recorded
#     as not_run with the reason, never dropped.
#   * `max_jobs_per_platform` caps how many pods a tier may fan out to.
job_budget_minutes: 60
kill_factor: 2.0   # the pod timer starts at boot; the gate waits up to 8 min for the slowest launch and a cold pod preps ~10 min before the 60-min job (1.5 killed ten l40s-x2 shards of nightly 35942190398 mid-job)

# Removed from EVERY tier (not unsupported — just never scheduled here):
global_exclude:
  # a multi-GPU platform exists for tp>1; its tp1 cells are the single-GPU platform's job
  - {platform: l40s-x2, tp: 1}
  - {platform: pro6000-x4, tp: 1}
  - {platform: h100-sxm-x4, tp: 1}
  - {platform: a100-x2, tp: 1}
  - {platform: a100-pcie-x2, tp: 1}
  - {platform: pro6000-x2, tp: 1}
  # a 4-GPU platform exists for tp4 (tp2 is the 2-GPU platform's job)
  - {platform: pro6000-x4, tp: 2}
  - {platform: h100-sxm-x4, tp: 2}
  # the datacenter pods run tp = every GPU they hold
  - {platform: h200-x2, tp: 1}
  - {platform: h200-x4, tp: [1, 2]}
  - {platform: [a100-sxm-x8, h100-sxm-x8, h200-x8, b200-x8, b300-x8], tp: [1, 2, 4]}
  # the multi-GPU AMD pods: the datacenter models only, at tp = every GPU (MiMo-V2.6-Flash fits one MI350X)
  - {platform: mi350x-x2, tp: 1}
  - {platform: mi300x-x8, tp: [1, 2, 4]}
  - {platform: [mi350x-x2, mi300x-x8], not_artifact: [deepseek-v4.1-flash, glm-5.3-flash, glm-5.3, hy4-preview, mimo-v2.6-flash, kimi-k3, qwen3.8-flash-next-bf16, muse-spark-open, nemotron-3-ultra, minimax-m3.1-flash]}
  - {platform: mi350x-x2, artifact: mimo-v2.6-flash}
  # the datacenter models (hundreds of GiB to 1.5 TiB each) run a release's Raw row only
  - {artifact: [deepseek-v4.1-flash, glm-5.3-flash, glm-5.3, hy4-preview, mimo-v2.6-flash, kimi-k3, qwen3.8-flash-next-bf16, muse-spark-open, nemotron-3-ultra, minimax-m3.1-flash], not_workload: raw-512-256}
  # every TPU (backend xla) runs pie on its own Qwen3.5-0.8B artifact (models.yaml keeps that artifact off every other
  # platform) on a single request, a throughput shape and a release's Raw row (tpu.yml tier=weekly), and
  # the TPU builds of vLLM (vllm-tpu) and SGLang (sglang-jax) on the same bf16 checkpoint for the Raw row.
  # The other TPU models (the *-tpu artifacts) run the Raw row only, on all three.
  - {backend: xla, not_engine: [pie, vllm, sglang]}
  # the whole v5p-8 (4 chips, tp4) is for the datacenter models one chip cannot hold, nothing else
  - {platform: tpu-v5p-8-x4, tp: [1, 2]}
  - {platform: tpu-v5p-8-x4, not_artifact: [deepseek-v4.1-flash, glm-5.3-flash, glm-5.3, hy4-preview, mimo-v2.6-flash, kimi-k3, qwen3.8-flash-next-bf16, muse-spark-open, nemotron-3-ultra, minimax-m3.1-flash]}
  # the TPU device evaluation (#1184): the NVIDIA rows' 23 models, each in full where one chip holds it, else the NVIDIA
  # rows' cut for a chip of that size (32 GB: pro4500-x1's; 95 and 192 GB: the full model); pie, vLLM-TPU and SGLang-JAX
  # each run Raw, the c256 batch and the pf256-512 prefill batch
  - {backend: xla, not_platform: tpu-v5p-8-x4, engine: pie, not_artifact: [qwen3.5-0.8b-xla, qwen3-0.6b-tpu, gemma-4-e4b-tpu, gemma-4-e2b-tpu, gemma-4-12b-tpu, gpt-oss-20b-tpu, deepseek-v4-flash-mini-tpu, deepseek-v4.1-flash-mini8-tpu, glm-5.3-mini-tpu, glm-5.3-flash-mini8-fp8-tpu, glm-5.3-flash-mini4-tpu, hy4-mini6, mimo-v2.6-flash-mini-tpu, minimax-m3.1-flash-mini-tpu, muse-spark-mini4, nemotron-3-ultra-mini, qwen3.8-flash-next-mini, nemotron-3-super-mini, kimi-k3-mini8, gemma-4-26b-a4b-mini-e32, gemma-4-31b-mini18, gpt-oss-120b-mxfp4-mini24-e32, muse-glimmer-30b-mini12, qwen3.6-27b-mini12, qwen3.6-35b-a3b-mini-e32, qwen3.8-27b-mini20, gemma-4-26b-a4b-bf16, gemma-4-31b-bf16, gpt-oss-120b-tpu, muse-glimmer-30b, qwen3.6-27b-tpu, qwen3.6-35b-a3b-bf16, qwen3.8-27b-bf16, gpt-oss-20b-mxfp4-mini5, gpt-oss-120b-mxfp4-mini12-e32, nemotron-3-ultra-mini-e16, nemotron-3-super-mini22, kimi-k3-mini4-e16, gemma-4-26b-a4b-mini12, gemma-4-31b-mini6, muse-glimmer-30b-mini4, qwen3.6-27b-mini8, qwen3.6-35b-a3b-mini-e16, qwen3.8-27b-mini8]}
  - {backend: xla, not_platform: tpu-v5p-8-x4, engine: [vllm, sglang], not_artifact: [qwen3.5-0.8b-bf16, qwen3-0.6b-tpu, gemma-4-e4b-tpu, gemma-4-e2b-tpu, gemma-4-12b-tpu, gpt-oss-20b-tpu, deepseek-v4-flash-mini-tpu, deepseek-v4.1-flash-mini8-tpu, glm-5.3-mini-tpu, glm-5.3-flash-mini8-fp8-tpu, glm-5.3-flash-mini4-tpu, hy4-mini6, mimo-v2.6-flash-mini-tpu, minimax-m3.1-flash-mini-tpu, muse-spark-mini4, nemotron-3-ultra-mini, qwen3.8-flash-next-mini, nemotron-3-super-mini, kimi-k3-mini8, gemma-4-26b-a4b-mini-e32, gemma-4-31b-mini18, gpt-oss-120b-mxfp4-mini24-e32, muse-glimmer-30b-mini12, qwen3.6-27b-mini12, qwen3.6-35b-a3b-mini-e32, qwen3.8-27b-mini20, gemma-4-26b-a4b-bf16, gemma-4-31b-bf16, gpt-oss-120b-tpu, muse-glimmer-30b, qwen3.6-27b-tpu, qwen3.6-35b-a3b-bf16, qwen3.8-27b-bf16, gpt-oss-20b-mxfp4-mini5, gpt-oss-120b-mxfp4-mini12-e32, nemotron-3-ultra-mini-e16, nemotron-3-super-mini22, kimi-k3-mini4-e16, gemma-4-26b-a4b-mini12, gemma-4-31b-mini6, muse-glimmer-30b-mini4, qwen3.6-27b-mini8, qwen3.6-35b-a3b-mini-e16, qwen3.8-27b-mini8]}
  - {platform: [tpu-v6e-1, tpu-v5e-1, tpu-v4-8], artifact: [gemma-4-26b-a4b-bf16, gemma-4-31b-bf16, gpt-oss-120b-tpu, muse-glimmer-30b, qwen3.6-27b-tpu, qwen3.6-35b-a3b-bf16, qwen3.8-27b-bf16]}
  - {platform: [tpu-v5p-8, tpu7x-4], artifact: [gemma-4-26b-a4b-mini-e32, gemma-4-31b-mini18, gpt-oss-120b-mxfp4-mini24-e32, muse-glimmer-30b-mini12, qwen3.6-27b-mini12, qwen3.6-35b-a3b-mini-e32, qwen3.8-27b-mini20]}
  # the 16 GB v5e: its own cuts in place of the 32 GB ones and of the models whose whole weights leave it no KV room
  - {platform: tpu-v5e-1, artifact: [gemma-4-26b-a4b-mini-e32, gemma-4-31b-mini18, gpt-oss-120b-mxfp4-mini24-e32, muse-glimmer-30b-mini12, qwen3.6-27b-mini12, qwen3.6-35b-a3b-mini-e32, qwen3.8-27b-mini20, gpt-oss-20b-tpu, nemotron-3-ultra-mini, nemotron-3-super-mini, kimi-k3-mini8, gemma-4-12b-tpu, glm-5.3-flash-mini8-fp8-tpu]}
  - {backend: xla, not_platform: tpu-v5e-1, artifact: [gpt-oss-20b-mxfp4-mini5, gemma-4-26b-a4b-mini12, muse-glimmer-30b-mini4, glm-5.3-flash-mini4-tpu]}
  - {backend: xla, not_program: text-completion-bench}
  - {backend: xla, not_artifact: qwen3.5-0.8b-xla, not_workload: [raw-512-256, c256, pf256-512]}
  - {backend: xla, artifact: qwen3.5-0.8b-xla, not_workload: [ss-512-256, c32, raw-512-256, control-aa, c256, pf256-512]}

suites:
  smoke:
    # smoke must fit ONE job per platform (a commit gets one pod per GPU type).
    # est_minutes are provisional until calibrated (reports/calibration.md).
    max_jobs_per_platform: 2
    enforce_budget: true
    exclude:
      # every non-serving program runs on exactly one representative shape in smoke;
      # the full shape list is nightly's job
      - {program_category: speculative, not_workload: [ss-128-64]}
      - {program_category: adapter, not_workload: [ss-128-64]}
      - {program_category: kv_policy, not_workload: [lc-1k-128]}
      - {program: prefill-rows, not_workload: [lc-2k-128]}
      - {program: prefix-tree-kv-cache, not_workload: [prefix-1k-x64]}
      # 8k context and the length mix only on the two cheapest dense models in smoke
      - {workload: lc-8k-128, not_artifact: [qwen3.5-0.8b-bf16, gemma-4-e4b-bf16]}
      - {workload: mixed-256, not_artifact: [qwen3.5-0.8b-bf16, qwen3.6-35b-a3b-mini5]}
      - {workload: c32, not_artifact: [qwen3.5-0.8b-bf16, gemma-4-e4b-bf16, qwen3.6-35b-a3b-mini5]}
      # TP smoke is about sharding, not policies or long shapes
      - {tp: ">=2", program_category: kv_policy}
      - {tp: ">=2", program_category: adapter}
      - {tp: ">=2", program_category: speculative}
      - {tp: ">=2", not_workload: [control-aa, ss-128-64, c8, lc-2k-128]}
      - {tp: ">=2", not_artifact: [qwen3.5-0.8b-bf16, qwen3.6-35b-a3b-mini5, gpt-oss-20b-mxfp4-mini5, deepseek-v4-flash-mini5, deepseek-v4.1-flash-mini8, glm-5.3-flash-mini8, kimi-k3-mini8]}
    # smoke never runs baselines (engines.yaml already says so); it compares pie with pie history.
  nightly:
    max_jobs_per_platform: 48
    enforce_budget: true
    exclude:
      - {engine: vllm, workload: control-aa}
      - {engine: sglang, workload: control-aa}
      - {engine: llamacpp, workload: control-aa}
      - {engine: mlxlm, workload: control-aa}
      # the TPU nightly (tpu.yml schedule): Qwen3.5-0.8B's own shapes and the two miniatures' c256 batch, as before #1184
      - {backend: xla, not_artifact: [qwen3.5-0.8b-xla, deepseek-v4.1-flash-mini8, kimi-k3-mini8]}
      - {backend: xla, workload: [pf256-512, raw-512-256]}
      - {backend: xla, artifact: qwen3.5-0.8b-xla, workload: c256}
  weekly:
    max_jobs_per_platform: 400  # the device evaluation (matrix/device-eval.yaml) adds its 19 models and saturation sweeps to the weekly tier
    enforce_budget: true
    exclude: []
  targeted:
    max_jobs_per_platform: 20
    enforce_budget: false
    exclude:
      # every other engine runs its own arm, never pie's checkpoint (mlx-lm would measure the MLX one twice)
      - {not_engine: pie, baseline: false}
    include:
      - engine: pie
        baseline: false   # an arm is another engine's copy of the weights; pie has its own
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [control-aa, ss-128-64, ss-512-256, lc-1k-128, lc-2k-128, c8, c32]
      - engine: [mlxlm, llamacpp]
        baseline: true
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [ss-128-64, ss-512-256, lc-1k-128, lc-2k-128, c8, c32]
      # the Mac site: pie on its own checkpoints, every other engine on its copy of the same model
      - engine: pie
        baseline: false
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [ob-story-200, ob-512-200, raw-512-256, spec-512-256, ob-short-100, ob-advanced-500, ctx-4k-256, ctx-8k-256, c4, ss-512-256, c32, pf256-512, pf32-512, pf8-512]
      - engine: [llamacpp, mlxlm, splash]
        baseline: true
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [ob-story-200, ob-512-200, raw-512-256, spec-512-256, ob-short-100, ob-advanced-500, ctx-4k-256, ctx-8k-256, c4, ss-512-256, c32, pf256-512, pf32-512, pf8-512]
      # a model slice (a model cut to fit a smaller Mac): the same Mac rows, every engine on the same cut
      - engine: pie
        baseline: false
        program: text-completion-bench
        artifact_kind: miniature
        tp: 1
        os: macos
        workload: [raw-512-256, spec-512-256, c32, pf32-512, pf8-512]
      - engine: [llamacpp, mlxlm, splash]
        baseline: true
        program: text-completion-bench
        artifact_kind: miniature
        tp: 1
        os: macos
        workload: [raw-512-256, spec-512-256, c32, pf32-512, pf8-512]
      # cold-cache prefill (fair definition): every engine gets the same cold prompt list
      - engine: pie
        baseline: false
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [cold-ss-128-64, cold-ss-512-200, cold-ctx-4k-256]
      - engine: [mlxlm, llamacpp, splash]
        baseline: true
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [cold-ss-128-64, cold-ss-512-200, cold-ctx-4k-256]
      # Qwen3.8-Flash-Next with 2-bit experts does not fit a 16 GB Mac: every engine runs the same miniature there
      - engine: pie
        baseline: false
        program: text-completion-bench
        artifact: qwen3.8-flash-next-mlx2-mini8
        tp: 1
        os: macos
        workload: [raw-512-256, c32, pf256-512, pf32-512, pf8-512]
      - engine: [mlxlm, llamacpp, splash]
        baseline: true
        program: text-completion-bench
        artifact: [qwen3.8-flash-next-mlx2-mini8-mlxlm, qwen3.8-flash-next-q2k-mini8-llamacpp, qwen3.8-flash-next-q2k-mini8-splash]
        tp: 1
        os: macos
        workload: [raw-512-256, c32, pf256-512, pf32-512, pf8-512]

# Escalation: when a smoke cell of a family is flagged (regression confirmed),
# every nightly cell of that family on the same platform is promoted into the
# next nightly run even if it would not be scheduled that night.
escalation:
  on_smoke_regression_promote_family_to_nightly: true
