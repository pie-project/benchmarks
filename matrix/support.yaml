  - when: {engine: vllm, program: parity, artifact: hy4-mini6, platform: [a100-sxm-x1, l40s-x1, rtx4090-x1]}
    reason: "vLLM 0.32.0 has no sparse MLA backend for Hy4 on this arch and refuses dense fallback"
  - when: {engine: vllm, program: parity, artifact: hy4-mini6, platform: [h100-sxm-x1, h200-x1, b200-x1, b300-x1]}
