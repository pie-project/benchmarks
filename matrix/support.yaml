# Explicit support declarations. Anything matched here becomes a
# `declared_unsupported` cell: it is kept in the matrix and shown in the
# coverage report, but not run. Anything NOT matched here that then fails
# is a `fail` — which is the point: the wiki's "real LLMs at tp>1 are blocked
# by register_program" is a fail, not an unsupported.
#
# Selector fields: engine, backend, os, arch, platform, family, scheme,
# source_format, artifact_kind, program, program_category, workload, tp
# (int or ">1"/">=4"), spec_dec. All listed fields must match.
unsupported:
  # TPUs the project cannot get (tpu.yml, release 0.5.3-b5): v4 lives only in us-central2-b, which the
  # organization's resource-location policy blocks (LOCATION_POLICY_VIOLATED, on demand and spot); TPU7x only
  # in us-central1, where the project's Compute Engine TPU7X quota is 0 (TPUS_PER_TPU_FAMILY, both zones)
  # engine-xla plans one device (its coverage example traces tp1 deployments only)
  - when: {engine: pie, backend: xla, tp: ">1"}
    reason: "pie's XLA engine serves a model on one TPU device; this model needs more HBM than one chip has"
  - when: {platform: tpu-v4-8}
    reason: "no access: TPU v4 is only offered in us-central2-b, which the GCP organization's location policy blocks for this project"
  - when: {platform: tpu7x-4}
    reason: "no quota: the project's TPU7x (Ironwood) quota is 0 in us-central1, its only region (TPUS_PER_TPU_FAMILY)"
  # SGLang 0.5.20 cannot serve kimi-k3's widest shapes on a 48 GB L40S at any static fraction: at 0.75
  # no KV fits beside the 256-wide graph, from 0.79 the MoE prefill OOMs by 768 MiB (nightlies 36212036845, 36264810212, 36295501246)
  # SGLang 0.5.22 cannot serve the Kimi-K3 mini4 on a 24 GB RTX 4090 at c64 or pf16-512: below 0.78 static its pool holds
  # no KDA state ("max_mamba_cache_size=-7", total_rest_memory -0.20 GB at 0.76), at 0.75 and up its MoE prefill OOMs past
  # the pool (754 MiB wanted, 617 MiB free); vLLM and pie serve both
  - when: {engine: sglang, family: kimi_k3, platform: rtx4090-x1, workload: c64}
    reason: "SGLang: kimi-k3 mini c64 on 24 GB has no mem_fraction_static that fits both the KDA state pool and the MoE prefill"
  - when: {engine: sglang, family: kimi_k3, platform: rtx4090-x1, workload: pf16-512}
    reason: "SGLang: kimi-k3 mini pf16-512 on 24 GB has no mem_fraction_static that fits both the KDA state pool and the MoE prefill"
  - when: {engine: sglang, family: kimi_k3, platform: l40s-x1, workload: kv-oversub}
    reason: "SGLang: kimi-k3 kv-oversub on 48 GB has no mem_fraction_static that fits both KV and the MoE prefill"
  - when: {engine: sglang, family: kimi_k3, platform: l40s-x1, workload: c256}
    reason: "SGLang: kimi-k3 c256 on 48 GB has no mem_fraction_static that fits both KV and the 256-wide graph"
  - when: {engine: sglang, family: kimi_k3, platform: l40s-x1, workload: pf256-512}
    reason: "SGLang: kimi-k3 256-wide batch on 48 GB has no mem_fraction_static that fits both KV and the graph"
  # Splash 1.3.2 pairs every model with its DFlash2 draft and has no flag to serve without it
  - when: {engine: splash, workload: raw-512-256}
    reason: "Splash always drafts: no flag turns speculation off, so it has no raw row"
  - when: {engine: splash, workload: c32}
    reason: "Splash always drafts: no flag turns speculation off, so it has no plain batched row"
  - when: {engine: splash, workload: c64}
    reason: "Splash always drafts: no flag turns speculation off, so it has no plain batched row"
  - when: {engine: splash, workload: c256}
    reason: "Splash always drafts: no flag turns speculation off, so it has no plain batched row"
  - when: {engine: splash, workload: c8}
    reason: "Splash always drafts: no flag turns speculation off, so it has no plain batched row"
  - when: {engine: splash, workload: c4}
    reason: "Splash always drafts: no flag turns speculation off, so it has no plain batched row"
  - when: {engine: splash, workload: pf32-512}
    reason: "Splash always drafts: no flag turns speculation off, so it has no plain batched row"
  - when: {engine: splash, workload: pf8-512}
    reason: "Splash always drafts: no flag turns speculation off, so it has no plain batched row"
  # TensorRT-LLM: the adapter serves plain decoding only (its drafters, EAGLE-3 / MTP / n-gram, are not wired in)
  - when: {engine: trtllm, workload: spec-512-256}
    reason: "TensorRT-LLM rows decode plain: its speculative modes are not wired into the harness"
  - when: {engine: trtllm, spec_dec: [dflash2, mtp, ngram, rs, eagle, dspark]}
    reason: "TensorRT-LLM rows decode plain: its speculative modes are not wired into the harness"
  # TensorRT-LLM 1.4.0rc2.post1's PyTorch backend registers no model class for these checkpoints' architectures
  # (tensorrt_llm/_torch/models: no HYV4ForCausalLM, MiMoV2ForCausalLM, MuseGlimmer*, MuseSpark*), so it cannot load them
  - when: {engine: trtllm, family: [hy_v4, mimo_v2, muse_glimmer, muse_spark]}
    reason: "TensorRT-LLM 1.4.0rc2.post1 has no implementation of this architecture (HYV4, MiMoV2, Muse): it cannot load the checkpoint"
  # TensorRT-LLM 1.4.0rc2.post1 serves Kimi-K3's MXFP4 experts only as W4A8 (MXFP8 activations), and only on SM100
  # ("no MoE implementation can serve this layer": every W4A16 MXFP4 kernel turned it down as quant_unsupported, h200-x1
  # and rtx5090-x1); pie, vLLM and SGLang serve it W4A16, so no TensorRT-LLM row is the same precision
  - when: {engine: trtllm, family: kimi_k3}
    reason: "TensorRT-LLM runs Kimi-K3's experts only with MXFP8 activations (W4A8, SM100 only); the other engines serve them W4A16"
  # DeepSeek-V4.1's CSA2 projections run on TensorRT-LLM's native MXFP8 kernels, SM100/SM103 only
  # ("CSA2 native MXFP8 projections require SM100/SM103", rtx5090-x1, h200-x1)
  - when: {engine: trtllm, family: deepseek_v41, not_platform: [b200-x1, b200-x8, b300-x1, b300-x8]}
    reason: "TensorRT-LLM runs DeepSeek-V4.1's CSA2 projections only on SM100/SM103 (B200, B300)"
  # GLM-5.3's DSA sparse MLA on SM120 needs the fp8_ds_mla KV cache ("DeepSeek-V4/DSA sparse MLA on SM120/SM121 requires
  # kv_cache_config.dtype='fp8_ds_mla'", rtx5090-x1); the other engines keep its KV in bf16
  - when: {engine: trtllm, family: glm_moe_dsa, arch: blackwell, platform: [rtx5090-x1, pro4500-x1, pro6000-x1, pro6000-x2, pro6000-x4]}
    reason: "TensorRT-LLM serves GLM-5.3's sparse MLA on SM120 only with an fp8 KV cache; the other engines keep it bf16"
  # GLM-5.3 and GLM-5.3-Flash keep their experts in block FP8, and TensorRT-LLM's block-FP8 MoE kernels (DeepGEMM, Triton,
  # trtllm-gen) start at SM90: "no MoE implementation can serve this layer ... Fp8BlockScalesImpl=sm_unsupported" (l40s-x1, a100-sxm-x1)
  - when: {engine: trtllm, family: [glm_moe_dsa, glm5_next], arch: [ada, ampere]}
    reason: "TensorRT-LLM has no block-FP8 MoE kernel below SM90 (Hopper): it cannot serve GLM-5.3's FP8 experts here"
  # GLM-5.3-Flash's sparse attention forward kernel is SM90a/SM100f only ("Sparse Attention Forward Kernel is only supported on
  # SM90a and SM100f architectures", pro6000-x1, pro4500-x1)
  - when: {engine: trtllm, family: glm5_next, platform: [rtx5090-x1, pro4500-x1, pro6000-x1, pro6000-x2, pro6000-x4]}
    reason: "TensorRT-LLM's sparse attention kernel for GLM-5.3-Flash runs on SM90a and SM100 only, not on SM120"
  # TensorRT-LLM builds Gemma-4's vision and audio towers too (its text-only switch covers Qwen3-VL and Mistral3 only): loading
  # the E4B checkpoint took 18.8 GiB and its 5.25 GiB embedding copy then did not fit the 24 GB card (rtx4090-x1)
  - when: {engine: trtllm, artifact: gemma-4-e4b-bf16, platform: rtx4090-x1}
    reason: "TensorRT-LLM loads Gemma-4-E4B with its vision and audio towers and has no text-only switch for it: it does not fit 24 GB"
  # TensorRT-LLM's DeepSeek-V4 needs Hopper or newer ("DeepSeek-V4 requires Hopper or newer GPUs, got SM80/SM89")
  - when: {engine: trtllm, family: deepseek_v4, arch: [ada, ampere]}
    reason: "TensorRT-LLM runs DeepSeek-V4 only on Hopper or newer GPUs"
  # TensorRT-LLM builds Gemma-4 with its vision tower and has no text-only switch for it: the 31B cuts that fit 24 and 32 GB
  # for the other engines did not ("Executor creation failed due to insufficient GPU memory ... Model", rtx4090-x1 mini12,
  # rtx5090-x1 mini18)
  - when: {engine: trtllm, artifact: [gemma-4-31b-mini12, gemma-4-31b-mini18], platform: [rtx4090-x1, rtx5090-x1, pro4500-x1]}
    reason: "TensorRT-LLM loads Gemma-4 with its vision tower (no text-only switch): this cut does not fit the card for it"
  - when: {engine: trtllm, artifact: gemma-4-31b-mini, platform: [l40s-x1, a40-x1]}
    reason: "TensorRT-LLM loads Gemma-4 with its vision tower (no text-only switch): this cut does not fit the card for it"
  # on SM90 FlashMLA's sparse prefill asserts on GLM-5.3-Flash's top-k ("Assertion `params.topk % (2*B_TOPK) == 0` failed",
  # flashmla sm90 prefill phase1.cuh, h100-sxm-x1)
  - when: {engine: trtllm, family: glm5_next, arch: hopper}
    reason: "TensorRT-LLM's SM90 sparse prefill kernel (FlashMLA) asserts on GLM-5.3-Flash's index top-k"
  # TensorRT-LLM's DeepSeek-V4 MoE kernel takes 256 or 384 experts ("n_experts must be 256 or 384", pro6000-x1, pro4500-x1);
  # the miniature keeps the first 16
  - when: {engine: trtllm, artifact: [deepseek-v4-flash-mini, deepseek-v4-flash-mini43]}
    reason: "TensorRT-LLM's DeepSeek-V4 MoE kernel needs all 256 (or 384) experts; the miniature keeps 16"
  # MiniMax-M3.1-Flash's experts found no TensorRT-LLM MoE kernel on SM80, SM90 or SM120 ("no MoE implementation can serve this
  # layer ... quant_unsupported", a100-sxm-x1, h100-sxm-x1, h200-x1, pro6000-x1), and on SM100 its loader found no w1/w3 for the
  # miniature's experts (b200-x1)
  - when: {engine: trtllm, family: minimax_m3}
    reason: "TensorRT-LLM 1.4.0rc2.post1 has no MoE kernel for MiniMax-M3.1-Flash's experts on these GPUs (SM80/SM90/SM120), and its loader refuses the miniature on SM100"
  # gpt-oss's MXFP4 experts have no SM80/SM89 MoE kernel ("no MoE implementation can serve this layer", a100-sxm-x1, l40s-x1)
  - when: {engine: trtllm, family: gpt_oss, arch: [ampere, ada]}
    reason: "TensorRT-LLM has no MXFP4 MoE kernel on Ampere or Ada (SM80-SM89) for gpt-oss"
  # Gemma-4-31B bf16: TensorRT-LLM's worker process died initialising it on every 80-141 GB card ("MPI worker exited
  # unexpectedly", a100-sxm-x1, h100-sxm-x1, h200-x1); it serves on the 180 GB B200
  - when: {engine: trtllm, artifact: gemma-4-31b-bf16, platform: [a100-sxm-x1, h100-sxm-x1, h200-x1]}
    reason: "TensorRT-LLM's worker dies initialising Gemma-4-31B (with its vision tower) on this card"
  # the browser rows (webgpu platforms). WebLLM 0.2.87's MLCEngine serves one request at a time: every request takes
  # the loaded model's lock (engine.ts asyncGenerate), so there is no batched decode or prefill to measure
  - when: {engine: webllm, workload: [c32, pf32-512]}
    reason: "WebLLM decodes one sequence at a time: MLCEngine serializes requests on the model's lock, so it has no batched decode or batched prefill"
  # WebLLM runs only an MLC-compiled build. mlc-ai ships three of the browser rows' 14 models (Qwen3.5-4B, Qwen3.5-9B,
  # Gemma-4-E2B); Qwen3.6-27B and Qwen3.8-27B are compiled here from the same cut (models.yaml *-webllm-slice). The rest
  # mlc-llm cannot build: `mlc_llm gen_config` at mlc-llm 44fd06d (2026-10-30, web-llm 0.2.87's) on each release's config
  # stops with these errors. Its Gemma 4 port is the dense E2B shape only (gemma4_config.py), and it has no Qwen3.5-MoE,
  # gpt-oss, Muse-Glimmer, Gemma-4 unified or Qwen4-exp model
  - when: {engine: webllm, artifact: gemma-4-e4b-webllm}
    reason: "mlc-llm cannot build it: ValueError: The first Gemma 4 target requires 8 query heads and one KV head (Gemma-4-E4B has 2 KV heads)"
  - when: {engine: webllm, artifact: gemma-4-12b-webllm}
    reason: "mlc-llm cannot build it: ValueError: Unknown model type: gemma4_unified"
  - when: {engine: webllm, artifact: [gemma-4-26b-a4b-webllm-slice, gemma-4-31b-webllm-slice]}
    reason: "mlc-llm cannot build it: ValueError: The text+audio milestone supports causal attention only (mlc-llm's Gemma 4 is the dense E2B shape; this model's attention is bidirectional over images, its K equals V)"
  - when: {engine: webllm, artifact: qwen3.6-35b-a3b-webllm-slice}
    reason: "mlc-llm cannot build it: ValueError: Unknown model type: qwen3_5_moe"
  - when: {engine: webllm, artifact: [gpt-oss-20b-webllm-slice, gpt-oss-120b-webllm-slice-e10]}
    reason: "mlc-llm cannot build it: ValueError: Unknown model type: gpt_oss"
  - when: {engine: webllm, artifact: muse-glimmer-30b-webllm-slice}
    reason: "mlc-llm cannot build it: ValueError: Unknown model type: muse_glimmer"
  - when: {engine: webllm, artifact: qwen3.8-flash-next-webllm-mini}
    reason: "mlc-llm cannot build it: ValueError: Unknown model type: qwen4_exp"
  # GLM-5.3-Flash on SM100: its KDA convolution indexes the batch with 32-bit offsets and overflowed even at 128 sequences
  # ("KDA convolution tensor offsets must fit int32", b200-x1); with the SM80/SM89/SM90/SM120 limits above no GPU serves it
  - when: {engine: trtllm, family: glm5_next}
    reason: "TensorRT-LLM 1.4.0rc2.post1 cannot serve GLM-5.3-Flash here (KDA int32 offsets on SM100; sparse attention kernels missing or asserting elsewhere)"
  # DeepSeek-V4.1 on SM100: the loader refuses the checkpoint's Engram token map ("weight load is incomplete ... engram.token_map",
  # b200-x1); elsewhere its CSA2 projections need SM100
  - when: {engine: trtllm, family: deepseek_v41}
    reason: "TensorRT-LLM 1.4.0rc2.post1 cannot serve DeepSeek-V4.1 here (CSA2 projections need SM100; on SM100 its loader refuses the Engram token map)"
  # llama.cpp has no browser cell for Qwen3.8-Flash-Next: the Macs' Q2_K cut is not on the hub, and a slice of unsloth's
  # GGUF keeps the whole n-gram embedding table (gguf_slice: 113 of 1224 tensors, 98.95 GiB of the BF16 release for
  # pie's 4-layer, 16-expert miniature), which no tab holds; shrink_checkpoint.py carves that table, gguf_slice does not
  # pie's WebGPU engine (pie f37f5533) on the browser rows: the Qwen3.8-Flash-Next miniature's n-gram table is one 6.0 GiB
  # plane ("this fire wants 6400491520 bytes of one plane in one buffer and the load reserved 4294967292"), past the 4 GiB a
  # WebGPU buffer may hold (maxBufferSize, Chrome on an RTX 4090 and 5090)
  - when: {engine: pie, backend: webgpu, artifact: qwen3.8-flash-next-mini-web}
    reason: "pie's WebGPU engine needs one 6.0 GiB buffer for this model's n-gram table; WebGPU caps a buffer at 4 GiB"
  # the Qwen3.6-35B-A3B cut: pie's WGSL matmul writes bf16 outputs in pairs and refuses the shared-expert gate's one
  # output column ("`linear.matmul` would not enqueue: the projection lands 1 columns, odd")
  - when: {engine: pie, backend: webgpu, artifact: qwen3.6-35b-a3b-mlx4-slice}
    reason: "pie's WebGPU matmul writes bf16 outputs in pairs and refuses Qwen3.6-35B-A3B's one-column shared-expert gate"
  - when: {backend: metal, tp: ">1"}
    reason: "no tensor parallel on Metal"
  - when: {backend: vulkan, tp: ">1"}
    reason: "no tensor parallel on Vulkan"
  - when: {backend: wgpu, tp: ">1"}
    reason: "no tensor parallel on wgpu"
  # engine-cuda's CANNOT_SERVE list is empty at pie 6875edb (the dsv41 rows dispatch on CUDA), and vLLM 0.31.0
  # (DeepseekV41ForCausalLM) and SGLang 0.5.22 (deepseek_v4.py, model_type deepseek_v41) both ship V4.1
  # pie #1056 carries Nemotron-3 Ultra as released (every weight bf16)
  # weekly 39867658406: on sm_120 SGLang runs MiMo's MXFP4 experts through its FP8 triton MoE, which asserts on the packed width
  - when: {engine: sglang, artifact: mimo-v2.6-flash, platform: pro6000-x4}
    reason: "SGLang 0.5.22 sends MiMo-V2.6-Flash's MXFP4 experts to its FP8 triton MoE on sm_120 (fused_experts: Hidden size mismatch)"
  # weekly 40405793203 / 40415491631: vLLM's DeepSeek-V4 kernels need Hopper's bf16x2 math and e4m3 in triton
  - when: {engine: vllm, family: deepseek_v41, arch: ada, not_platform: [l4-x1, rtx4090-x1]}   # pie-project/vllm pie-evals/v0.32.0 serves it below sm_90
    reason: "vLLM 0.32's DeepSeek-V4 dequant_gather_k kernel fails ptxas below sm_90 (\"Feature 'mul.bf16x2' requires .target sm_90\"; l40s-x1)"
  # pie-project/vllm#18 (pie-evals/v0.32.0) lowers Triton's e4m3 casts to integer code below sm_89, so Ampere serves it
  # weekly 40415491631 / 40465375938 (pro6000-x1): on sm_120 neither baseline has a V4.1 attention path.
  # vLLM's FlashInfer DSv4.1 backend takes 128-token kernel blocks only, and at that default the SM120
  # sparse-MLA decode is handed 32-token pages while FlashInfer builds it for 64 only; --block-size 64 is
  # refused ("No common block size for 64 (FLASHINFER_MLA_SPARSE_DSV41: [128])"). SGLang sends capability
  # >= 10 to the candidate indexer, whose DeepGEMM paged sparse MQA logits it enables on SM100 only
  # (deep_gemm_wrapper/configurer.py), so the JIT DeepGEMM switch cannot help there
  - when: {engine: vllm, family: deepseek_v41, platform: [pro6000-x2, pro6000-x4, pro6000-maxq-x1, pro6000-mig24-x1, pro6000-mig48-x1, pro6000-wk-x1, pro5000-x1, pro4500bw-x1, pro4500bw-se-x1, pro4000-x1, rtx5080-x1]}
    reason: "vLLM 0.32's SM120 sparse-MLA decode takes 64-token pages only and its DSv4.1 backend 128-token blocks only (\"page_block_size=32 is unsupported\"; with --block-size 64 \"No common block size\")"
  - when: {engine: sglang, family: deepseek_v41, platform: [pro6000-x2, pro6000-x4, pro6000-maxq-x1, pro6000-mig24-x1, pro6000-mig48-x1, pro6000-wk-x1, pro5000-x1, pro4500bw-x1, pro4500bw-se-x1, pro4000-x1, rtx5080-x1]}
    reason: "SGLang 0.5.22's V4.1 candidate indexer needs DeepGEMM's paged sparse MQA logits, which it enables on SM100 only (\"the candidate indexer needs DeepGEMM's paged sparse MQA logits\" on sm_120)"
  # weekly 39999127297 (h200-x4): MiniMax-M3.1-Flash ships MXFP8 projections beside NVFP4 experts
  - when: {engine: vllm, artifact: minimax-m3.1-flash}
    reason: "vLLM 0.31.0 reads MiniMax-M3.1-Flash's NVFP4 experts as MXFP8 (expert load: size of tensor a (192) must match b (384))"
  - when: {engine: sglang, artifact: minimax-m3.1-flash, platform: [h200-x4, h100-sxm-x4]}
    reason: "SGLang 0.5.22 runs MXFP8 checkpoints on SM100 or newer only (\"mxfp8 is not supported for the current GPU. Minimum capability: 100\")"
  # weekly 40421366253: the miniature keeps the release's widths, so it fails as the full model does
  - when: {engine: vllm, artifact: minimax-m3.1-flash-mini, not_platform: [l40s-x1, pro6000-x1, h100-sxm-x1, h200-x1, pro4500-x1, rtx5090-x1, l4-x1, a40-x1, rtx4090-x1]}   # pie-project/vllm pie-evals/v0.32.0 loads it on L40S, the RTX PRO 6000, the H100 and the H200
    reason: "vLLM 0.32.0 reads MiniMax-M3.1-Flash's NVFP4 experts as MXFP8 (expert load: size of tensor a (192) must match b (384))"
  - when: {engine: sglang, artifact: minimax-m3.1-flash-mini, arch: [ampere], not_platform: [a40-x1]}   # ada and hopper: pie-project/sglang pie-evals/v0.5.22 runs it (MXFP8 to block FP8 on sm_89 to sm_99)
    reason: "SGLang 0.5.22 runs MXFP8 checkpoints on SM100 or newer only (\"mxfp8 is not supported for the current GPU. Minimum capability: 100\")"
  - when: {engine: sglang, artifact: minimax-m3.1-flash-mini, platform: [pro6000-x2, pro6000-x4]}
    reason: "SGLang 0.5.22 reads MiniMax-M3.1-Flash's NVFP4 experts as MXFP8 on sm_120 (expert load: size of tensor a (192) must match b (384))"
  # pie refuses the attention-only KV-policy inferlets on hybrid (recurrent-state) models:
  # nightly 35935510089, Qwen3.5-0.8B and the Qwen3.6-35B-A3B mini on the 4090
  - when: {program_category: kv_policy, family: qwen3_5}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen3_5 forward pass is hybrid"
  - when: {program_category: kv_policy, family: qwen3_6}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen3_6 forward pass is hybrid"
  - when: {program_category: kv_policy, family: qwen3_6_moe}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen3_6_moe forward pass is hybrid"
  - when: {program_category: kv_policy, family: qwen4_exp}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen4_exp forward pass is hybrid"
  - when: {program_category: kv_policy, family: glm5_next}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the glm5_next forward pass is hybrid"
  - when: {program_category: kv_policy, family: kimi_k3}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the kimi_k3 forward pass is hybrid"
  - when: {program_category: kv_policy, family: nemotron_h}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the nemotron_h forward pass is hybrid"
  # gemma-4's sliding layers read a windowed kv ring, which pie holds as the bounded half of a
  # hybrid pass (pie #800): every kv_policy cell of E4B, 31B and 26B-A4B is refused at the gate
  # (local 4090 nightly at pie fe81583, shards s00/s03/s04)
  - when: {program_category: kv_policy, family: gemma4}
    reason: "attention-only KV policies are not valid on a windowed kv ring (pie: use pie:inferlet/forward-hybrid); the gemma4 forward pass is hybrid"
  - when: {program_category: kv_policy, family: gemma4_moe}
    reason: "attention-only KV policies are not valid on a windowed kv ring (pie: use pie:inferlet/forward-hybrid); the gemma4_moe forward pass is hybrid"
  # SGLang 0.5.20 cannot run gemma-4: every cell dies in its own code with
  # "view size is not compatible with input tensor's size and stride" / "shape '[-1, 1024]' is invalid" (L40S, 4090, 5090, A100 x2)
  # (on the MI300X SGLang 0.5.22 serves gemma-4: E4B raw 6/6, then an abort in its teardown the harness now tolerates)
