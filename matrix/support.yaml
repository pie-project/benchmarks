# Explicit support declarations. Anything matched here becomes a
# `declared_unsupported` cell: it is kept in the matrix and shown in the
# coverage report, but not run. Anything NOT matched here that then fails
# is a `fail` — which is the point: the wiki's "real LLMs at tp>1 are blocked
# by register_program" is a fail, not an unsupported.
#
# Selector fields: engine, backend, os, arch, platform, family, scheme,
# source_format, artifact_kind, program, program_category, workload, tp
# (int or ">1"/">=4"), spec_dec. All listed fields must match.
unsupported:
  # TPUs the project cannot get (tpu.yml, release 0.5.3-b5): v4 lives only in us-central2-b, which the
  # organization's resource-location policy blocks (LOCATION_POLICY_VIOLATED, on demand and spot); TPU7x only
  # in us-central1, where the project's Compute Engine TPU7X quota is 0 (TPUS_PER_TPU_FAMILY, both zones)
  # engine-xla plans one device (its coverage example traces tp1 deployments only)
  - when: {engine: pie, backend: xla, tp: ">1"}
    reason: "pie's XLA engine serves a model on one TPU device; this model needs more HBM than one chip has"
  - when: {platform: tpu-v4-8}
    reason: "no access: TPU v4 is only offered in us-central2-b, which the GCP organization's location policy blocks for this project"
  - when: {platform: tpu7x-4}
    reason: "no quota: the project's TPU7x (Ironwood) quota is 0 in us-central1, its only region (TPUS_PER_TPU_FAMILY)"
  # SGLang 0.5.20 cannot serve kimi-k3's widest shapes on a 48 GB L40S at any static fraction: at 0.75
  # no KV fits beside the 256-wide graph, from 0.79 the MoE prefill OOMs by 768 MiB (nightlies 36212036845, 36264810212, 36295501246)
  - when: {engine: sglang, family: kimi_k3, platform: l40s-x1, workload: kv-oversub}
    reason: "SGLang: kimi-k3 kv-oversub on 48 GB has no mem_fraction_static that fits both KV and the MoE prefill"
  - when: {engine: sglang, family: kimi_k3, platform: l40s-x1, workload: c256}
    reason: "SGLang: kimi-k3 c256 on 48 GB has no mem_fraction_static that fits both KV and the 256-wide graph"
  # Splash 1.3.2 pairs every model with its DFlash2 draft and has no flag to serve without it
  - when: {engine: splash, workload: raw-512-256}
    reason: "Splash always drafts: no flag turns speculation off, so it has no raw row"
  - when: {backend: metal, tp: ">1"}
    reason: "no tensor parallel on Metal"
  - when: {backend: vulkan, tp: ">1"}
    reason: "no tensor parallel on Vulkan"
  - when: {backend: wgpu, tp: ">1"}
    reason: "no tensor parallel on wgpu"
  # engine-cuda has no selected reader in pool.cuh, so every dsv4 flash row (and the V4.1 rows)
  # is on its CANNOT_SERVE list for attention.pool_lse_selected; Metal, Vulkan and wgpu cover it
  - when: {family: deepseek_v4, engine: pie, backend: cuda}
    reason: "engine-cuda refuses attention.pool_lse_selected (dsv4 flash rows are CANNOT_SERVE on CUDA; Metal/Vulkan/wgpu only)"
  # engine-cuda's CANNOT_SERVE list is empty at pie 6875edb (the dsv41 rows dispatch on CUDA), and vLLM 0.31.0
  # (DeepseekV41ForCausalLM) and SGLang 0.5.22 (deepseek_v4.py, model_type deepseek_v41) both ship V4.1
  # Muse Spark (MuseSparkForConditionalGeneration) is in neither vLLM 0.31.0's registry nor SGLang 0.5.22's models
  - when: {family: muse_spark, engine: vllm}
    reason: "vLLM 0.31.0 has no Muse Spark model (MuseSparkForConditionalGeneration is not in its registry)"
  - when: {family: muse_spark, engine: sglang}
    reason: "SGLang 0.5.22 has no Muse Spark model (no muse_spark in sglang/srt/models)"
  # pie's nemotron_h package is Nemotron-3 Super as NVIDIA's NVFP4 export: its dims (88 layers, 4096 wide) and its one
  # deployment (bf16 + NVFP4 experts + FP8 projections) are fixed in model.poem, so Ultra's bf16 release has no row
  - when: {engine: pie, artifact: nemotron-3-ultra}
    reason: "pie has no Nemotron-3 Ultra row: its nemotron_h package carries only Super (88 layers, 4096 wide) as the NVFP4 export, not Ultra's 8192-wide bf16 release"
  # pie refuses the attention-only KV-policy inferlets on hybrid (recurrent-state) models:
  # nightly 35935510089, Qwen3.5-0.8B and the Qwen3.6-35B-A3B mini on the 4090
  - when: {program_category: kv_policy, family: qwen3_5}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen3_5 forward pass is hybrid"
  - when: {program_category: kv_policy, family: qwen3_6}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen3_6 forward pass is hybrid"
  - when: {program_category: kv_policy, family: qwen3_6_moe}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen3_6_moe forward pass is hybrid"
  - when: {program_category: kv_policy, family: qwen4_exp}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen4_exp forward pass is hybrid"
  - when: {program_category: kv_policy, family: glm5_next}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the glm5_next forward pass is hybrid"
  - when: {program_category: kv_policy, family: kimi_k3}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the kimi_k3 forward pass is hybrid"
  - when: {program_category: kv_policy, family: nemotron_h}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the nemotron_h forward pass is hybrid"
  # gemma-4's sliding layers read a windowed kv ring, which pie holds as the bounded half of a
  # hybrid pass (pie #800): every kv_policy cell of E4B, 31B and 26B-A4B is refused at the gate
  # (local 4090 nightly at pie fe81583, shards s00/s03/s04)
  - when: {program_category: kv_policy, family: gemma4}
    reason: "attention-only KV policies are not valid on a windowed kv ring (pie: use pie:inferlet/forward-hybrid); the gemma4 forward pass is hybrid"
  - when: {program_category: kv_policy, family: gemma4_moe}
    reason: "attention-only KV policies are not valid on a windowed kv ring (pie: use pie:inferlet/forward-hybrid); the gemma4_moe forward pass is hybrid"
  # SGLang 0.5.20 cannot run gemma-4: every cell dies in its own code with
  # "view size is not compatible with input tensor's size and stride" / "shape '[-1, 1024]' is invalid" (L40S, 4090, 5090, A100 x2)
  - when: {engine: sglang, family: gemma4, not_backend: xla}  # the TPU runs sglang-jax, its own codebase
    reason: "SGLang 0.5.20 gemma-4 crashes in its attention/view path on every card tried; revisit at the next pin"
  # sglang-jax 0.1.0rc0 loads only the gemma-4 layout it was written for: E2B/E4B die at startup on
  # "'>=' not supported between 'int' and 'NoneType'" (no global KV heads), 12B on model type gemma4_unified (b5 39575054600)
  - when: {engine: sglang, family: gemma4, backend: xla}
    reason: "sglang-jax 0.1.0rc0 cannot load the gemma-4 E2B/E4B/12B checkpoints; revisit at the next pin"
  # SGLang 0.5.20 has no mxfp4 MoE kernel before Hopper: gpt-oss-20b decodes through a dequant fallback —
  # A100 ss-512-256 12 tok/s and lc-8k 5 tok/s (nightly 36082960398 s05, two cells ate the shard's hour),
  # 4090 ss 25 tok/s; the H100 (1189 tok/s at c64) and Blackwell cards keep the baseline
  - when: {engine: sglang, family: gpt_oss, arch: ampere}
    reason: "SGLang 0.5.20 gpt-oss mxfp4 falls back to dequant on Ampere: 5-12 tok/s, not a baseline"
  - when: {engine: sglang, family: gpt_oss, arch: ada}
    reason: "SGLang 0.5.20 gpt-oss mxfp4 falls back to dequant on Ada: ~25 tok/s single-stream, not a baseline"
  # SGLang 0.5.22's flashinfer cannot build its gpt-oss mxfp8 kernels for Blackwell (sm120: RTX 5090, PRO 4500,
  # PRO 6000): "Ninja build failed ... mxfp8_quantization_sm100" (0.5.3-b5, run 39104203014)
  # SGLang 0.5.22 unpacks gpt-oss-120b's mxfp4 experts at load and runs one 80 GB card out of memory
  # ("Tried to allocate 1.03 GiB ... 719 MiB is free", weekly 39545243163); vLLM and pie load it there
  - when: {engine: sglang, artifact: gpt-oss-120b-mxfp4, platform: h100-pcie-x1}
    reason: "SGLang 0.5.22 runs out of memory loading gpt-oss-120b on one 80 GB H100 (its mxfp4 unpack)"
  - when: {engine: sglang, family: gpt_oss, arch: blackwell}
    reason: "SGLang 0.5.22 cannot build its gpt-oss kernels for Blackwell (flashinfer compile fails)"
  # SGLang's static pool for Kimi-K3 mini (weights + the KDA state pool) needs more than 0.935 of a 32 GB
  # card, and at 0.95 the process sits at 31.2 GiB before the first c8 batch (nightly 36103831529 s10:
  # ss serves, c8 / lc-1k / lc-2k OOM on 200-400 MiB); a 24 GB card does not load it at all
  - when: {engine: sglang, artifact: kimi-k3-mini8, platform: rtx5090-x1}
    reason: "SGLang 0.5.20 leaves no activation room for Kimi-K3 mini on a 32 GB card (OOM from c8)"
  - when: {engine: sglang, artifact: kimi-k3-mini8, platform: rtx4090-x1}
    reason: "SGLang 0.5.20 Kimi-K3 mini does not fit a 24 GB card"
  # vLLM holds Kimi-K3 mini's 19 GiB of weights on a 32 GB card with no room to spare: at 0.85 the KV
  # cache is 0 GiB, at 0.9 the ngram and c256 boots OOM (nightly 36226653803 s00)
  - when: {engine: vllm, artifact: kimi-k3-mini8, platform: rtx5090-x1}
    reason: "vLLM 0.30 Kimi-K3 mini leaves no KV or activation room on a 32 GB card"
  - when: {engine: vllm, artifact: kimi-k3-mini8, platform: rtx4090-x1}
    reason: "vLLM 0.30 Kimi-K3 mini does not fit a 24 GB card"
  # pie's Qwen3.6-35B-A3B dflash row puts down 19.8 GB of weights and 2.5 GB of arena, scratch and
  # scores, which leaves 0.5 GB of a 24 GB card at device_memory_share 0.9; one sequence beside the
  # state slots needs 10.9 GB, so both shapes are refused at boot (local 4090 nightlies at pie 518b05d, af4aeb4)
  - when: {engine: pie, artifact: qwen3.6-35b-a3b-mlx4, platform: rtx4090-x1}
    reason: "pie's Qwen3.6-35B-A3B dflash row leaves no cache room on a 24 GB card"
  - when: {engine: pie, backend: cuda, spec_dec: dflash2}
    reason: "CUDA engine exposes no draft head (Metal only) — wiki speculative-decoding/"
  - when: {scheme: fp8, arch: apple7}
    reason: "no fp8 path on Apple7"
  - when: {scheme: fp8, arch: apple8}
    reason: "no fp8 path on Apple8"
  - when: {scheme: fp8, arch: apple9}
    reason: "no fp8 path on Apple9"
  - when: {artifact: glm-5.3-flash-mini8, engine: vllm}
    reason: "vLLM does not load MLX affine checkpoints; the mini exists only in the mlx layout pie reads"
  - when: {artifact: glm-5.3-flash-mini8, engine: sglang}
    reason: "SGLang does not load MLX affine checkpoints"
  - when: {scheme: mlx_2bit, engine: vllm}
    reason: "vLLM does not load MLX quantized checkpoints"
  - when: {scheme: mlx_2bit, engine: sglang}
    reason: "SGLang does not load MLX quantized checkpoints"
  - when: {engine: llamacpp, os: linux}
    reason: "runner image has no nvcc; no CUDA llama.cpp build on pods yet"
  - when: {engine: pie, artifact: gemma-4-26b-a4b-mlx4, tp: ">1"}
    reason: "gemma4-26b-a4b's 2112-wide dense intermediate halves to 1056, not whole u4g64 groups, so its down plane cannot band (pie #674)"
  - when: {engine: llamacpp, tp: ">1"}
    reason: "llama.cpp layer-split is not tensor parallel; compared at tp1 only"
  - when: {engine: mlxlm, tp: ">1"}
    reason: "mlx-lm is single device"
  - when: {engine: mlxlm, family: muse_glimmer}
    reason: "mlx-lm 0.31.3 ships no muse_glimmer model, so it cannot load Muse Glimmer"
  - when: {engine: mlxlm, family: qwen4_exp}
    reason: "mlx-lm 0.31.3 ships no qwen4_exp model, so it cannot load Qwen3.8-Flash-Next"
  # llama.cpp boots one server for the 1- and 32-stream rows; Gemma 4's per-token KV is large (sliding window and all)
  - when: {engine: llamacpp, artifact: gemma-4-12b-llamacpp, platform: m2-16g}
    reason: "llama.cpp keeps KV for all 32 streams of one server: with Gemma 4 12B's weights that passes the ~10.7 GB a 16 GB Mac's GPU can use (Metal out of memory, targeted 38340671574)"
  - when: {engine: llamacpp, artifact: gemma-4-12b-llamacpp, platform: m3-16g}
    reason: "llama.cpp keeps KV for all 32 streams of one server: with Gemma 4 12B's weights that passes the ~10.7 GB a 16 GB Mac's GPU can use (Metal out of memory, targeted 38340671574)"
  - when: {engine: llamacpp, artifact: gemma-4-12b-llamacpp, platform: m5-16g}
    reason: "llama.cpp keeps KV for all 32 streams of one server: with Gemma 4 12B's weights that passes the ~10.7 GB a 16 GB Mac's GPU can use (Metal out of memory, targeted 38340671574)"
  - when: {engine: llamacpp, artifact: gemma-4-31b-llamacpp, platform: m4-pro-48g}
    reason: "llama.cpp keeps KV for all 32 streams of one server: with Gemma 4 31B's 17.5 GB of weights that needs about 39 GB, past the ~38 GB a 48 GB Mac's GPU can use (Metal out of memory, 38376994039)"
  - when: {program_category: diffusion, engine: vllm}
    reason: "not an LLM serving workload"
  - when: {program_category: diffusion, engine: sglang}
    reason: "not an LLM serving workload"
  - when: {program_category: diffusion, engine: llamacpp}
    reason: "not an LLM serving workload"
  - when: {program_category: diffusion, engine: mlxlm}
    reason: "not an LLM serving workload"
  # no reader in pie 1a3b2e2a for these architectures (models crate: qwen_3 reads the
  # Qwen3.5/3.6/3.8 hybrids; no llama family) — a catalog Row alone would not load them
  # measured on pie 1a3b2e2a (smoke run 35820128533)
  - when: {program: prefill-rows}
    reason: "prefill-rows takes its own input (`ids`); pie_bench.py cannot drive it"
  # these inferlets answer with a different envelope than text-completion-bench
  # (non-JSON, or no num_output_tokens), so pie_bench.py cannot read their result;
  # they need a driver of their own before they can be cells
  - when: {program: prefix-tree-kv-cache, engine: pie}
    reason: "returns non-JSON to pie_bench.py (JSONDecodeError); on hybrid models also needs forward-hybrid"
  - when: {program: mtp-speculative-decoding, engine: pie}
    reason: "return envelope lacks num_output_tokens (pie_bench.py KeyError); on hybrid models also needs forward-hybrid"
  - when: {program: lora-probe, engine: pie}
    reason: "seeds a fixed-size adapter bank (1572864 bytes) that must match the model's layer count; needs a per-model input contract"
  - when: {program: cacheback-speculative-decoding, engine: pie}
    reason: "return envelope lacks num_output_tokens (pie_bench.py KeyError)"
  - when: {artifact: nemotron-h-mini8}
    reason: "shrink_checkpoint.py has no nemotron_h reader (supported: deepseek_v4, deepseek_v41, glm_moe_dsa, gpt_oss, kimi, muse_glimmer, qwen3_5_moe, qwen4_exp)"
  - when: {artifact: mini-dit}
    reason: "pie/mini-dit is not an HF repo; needs a checkpoint source"
  - when: {family: mini_dit, program_category: serving}
    reason: "diffusion model; no text serving path"
  - when: {family: mini_dit, program_category: speculative}
    reason: "diffusion model"
  - when: {family: mini_dit, program_category: kv_policy}
    reason: "diffusion model"
  - when: {family: mini_dit, program_category: adapter}
    reason: "diffusion model"

# Fit rule: artifact.expected_gib * fit_factor must be <= platform.memory_gib (on a Mac, the share its GPU can use: plan/matrix.gpu_gib)
# (per TP group). Cells that do not fit are declared_unsupported with reason
# "does not fit", never silently dropped.
first_token_broken:
  muse-glimmer-30b-mlx4: "pie reports the first token before prefill ends on this model, so its prefill and TTFT are not shown"
  qwen3.8-27b-mlx4: "pie's first token does not get later as the prompt grows on this model (about 0.47 s at both 4k and 8k tokens), so its prefill and TTFT are not shown"
  qwen3.6-35b-a3b-mlx4: "pie's first token does not get later as the prompt grows on this model (about 0.09 s at both 4k and 8k tokens), so its prefill and TTFT are not shown"

fit_factor: 1.25
