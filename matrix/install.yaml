        and FlashInfer's prebuilt kernels so no kernel compiles with nvcc), every regular file but __pycache__.
      source: "Measured on b200-x1 (RunPod 9mgmwm085gh644), read-only: /root/.cache/pie-evals/venv-vllm-0.32.0."
      parts: [["FlashInfer's prebuilt kernels", 9123640923], ["NVIDIA's CUDA libraries", 3222753037], ["PyTorch", 1091091641], ["vLLM", 823842317]]
