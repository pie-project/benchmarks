# Install size: the disk an engine needs before any model, its binaries and every library it installs, per platform
# (the platform ids the site's cards use: mac, nvidia, amd, tpu, web).
#   Python engines: the venv the harness builds for it, the base Python left out (the venv only links to it).
#   Native engines: the release or build files it runs.
#   Browser engines: the JS and wasm the page downloads.
# Every number is the bytes of regular files (symlinks and directories count nothing). Bytecode Python writes on its
# first run (__pycache__) is left out everywhere, and the GPU driver is never counted. A number is measured unless its
# source says it comes from published sizes. `parts` names the pieces that explain most of a number.
# tools/webdb.py exports this as the site's `install` table (the Overview's Install Size cards, the Methodology chapter).
measured: "2026-11-07"
install:
  nvidia:
    - engine: pie
      version: "0.6.0 (bb2d6bf43)"
      bytes: 1211855117
      method: >-
        What pie runs on CUDA in the harness: its engine (the pie_server wheel the build installs, pie/_engine.abi3.so and
        its dist-info, 130,838,638 bytes), the text_completion_bench inferlet (503,207), and the CUDA libraries it loads
        from the system: NVRTC and its builtins, cuBLAS, cuBLASLt and NCCL (1,080,513,272). Those libraries are counted
        because the Python engines carry the same ones in their venvs.
      source: >-
        Measured on b200-x1 (RunPod 9mgmwm085gh644), read-only: /root/.cache/pie-evals/builds/bb2d6bf435fa-cuda,
        venv-pie/lib/python3.12/site-packages/pie, /usr/local/cuda-13.4/targets/x86_64-linux/lib and
        /lib/x86_64-linux-gnu/libnccl.so.2.32.3. The 0.6.0 release's stripped CLI for CUDA 13
        (pie-x86_64-linux-cuda13.0.tar.gz) unpacks to 89,978,136 bytes.
      parts: [["CUDA libraries (NVRTC, cuBLAS, NCCL)", 1080513272], ["pie's engine", 130838638], ["Inferlet", 503207]]
