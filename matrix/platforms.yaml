# Hardware the matrix knows about. `runpod_gpu_type` must be a RunPod GPU
# type id exactly as `pie-evals runpod-gpus` prints it; the tier workflow runs
# `pie-evals validate-platforms` before launching anything.
# Hardware the matrix knows about. `runner_labels` is what a GitHub self-hosted
# runner (resident Mac, or an ephemeral RunPod pod) registers with; `runs-on`
# in the workflows is derived from it. `tiers` restricts how often a platform
# is used at all (the product rule intersects tiers across every component).
platforms:
  - id: l40s-x1
    os: linux
    backend: cuda
    accelerator: NVIDIA L40S
    arch: ada
    count: 1
    memory_gib: 46
    interconnect: pcie
    runner_labels: [self-hosted, linux, l40s-x1]
    runpod_gpu_type: "NVIDIA L40S"
    tiers: [smoke, nightly, weekly]
  - id: l40s-x2
    os: linux
    backend: cuda
    accelerator: NVIDIA L40S
    arch: ada
    count: 2
    memory_gib: 92
    interconnect: pcie
    # the L40S x2 pod's peer DMA is broken: pie's peer collectives fall back to NCCL there, and
    # vLLM/SGLang's custom all-reduce (built on it) hung or died with "unspecified launch failure" (weekly 39545360541)
    peer_access: false
    runner_labels: [self-hosted, linux, l40s-x2]
    runpod_gpu_type: "NVIDIA L40S"
    tp_capable: true
    tiers: [smoke, nightly, weekly]
