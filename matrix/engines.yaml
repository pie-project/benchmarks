# Engines. `formats` is what the engine can load; a cell whose artifact format
# is not in the list is not generated at all (it is not a coverage gap, the
# engine simply does not take that input). `os` (and `backends`) restrict platforms.
# `recipe` names the competitive-configuration recipe under
# src/pie_evals/node/engines/recipes/<engine>/. Baselines only run from
# nightly up; the smoke tier compares pie against its own history.
engines:
  - id: pie
    os: [linux, macos]
    formats: [hf_safetensors, gguf, mlx]
    tiers: [smoke, nightly, weekly]
    recipe: default
  - id: vllm
    os: [linux]
    formats: [hf_safetensors]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "0.32.0"   # on the TPU (backend xla) the same release's vllm-tpu build, pypi:vllm-tpu==0.30.0 (tpu-inference 0.30.0)
    release_source: pypi:vllm
  - id: sglang
    os: [linux]
    formats: [hf_safetensors]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "0.5.22"
    # SGLang's TPU build is its own project (sgl-project/sglang-jax, versioned apart from sglang)
    backend_pins: {xla: "0.1.0rc0"}
    release_source: pypi:sglang
  - id: trtllm
    os: [linux]
    backends: [cuda]   # NVIDIA GPUs only
    formats: [hf_safetensors]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "1.4.0rc2.post1"   # its PyTorch backend (trtllm-serve on the HF checkpoint); 1.2.1, the last non-rc, predates Gemma-4, Qwen3.5 and gpt-oss on Blackwell RTX
    release_source: pypi:tensorrt-llm
  - id: llamacpp
    os: [linux, macos]
    formats: [gguf]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "b11312"
    release_source: github:ggml-org/llama.cpp
  - id: mlxlm
    os: [macos]
    formats: [mlx]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "0.31.3"
    release_source: pypi:mlx-lm
  # vLLM's Apple Silicon plugin (vllm-project/vllm-metal): vLLM's server and scheduler over MLX models, on the MLX
  # checkpoints mlx-lm serves. Installed as its install.sh does: the release's wheel, the vLLM core it names, its torch pins
  - id: vllm-metal
    os: [macos]
    formats: [mlx]
    tiers: [targeted]
    recipe: competitive
    pin: "0.33.0"
    release_source: github:vllm-project/vllm-metal
  - id: splash
    os: [macos]
    formats: [splash]
    tiers: [targeted]
    recipe: competitive
    pin: "1.1.0"
    release_source: github:incoai/splash
  # ---- phones (mobile/, matrix/phones.yaml): run by a person in the benchmark app, never planned (os matches no
  # platform here, tiers: []). llama.cpp and pie run there too, under their own ids, at the pins the app was built with
  - id: litert
    os: [android]
    formats: [litert]
    tiers: []
    recipe: default
    release_source: github:google-ai-edge/LiteRT-LM
  - id: mlc
    os: [android, ios]
    formats: [mlc]
    tiers: []
    recipe: default
    release_source: github:mlc-ai/mlc-llm
  - id: mlx-swift
    os: [ios]
    formats: [mlx]
    tiers: []
    recipe: default
    release_source: github:ml-explore/mlx-swift-lm
