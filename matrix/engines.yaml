# Engines. `formats` is what the engine can load; a cell whose artifact format
# is not in the list is not generated at all (it is not a coverage gap, the
# engine simply does not take that input). `os` (and `backends`) restrict platforms.
# `recipe` names the competitive-configuration recipe under
# src/pie_evals/node/engines/recipes/<engine>/. Baselines only run from
# nightly up; the smoke tier compares pie against its own history.
engines:
  - id: pie
    os: [linux, macos]
    formats: [hf_safetensors, gguf, mlx]
    tiers: [smoke, nightly, weekly]
    recipe: default
  - id: vllm
    os: [linux]
    formats: [hf_safetensors]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "0.32.0"   # on the TPU (backend xla) the same release's vllm-tpu build, pypi:vllm-tpu==0.30.0 (tpu-inference 0.30.0)
    release_source: pypi:vllm
  - id: sglang
    os: [linux]
    formats: [hf_safetensors]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "0.5.22"
    # SGLang's TPU build is its own project (sgl-project/sglang-jax, versioned apart from sglang)
    backend_pins: {xla: "0.1.0rc0"}
    release_source: pypi:sglang
  - id: trtllm
    os: [linux]
    backends: [cuda]   # NVIDIA GPUs only
    formats: [hf_safetensors]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "1.4.0rc2.post1"   # its PyTorch backend (trtllm-serve on the HF checkpoint); 1.2.1, the last non-rc, predates Gemma-4, Qwen3.5 and gpt-oss on Blackwell RTX
    release_source: pypi:tensorrt-llm
  - id: llamacpp
    os: [linux, macos]
    formats: [gguf]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "b11312"
    release_source: github:ggml-org/llama.cpp
  - id: mlxlm
    os: [macos]
    formats: [mlx]
    tiers: [nightly, weekly]
    recipe: competitive
    pin: "0.31.3"
    release_source: pypi:mlx-lm
  - id: splash
    os: [macos]
    formats: [splash]
    tiers: [targeted]
    recipe: competitive
    pin: "1.1.0"
    release_source: github:incoai/splash
