        workload: [raw-512-256, spec-512-256, c32, c8, pf32-512, pf8-512]
      - engine: [llamacpp, mlxlm, splash, vllm-metal]
        baseline: true
        program: text-completion-bench
        artifact_kind: miniature
        tp: 1
        os: macos
        workload: [raw-512-256, spec-512-256, c32, c8, pf32-512, pf8-512]
      - engine: pie
        baseline: false
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [cold-ss-128-64, cold-ss-512-200, cold-ctx-4k-256]
      - engine: [mlxlm, llamacpp, splash, vllm-metal]
