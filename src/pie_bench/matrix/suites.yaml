suites:
  smoke:
    max_jobs_per_platform: 2
    enforce_budget: true
    exclude:
      - {program_category: speculative, not_workload: [ss-128-64]}
      - {program_category: adapter, not_workload: [ss-128-64]}
      - {program_category: kv_policy, not_workload: [lc-1k-128]}
      - {program: prefill-rows, not_workload: [lc-2k-128]}
      - {program: prefix-tree-kv-cache, not_workload: [prefix-1k-x64]}
      - {workload: lc-8k-128, not_artifact: [qwen3.5-0.8b-bf16, gemma-4-e4b-bf16]}
      - {workload: mixed-256, not_artifact: [qwen3.5-0.8b-bf16, qwen3.6-35b-a3b-mini5]}
      - {workload: c32, not_artifact: [qwen3.5-0.8b-bf16, gemma-4-e4b-bf16, qwen3.6-35b-a3b-mini5]}
      - {tp: ">=2", program_category: kv_policy}
      - {tp: ">=2", program_category: adapter}
      - {tp: ">=2", program_category: speculative}
      - {tp: ">=2", not_workload: [control-aa, ss-128-64, c8, lc-2k-128]}
      - {tp: ">=2", not_artifact: [qwen3.5-0.8b-bf16, qwen3.6-35b-a3b-mini5, gpt-oss-20b-mxfp4-mini5, deepseek-v4-flash-mini5, deepseek-v4.1-flash-mini8, glm-5.3-flash-mini8, kimi-k3-mini8]}
  nightly:
    max_jobs_per_platform: 48
    enforce_budget: true
    exclude:
      - {engine: vllm, workload: control-aa}
      - {engine: sglang, workload: control-aa}
      - {engine: llamacpp, workload: control-aa}
      - {engine: mlxlm, workload: control-aa}
      - {backend: xla, not_artifact: [qwen3.5-0.8b-xla, deepseek-v4.1-flash-mini8, kimi-k3-mini8]}
      - {backend: xla, workload: [pf256-512, raw-512-256]}
      - {backend: xla, artifact: qwen3.5-0.8b-xla, workload: c256}
  weekly:
    max_jobs_per_platform: 900
    enforce_budget: true
    exclude: []
  targeted:
    max_jobs_per_platform: 20
    enforce_budget: false
    exclude:
      - {not_engine: pie, baseline: false}
    include:
      - engine: pie
        baseline: false
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [control-aa, ss-128-64, ss-512-256, lc-1k-128, lc-2k-128, c8, c32]
      - engine: [mlxlm, llamacpp]
        baseline: true
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [ss-128-64, ss-512-256, lc-1k-128, lc-2k-128, c8, c32]
      - engine: pie
        baseline: false
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [ob-story-200, ob-512-200, raw-512-256, spec-512-256, ob-short-100, ob-advanced-500, ctx-4k-256, ctx-8k-256, c4, ss-512-256, c32, c8, pf256-512, pf32-512, pf8-512]
      - engine: [llamacpp, mlxlm, splash, vllm-metal]
        baseline: true
        program: text-completion-bench
        artifact_kind: full
        tp: 1
        os: macos
        workload: [ob-story-200, ob-512-200, raw-512-256, spec-512-256, ob-short-100, ob-advanced-500, ctx-4k-256, ctx-8k-256, c4, ss-512-256, c32, c8, pf256-512, pf32-512, pf8-512]
      - engine: pie
