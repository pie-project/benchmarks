default:
  knobs:
    gpu_mem_util:
      value: 0.90
      rationale: Same fraction pie and SGLang are given (see pie.yaml).
    report_timing:
      value: true
      rationale: >
        Switches tput mode to the AsyncLLM streaming client so TTFT and
        inter-token gaps are stamped on token delivery, the vantage pie's
        client has. Without it vLLM's tput run reports no per-request timing.
    prefix_caching:
      value: false
      rationale: >
        Off by default: a closed-loop client reusing a prompt would otherwise
        measure the cache, and pie runs without one on these shapes.

  arch:
    tpu-v5e:
      knobs:
        gpu_mem_util:
          value: 0.97
          rationale: >
            A v5e chip has 15.75 GiB: at 0.90 neither pie (0 MiB left for KV) nor vLLM-TPU
            (14.32 GiB used > 14.17 cap) boots gemma-4-E4B's 14.3 GiB of weights (b5 39658500805);
            every engine gets the same higher share there.

competitive:
  extends: default
  knobs:
    attention_backend:
      value: FLASHINFER
      rationale: >
        vLLM's auto pick is not always its fastest kernel on a given part;
        FlashInfer is the backend the vLLM maintainers benchmark decode with
        on Ada/Blackwell. Named so the baseline is not hobbled by a heuristic.
    max_num_seqs:
      value: "$concurrency"
      flag: none
      rationale: >
        vllm_bench.py sets max_num_seqs from --concurrency itself (1 in
        latency mode), so engine admission equals the client's offered load on
        both engines. Recorded here so the recipe says what ran; nothing is
        emitted.
    chunked_prefill:
      value: true
      rationale: >
        vLLM's default; the script only has --no-chunked-prefill. Left on
        because that is what a deployment gets.
    max_num_batched_tokens:
      value: null
      rationale: >
        Unset leaves vLLM's own scheduler budget (8192 on V1). Set per arch
        if a shape shows prefill starving decode.
  family:
    gpt_oss:
      knobs:
        attention_backend:
          value: null
          rationale: >
            gpt-oss attends with sinks, and vLLM 0.30's FlashInfer backend
            refuses them off Hopper ("attention sinks not supported": every
            gpt-oss cell of nightly 35908055874 on the 4090). Unset leaves
            vLLM's own pick (TRITON_ATTN there); the Hopper override below
            still names FA3, which carries sinks.
    kimi_k3:
      knobs:
        attention_backend:
          value: null
          rationale: >
            Kimi-K3 attends with MLA (and KDA); vLLM 0.30's FlashInfer backend
            answers "head_size not supported, MLA not supported" (every
            Kimi-K3 cell of nightly 35921789513 on the A100). Unset leaves
            vLLM's own MLA pick.
      platform:
        b200-x1:
          knobs:
            max_num_batched_tokens:
              value: 32768
              rationale: >
                vllm_bench.py builds AsyncLLM, whose engine usage context leaves
                vLLM's scheduler at 2048 tokens a step, and at c1024 Kimi-K3 queued
                its prompts behind it (11.2k tok/s, TTFT p50 35 s; 17.8k at c512).
                c1024 on the B200: 16384 (what `vllm serve` takes on this card)
                19.4-20.1k, 32768 21.4-22.9k, 65536 22.0k, 131072 faults in
                FlashAttention (CUDA error 700).
            moe_backend:
              value: humming
              rationale: >
                0.32.0's pick on SM100, FLASHINFER_TRTLLM_MXFP4_MXFP8, quantizes the
                experts' activations to MXFP8 (W4A8); the release and pie serve them
                bf16 (W4A16), as SGLang's Marlin pin does. Its W4A16 runners on the
                B200 at c1024: humming 19.4k tok/s, marlin 12.7k; trtllm-gen and
                CUTLASS have no bf16-activation kernel for Kimi-K3's SITU experts.
    deepseek_v41:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
    glm5_next:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
    glm_moe_dsa:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
      platform:
        h100-sxm-x1:
          knobs:
            max_num_batched_tokens:
              value: 2048
              rationale: >
                The GLM-5.3 mini78 on the H100 at c256 ran 1.6k tok/s at 2048 tokens a step and
                0.6k at vllm serve's 8192 (pf32-512 level: 6.1k against 6.3k).
        h200-x1:
          knobs:
            max_num_batched_tokens:
              value: 2048
              rationale: >
                The GLM-5.3 mini78 on the H200 read 6.1k prefill tok/s at pf16-512 at 2048 tokens
                a step and 5.6k at 8192 (c1024 level: 3.83k against 3.83k).
    hy_v4:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
    mimo_v2:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
      platform:
        h100-sxm-x1:
          knobs:
            max_num_batched_tokens:
              value: 2048
              rationale: >
                The MiMo mini on the H100 ran faster at 2048 tokens a step than at vllm serve's
                8192 (c512 14.7k against 12.6k tok/s, pf16-512 119k against 84k).
    qwen4_exp:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
        language_model_only:
          value: true
          rationale: >
            The miniature is carved without the vision tower, and vLLM 0.31 builds it anyway, then
            fails init on every visual.* weight the checkpoint lacks (weekly 40421366253). Text-only
            serving, as pie runs it.
    minimax_m3:
      knobs:
        attention_backend:
          value: null
          rationale: >
            MiniMax-M3 attends with its own sparse attention (MSA, Triton below sm_100); a named
            FlashInfer backend is not its path. Unset leaves vLLM's own pick, as it deploys it.
    gemma4:
      knobs:
        language_model_only:
          value: true
          rationale: >
            The benchmarks are text-only, as pie serves them. vLLM 0.32 otherwise budgets Gemma-4's
            video input and refuses to start the 31B miniature at the Raw shape ("max_tokens_per_mm_item
            (2496) is larger than max_num_batched_tokens (2048)", l40s-x1).
    gemma4_moe:
      knobs:
        language_model_only:
          value: true
          rationale: Text-only serving, as for gemma4 (vLLM budgets the vision/video input otherwise).
    nemotron_h:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
  arch:
    hopper:
      knobs:
        attention_backend:
          value: FLASH_ATTN
          rationale: FA3 is vLLM's fastest Hopper path; FlashInfer trails it there.
      family:
        kimi_k3:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA path either ("head_size not supported, MLA not
                supported": every Kimi-K3 cell of nightly 36081635037 on the
                H100). Unset leaves vLLM's own MLA pick.
        deepseek_v41:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        glm5_next:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        glm_moe_dsa:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        hy_v4:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        mimo_v2:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        qwen4_exp:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        nemotron_h:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
    apple9:
      knobs: {}
    cdna4:
      knobs: {}
      family:
        nemotron_h:
          knobs:
            moe_backend:
              value: triton
              rationale: >
                On gfx950 the rows run AMD's vLLM 0.29.1 image with AITER on, and its unquantized-MoE
                oracle then names AITER and refuses Nemotron-H's relu2 experts rather than falling back
                ("ROCm AITER does not support ... no act_and_mul MLP layer", every Nemotron-3 cell on
                mi350x-x1, 2026-11-09). Triton's fused MoE serves them, as it does on NVIDIA.
        gemma4_moe:
          knobs:
            moe_backend:
              value: triton
              rationale: >
                The same oracle refuses Gemma-4-26B-A4B's GELU-tanh experts on gfx950 ("ROCm AITER does
                not support ... MoEActivation.GELU_TANH activation", mi350x-x1, 2026-11-09); Triton's
                fused MoE serves them.
  backend:
    rocm:
      knobs:
        attention_backend:
          value: null
          rationale: >
            FlashInfer and FA3 are CUDA-only; vLLM's ROCm build picks among its own
            ROCm backends (ROCM_ATTN, the AITER ones, TRITON_ATTN). Unset leaves its pick.
    xla:
      knobs:
        attention_backend:
          value: null
          rationale: >
            vLLM's TPU build (vllm-tpu, the tpu-inference backend) brings its own
            Pallas attention and takes no CUDA backend name; unset leaves its pick.
        cpu_affinity:
          value: none
          rationale: >
            The auto pin reads the GPU's NUMA node from nvidia-smi; a TPU VM has
            none, so the process stays unpinned, as pie's does there.
  workload_kind:
    prefix_shared:
      knobs:
        prefix_caching:
          value: true
          rationale: >
            The shared-prefix shape exists to exercise prefix reuse; pie's
            prefix tree is on for it, so vLLM gets its cache too.
    mixed_length:
      knobs:
        prefix_caching:
          value: false
          rationale: common.py's --mixed-phase help asks for prefix caching OFF on both engines.
  platform:
    tpu-v5e-1:
      knobs: {}
      artifact:
        gpt-oss-20b-mxfp4-mini12: &tpu_v5e_gptoss_room
          knobs:
            gpu_mem_util:
              value: 0.85
              rationale: >
                The int8-requantized mini takes 13.03 GiB in vLLM-TPU, past a 0.80 cap (12.6 GiB, 42116951581); at
                0.97 the KV pool leaves no room for the 1.11G step program. 0.85 holds both.
        gpt-oss-120b-mxfp4-mini12-e32: *tpu_v5e_gptoss_room
        deepseek-v4-flash-mini-tpu:
          knobs:
            gpu_mem_util:
              value: 0.65
              rationale: >
                At 0.97 vLLM-TPU sizes DeepSeek-V4's KV pool from every byte free, then its compressed-attention
                cache asks 2.80G more with 483.89M free (RESOURCE_EXHAUSTED in _initialize_ds_v4_kv_cache,
                42160767180); at 0.75 its step program asks 2.34G with 2.11G free (42193066105). 0.65 leaves both room.
        muse-glimmer-30b-mini4: &tpu_v5e_compile_room
          knobs:
            gpu_mem_util:
              value: 0.80
              rationale: >
                At 0.97 vLLM-TPU gives the KV pool every byte its memory check sees free, and then cannot load its
                step program ("Attempting to reserve 1.11G ... 484.27M free", gpt-oss parity 41995643253;
                Muse-Glimmer's KV pool the same, 3.05G asked with 483.80M free, 41913871355). 0.80 leaves it the room.
        gemma-4-e2b-tpu: *tpu_v5e_compile_room
        qwen3.5-0.8b-bf16: *tpu_v5e_compile_room
        gemma-4-e4b-tpu:
          knobs:
            gpu_mem_util:
              value: 0.94
              rationale: >
                E4B's 14.32 GiB of weights need more than 0.90 of a v5e; past them and the KV pool 447.10M stays free at
                0.94 and at 0.92 alike (42346656450, 42364993156), so the pool is not what crowds the sampler (below).
            max_num_seqs_cap:
              value: 128
              rationale: >
                The 256-wide sampler program asks 513.47M with 447.10M free whatever the KV share (jit_sample,
                42327327144, 42346656450, 42364993156); 128 seats halve it. The other offered requests queue in vLLM's scheduler.
        qwen3.6-27b-mini8:
          knobs:
            max_num_seqs_cap:
              value: 128
              rationale: >
                Qwen3.6's Gated DeltaNet state is held for every seated sequence: 256 of them need 4.9 GB beside the
                3.98 GiB the 9.8 GB mini leaves at 0.97 ("Cannot fit both KV pools ... lower max_num_seqs",
                41767218136). 128 seat; the other offered requests queue in vLLM's scheduler.
        qwen3.6-35b-a3b-mini-e16:
          knobs:
            max_num_seqs_cap:
              value: 96
              rationale: >
                30 Gated DeltaNet layers hold 64 MB of state a sequence: 256 seated need 16.5 GB on a 15.75 GiB chip.
                96 seat beside the 7.5 GB mini; the other offered requests queue in vLLM's scheduler.
    tpu-v6e-1:
      knobs: {}
      artifact:
        deepseek-v4-flash-mini-tpu:
          knobs:
            gpu_mem_util:
              value: 0.75
              rationale: >
                DeepSeek-V4's compressed-attention cache takes about a quarter of the KV pool on top of it: at 0.90 it
                asks 6.40G with 3.12G free (RESOURCE_EXHAUSTED in _initialize_ds_v4_kv_cache, 42160763662), as at 0.97 on
                the v5e. 0.75 leaves that room.
        qwen3.6-35b-a3b-mini-e32:
          knobs:
            max_num_seqs_cap:
              value: 192
              rationale: >
                30 Gated DeltaNet layers hold 64 MB of state a sequence: 256 seated need 16.5 GB, more than the
                15.23 GiB the mini leaves at 0.90 ("Cannot fit both KV pools", 41957075507). 192 seat; the other
                offered requests queue in vLLM's scheduler.
    rtx4090-x1:
      family:
        gpt_oss:
          knobs:
            gpu_mem_util:
              value: 0.95
              rationale: >
                At 0.90 of a 24 GB RTX 4090 gpt-oss-20b's kv pool holds about the 256 c256 lanes to their end
                and no more, so pie's seated admission held 16 of them back (7.0k tok/s); every engine gets
                the same higher share there.
        gemma4:
          knobs:
            gpu_mem_util:
              value: 0.95
              rationale: >
                gemma-4-E4B's 14.2 GiB of weights leave vLLM 0.32 no KV at 0.90 of a 24 GB RTX 4090 ("Available
                KV cache memory: -0.14 GiB", raw-512-256); every engine gets the same higher share there.
    a40-x1:
      family:
        glm5_next:
          knobs:
            compilation_config:
              value: {cudagraph_mode: PIECEWISE}
              rationale: >
                GLM-5.3-Flash's sparse MLA runs on XPU_MLA_SPARSE on sm_86 too, the whole model eager
                ("setting cudagraph_mode=NONE"): raw-512-256 rounds 52.2/55.6/52.0/56.2/54.6 tok/s, noisy
                (CoV 3.2%). Piecewise graphs as for GLM-5.3 below.
        glm_moe_dsa:
          knobs:
            compilation_config:
              value: {cudagraph_mode: PIECEWISE}
              rationale: >
                On sm_86 vLLM 0.32 serves GLM-5.3's sparse MLA on XPU_MLA_SPARSE, which has no full-graph
                support, and drops the whole model to eager ("setting cudagraph_mode=NONE"): a batch-1
                decode then waits on the host's launches, 14.4 to 18 ms a token as the shared host's clocks
                move, and every raw-512-256 run was noisy (round CoV 3.9-4.4%). Piecewise graphs keep the
                attention eager and graph the rest: 6 requests x 3 rounds 84.7 tok/s each, spread 0.1%;
                greedy tokens part from eager's no sooner than two eager runs part from each other.

