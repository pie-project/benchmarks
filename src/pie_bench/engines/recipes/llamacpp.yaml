default:
  knobs:
    gpu_layers:
      value: all
      rationale: >
        Fully offloaded (-ngl all); the comparison is against engines that
        keep every weight on the accelerator.
    flash_attn:
      value: "on"
      rationale: The other engines run their own optimized attention; off would benchmark a handicap.
    server_extra:
      value: []
      rationale: Extra llama-server flags.
    cache_prompt:
      value: false
      rationale: A request must not reuse the previous request's KV; the client also shuffles each prompt.
    flush_cache:
      value: true
      rationale: Single stream prefill must not be a prefix cache hit.
    startup_timeout:
      value: 600
      rationale: A 30B GGUF takes minutes to page in on a laptop-class Mac.
    speculation:
      value: "off"
      rationale: >
        Plain decoding. Drafting with a separate small model made both llama.cpp and mlx-lm
        slower on every speculating row (llama.cpp up to a third, mlx-lm about 60%), so each
        engine runs at its fastest setting. "auto" drafts with the artifact's draft_model on
        single-stream rows; "on" forces it.
    draft_gpu_layers:
      value: all
      rationale: The draft is fully offloaded like the target (--n-gpu-layers-draft all).
    draft_max:
      value: null
      rationale: >
        null keeps llama-server's default draft length (--spec-draft-n-max 3); the
        speculative-decoding docs recommend no other value for a separate draft model
        (their larger values are for n-gram drafting and trained DFlash/DSpark heads).
    draft_min:
      value: null
      rationale: null keeps llama-server's default (--spec-draft-n-min 0).

competitive:
  extends: default
  knobs:
    server_extra:
      value: ["--batch-size", "2048", "--ubatch-size", "512", "--no-mmap", "--cont-batching"]
      rationale: >
        Logical batch 2048 / micro-batch 512 is what llama.cpp's own
        llama-bench uses for prompt throughput; pinned so a llama.cpp default
        change is not read as a regression. --no-mmap makes the load resident
        the way the other engines' are; continuous batching is the default but named.
  workload_kind:
    prefix_shared:
      knobs:
        cache_prompt:
          value: true
          rationale: The cached prompt shape measures prefix reuse, so llama.cpp keeps its cache.
        flush_cache:
          value: false
          rationale: The shared prefix must stay as written for the cache to find it.
        server_extra:
          value: ["--batch-size", "2048", "--ubatch-size", "512", "--no-mmap", "--cont-batching", "--cache-reuse", "256"]
          rationale: --cache-reuse lets a slot reuse a KV prefix of >=256 tokens.
  backend:
    metal:
      knobs:
        server_extra:
          value: ["--batch-size", "2048", "--ubatch-size", "512", "--cont-batching", "--kv-unified"]
          rationale: >
            No --no-mmap on Apple Silicon: the whole mapping is wired into the
            unified working set either way and mmap is what lets a large GGUF
            load at all there. --kv-unified shares one KV buffer across the
            slots: without it each of 32 slots keeps its own sliding-window
            cache, and Gemma 4 31B asks 62.9 GB on a Mac whose GPU working set
            is 53 GB (every request a Metal out-of-memory "Compute error",
            targeted 38336669202); shared, it asks 49.4 GB. Numerics, batch
            sizes and throughput are unchanged (Gemma 4 12B, 1 and 32 streams).
  artifact:
    qwen3.8-flash-next-q2k-llamacpp:
      backend:
        metal:
          knobs:
            server_extra:
              value: ["--batch-size", "2048", "--ubatch-size", "512", "--cont-batching"]
              rationale: &q38kv >
                No --kv-unified: qwen4exp's sparse-attention indexer scores every cell of the
                KV buffer, and one buffer shared by 256 slots of 2048 asks a 330 GB compute
                buffer (Metal out of memory at load, q38-2bit). Per-slot buffers load at the
                same batch sizes.
    qwen3.8-flash-next-q2k-mini8-llamacpp:
      backend:
        metal:
          knobs:
            server_extra:
              value: ["--batch-size", "2048", "--ubatch-size", "512", "--cont-batching"]
              rationale: *q38kv
    muse-spark-llamacpp-slice-l2-e8:
      backend:
        metal:
          knobs:
            server_extra:
              value: ["--batch-size", "2048", "--ubatch-size", "512", "--cont-batching"]
              rationale: >
                No --kv-unified: llama.cpp's Muse Spark graph spans the whole shared buffer, and 32 slots of
                2048 in one asked a 9.2 GB compute buffer on the M2 (Metal out of memory, every request a
                "Compute error", pie-eval 42584771302). Per-slot buffers ask 1.0 GB at the same batch sizes.
  platform:
    rtx-spark-128g:
      knobs:
        server_extra:
          value: ["--batch-size", "2048", "--ubatch-size", "512", "--load-mode", "none", "--cont-batching"]
          rationale: >
            b11312 replaced --no-mmap with --load-mode (none is the same: weights read, not mapped). No --kv-unified,
            as on the other CUDA platforms: one KV buffer shared by 32 slots cut c32 output 2.1-2.5x on the laptop
            (Gemma 4 12B 116 vs 263 tok/s, gpt-oss-20b 199 vs 412), where Ollama, running llama.cpp without it, was
            ahead by the same factor; Gemma 4 31B fits with per-slot buffers.
