# TensorRT-LLM recipes. Knob -> option mapping lives in TrtllmEngine (trtllm-serve flags and the
# --extra_llm_api_options yaml). Unset knobs keep TensorRT-LLM's own defaults, what a deployment gets.

default:
  knobs:
    cuda_graphs:
      value: true
      rationale: >
        CUDA graphs up to the shape's batch (padded), as SGLang's graph ceiling and vLLM's
        max_num_seqs are set to the concurrency: a decode batch past the ceiling would run eager.
    block_reuse:
      value: false
      rationale: >
        Every throughput prompt is cold on every engine; KV block reuse off, as vLLM runs
        without prefix caching and SGLang without its radix cache.
    max_num_tokens:
      value: 8192
      rationale: TensorRT-LLM's default token budget per step.

competitive:
  extends: default
  family:
    glm5_next:
      knobs:
        llm_api_options:
          value: {disable_mm_encoder: true}
          rationale: >
            GLM-5.3-Flash's vision encoder needs transformers 5.17 and the wheel pins 5.5.4 ("set
            disable_mm_encoder=True" for text-only); every row is text, as on the other engines.
        max_batch_cap:
          value: 128
          rationale: >
            Its KDA convolution indexes the whole admitted batch with 32-bit offsets, and 512 sequences overflow them
            ("KDA convolution tensor offsets must fit int32", b200-x1); 128 at once, the rest queue.
    deepseek_v4:
      knobs:
        kv_cache_dtype:
          value: fp8_ds_mla
          rationale: >
            DeepSeek-V4's sparse MLA keeps its KV in the FP8 FlashMLA page layout, as SGLang serves it ("DeepSeek-V4 on
            Hopper requires kv_cache_config.dtype='fp8_ds_mla'", h200-x1; the same on SM120).
    minimax_m3:
      knobs:
        llm_api_options:
          value: {sparse_attention_config: {algorithm: minimax_m3}}
          rationale: >
            MiniMax-M3's lightning-attention KV manager is built only with its sparse attention config
            ("MiniMax-M3 requires sparse_attention_config.algorithm='minimax_m3'", pro6000-x1).
    nemotron_h:
      knobs:
        max_batch_cap:
          value: 128
          rationale: >
            The Mamba-2 state pool holds every admitted sequence: the Nemotron-3-Super mini at 512 wanted 87 GB of it on
            an 80 GB H100 ("The V2 Mamba GPU cache quota is too small"); 128 at once, the rest queue, as vLLM caps its hybrids.
    qwen4_exp:
      knobs:
        llm_api_options:
          value: {disable_mm_encoder: true}
          rationale: Text-only serving, as vLLM serves it (language_model_only) and pie runs it.
  knobs:
    kv_free_mem_fraction:
      value: null
      rationale: >
        Unset keeps TensorRT-LLM's default (0.9 of the memory left after weights and activations
        go to KV), its best-throughput setting.
  platform:
    # on a 32 GB card the default 0.9 left 1.3 GiB beside the KV-sizing pool, and the executor's own buffers did not
    # fit (gemma-4-E4B bf16 on the RTX 5090: "Executor creation failed due to insufficient GPU memory")
    # the hybrids' recurrent-state pool holds every admitted sequence: Qwen3.6-35B-A3B's mini at 512 wanted 16.9 GB
    # of it with 7.7 GB left on the RTX 5090 ("The V2 Mamba GPU cache quota is too small"); 128 are admitted at once
    # and the rest queue, as vLLM's max_num_seqs_cap does
    rtx5090-x1:
      knobs: {kv_free_mem_fraction: 0.75}
      family:
        qwen3_6_moe: {knobs: {max_batch_cap: 64}}  # at 128 the 5090's pool was 70 MB short (4.18 of 4.25 GB)
        qwen3_6: {knobs: {max_batch_cap: 128}}
        qwen4_exp: {knobs: {max_batch_cap: 128}}
        nemotron_h: {knobs: {max_batch_cap: 128}}
        gemma4: {knobs: {kv_free_mem_fraction: 0.5}}
    pro4500-x1:
      knobs: {kv_free_mem_fraction: 0.75}
      family:
        qwen3_6_moe: {knobs: {max_batch_cap: 64}}  # at 128 the 5090's pool was 70 MB short (4.18 of 4.25 GB)
        qwen3_6: {knobs: {max_batch_cap: 128}}
        qwen4_exp: {knobs: {max_batch_cap: 128}}
        nemotron_h: {knobs: {max_batch_cap: 128}}
        gemma4: {knobs: {kv_free_mem_fraction: 0.5}}
    rtx4090-x1:
      knobs: {kv_free_mem_fraction: 0.75}
      family:
        qwen3_6_moe: {knobs: {max_batch_cap: 64}}  # at 128 the 5090's pool was 70 MB short (4.18 of 4.25 GB)
        qwen3_6: {knobs: {max_batch_cap: 128}}
        qwen4_exp: {knobs: {max_batch_cap: 128}}
        nemotron_h: {knobs: {max_batch_cap: 128}}
