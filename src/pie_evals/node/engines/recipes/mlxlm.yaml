# mlx-lm recipes. The adapter boots `python -m mlx_lm server` once per model
# with `--decode-concurrency <slots>`. Knob -> flag mapping is in
# MlxlmEngine.server_cmd.

default:
  knobs:
    prompt_cache_size:
      value: 0
      rationale: >
        0 keeps the prompt cache out of the measurement, which is what every
        other harness here does with its cache on non-prefix shapes.
    prompt_concurrency:
      value: 8
      rationale: mlx-lm's default prefill batch; pinned so a default change is visible.
    startup_timeout:
      value: 600
      rationale: A 30B 4-bit checkpoint takes minutes to page in on a laptop-class Mac.
    server_module:
      value: null
      rationale: >
        None = `mlx_lm server`. Gemma 4's MTP drafter lives in mlx_vlm.server;
        set per family when a speculative mode asks for it.
    server_extra:
      value: []
      rationale: Extra server flags.
    flush_cache:
      value: true
      rationale: Single stream prefill must not be a prefix cache hit.
    speculation:
      value: auto
      rationale: >
        Mirrors pie's knob: on the rows pie speculates (single stream) mlx-lm drafts with
        the artifact's draft_model (--draft-model), on a server of its own (a draft makes
        mlx-lm's server unbatchable); throughput rows decode plain. mlx-lm 0.32.0 refuses to
        speculate on a model whose cache cannot be trimmed ("Speculative decoding requires a
        trimmable prompt cache (got {'ArraysCache'})"): the Qwen3.5/3.6/3.8 gated-delta-net
        hybrids, so their mlx-lm arms carry no draft_model and decode plain.
    num_draft_tokens:
      value: null
      rationale: null keeps mlx-lm's default draft length (--num-draft-tokens 3).

competitive:
  extends: default
  knobs:
    prompt_concurrency:
      value: 8
      rationale: >
        mlx-lm prefills up to this many prompts as one batch; wider than the
        default gains nothing on unified memory and narrower serialises TTFT.
  workload_kind:
    prefix_shared:
      knobs:
        prompt_cache_size:
          value: 64
          rationale: >
            The prefix shape is 64 variants of one prefix; a cache that holds
            them all is mlx-lm's equivalent of pie's prefix tree for this run.
        flush_cache:
          value: false
          rationale: The shared prefix must stay as written for the cache to find it.
