# vLLM recipes. Knob -> flag mapping lives in VllmEngine.engine_args; every
# knob here maps onto a flag scripts/bench/vllm_bench.py or scripts/bench/common.py
# parses. Knobs vllm_bench.py derives itself (max_num_seqs = --concurrency)
# are listed for the record with `flag: none`.

default:
  knobs:
    gpu_mem_util:
      value: 0.90
      rationale: Same fraction pie and SGLang are given (see pie.yaml).
    report_timing:
      value: true
      rationale: >
        Switches tput mode to the AsyncLLM streaming client so TTFT and
        inter-token gaps are stamped on token delivery, the vantage pie's
        client has. Without it vLLM's tput run reports no per-request timing.
    prefix_caching:
      value: false
      rationale: >
        Off by default: a closed-loop client reusing a prompt would otherwise
        measure the cache, and pie runs without one on these shapes.

  arch:
    tpu-v5e:
      knobs:
        gpu_mem_util:
          value: 0.97
          rationale: >
            A v5e chip has 15.75 GiB: at 0.90 neither pie (0 MiB left for KV) nor vLLM-TPU
            (14.32 GiB used > 14.17 cap) boots gemma-4-E4B's 14.3 GiB of weights (b5 39658500805);
            every engine gets the same higher share there.

competitive:
  extends: default
  knobs:
    attention_backend:
      value: FLASHINFER
      rationale: >
        vLLM's auto pick is not always its fastest kernel on a given part;
        FlashInfer is the backend the vLLM maintainers benchmark decode with
        on Ada/Blackwell. Named so the baseline is not hobbled by a heuristic.
    max_num_seqs:
      value: "$concurrency"
      flag: none
      rationale: >
        vllm_bench.py sets max_num_seqs from --concurrency itself (1 in
        latency mode), so engine admission equals the client's offered load on
        both engines. Recorded here so the recipe says what ran; nothing is
        emitted.
    chunked_prefill:
      value: true
      rationale: >
        vLLM's default; the script only has --no-chunked-prefill. Left on
        because that is what a deployment gets.
    max_num_batched_tokens:
      value: null
      rationale: >
        Unset leaves vLLM's own scheduler budget (8192 on V1). Set per arch
        if a shape shows prefill starving decode.
  family:
    gpt_oss:
      knobs:
        attention_backend:
          value: null
          rationale: >
            gpt-oss attends with sinks, and vLLM 0.30's FlashInfer backend
            refuses them off Hopper ("attention sinks not supported": every
            gpt-oss cell of nightly 35908055874 on the 4090). Unset leaves
            vLLM's own pick (TRITON_ATTN there); the Hopper override below
            still names FA3, which carries sinks.
    kimi_k3:
      knobs:
        attention_backend:
          value: null
          rationale: >
            Kimi-K3 attends with MLA (and KDA); vLLM 0.30's FlashInfer backend
            answers "head_size not supported, MLA not supported" (every
            Kimi-K3 cell of nightly 35921789513 on the A100). Unset leaves
            vLLM's own MLA pick.
    deepseek_v41:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
    glm5_next:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
    glm_moe_dsa:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
    hy_v4:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
    mimo_v2:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
    qwen4_exp:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
        language_model_only:
          value: true
          rationale: >
            The miniature is carved without the vision tower, and vLLM 0.31 builds it anyway, then
            fails init on every visual.* weight the checkpoint lacks (weekly 40421366253). Text-only
            serving, as pie runs it.
    nemotron_h:
      knobs:
        attention_backend:
          value: null
          rationale: >
            The datacenter models attend with MLA, sparse MLA or sinks, which vLLM 0.31's
            FlashInfer backend refuses ("MLA not supported, sparse not supported": GLM-5.3-Flash
            on the pro6000-x4, weekly 39680748696). Unset leaves vLLM's own pick, as it deploys them.
  arch:
    hopper:
      knobs:
        attention_backend:
          value: FLASH_ATTN
          rationale: FA3 is vLLM's fastest Hopper path; FlashInfer trails it there.
      family:
        kimi_k3:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA path either ("head_size not supported, MLA not
                supported": every Kimi-K3 cell of nightly 36081635037 on the
                H100). Unset leaves vLLM's own MLA pick.
        deepseek_v41:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        glm5_next:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        glm_moe_dsa:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        hy_v4:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        mimo_v2:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        qwen4_exp:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
        nemotron_h:
          knobs:
            attention_backend:
              value: null
              rationale: >
                FA3 has no MLA or sparse-MLA path; unset leaves vLLM's own pick for the
                datacenter models, as it deploys them.
    apple9:
      knobs: {}
  backend:
    rocm:
      knobs:
        attention_backend:
          value: null
          rationale: >
            FlashInfer and FA3 are CUDA-only; vLLM's ROCm build picks among its own
            ROCm backends (ROCM_ATTN, the AITER ones, TRITON_ATTN). Unset leaves its pick.
    xla:
      knobs:
        attention_backend:
          value: null
          rationale: >
            vLLM's TPU build (vllm-tpu, the tpu-inference backend) brings its own
            Pallas attention and takes no CUDA backend name; unset leaves its pick.
        cpu_affinity:
          value: none
          rationale: >
            The auto pin reads the GPU's NUMA node from nvidia-smi; a TPU VM has
            none, so the process stays unpinned, as pie's does there.
  workload_kind:
    prefix_shared:
      knobs:
        prefix_caching:
          value: true
          rationale: >
            The shared-prefix shape exists to exercise prefix reuse; pie's
            prefix tree is on for it, so vLLM gets its cache too.
    mixed_length:
      knobs:
        prefix_caching:
          value: false
          rationale: common.py's --mixed-phase help asks for prefix caching OFF on both engines.

# The fork that keeps every miniature running: branch pie-evals/v<release> holds one small Python fix per
# commit over upstream's tag v<release>, and the CUDA install overlays it on the PyPI wheel (baselines.ensure_fork).
# Fixes are shape guards, missing-arch fallbacks and loader fixes only: a full model's speed never changes.
fork: {repo: pie-project/vllm, upstream: vllm-project/vllm, src: .}
