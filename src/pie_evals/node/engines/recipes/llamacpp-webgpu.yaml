# llama.cpp in the browser (browser.py LlamacppWebgpuEngine): the native rows' release built by emscripten with
# ggml-webgpu (browser/llamacpp/build.sh), driven like llama-server: one slot per request in flight, decodes and
# prompt chunks sharing a batch of n_batch tokens.

default:
  knobs:
    n_batch:
      value: 2048
      rationale: llama-server's default logical batch.
    n_ubatch:
      value: 512
      rationale: llama-server's default physical batch.
    flash_attn:
      value: auto
      rationale: llama.cpp's default; the WebGPU backend takes flash attention where its kernels cover the shape.
    flush_cache:
      value: true
      rationale: every prompt shuffled; a slot's KV is cleared before each request.
    startup_timeout:
      value: 1200
      rationale: the tab fetches the GGUF as a Blob, then uploads it to the GPU tensor by tensor.

competitive:
  extends: default
