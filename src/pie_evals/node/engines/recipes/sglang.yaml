# SGLang recipes. Knob -> flag mapping lives in SglangEngine.engine_args;
# every knob maps onto a `--sglang-*` flag from scripts/bench/common.py or a flag
# scripts/bench/sglang_bench.py parses.

default:
  knobs:
    gpu_mem_util:
      value: 0.90
      rationale: mem_fraction_static; same fraction as pie's gpu_mem_utilization.
    cuda_graph_max_bs:
      value: "$concurrency"
      rationale: >
        SGLang's default graph ceiling is a hardware-tier heuristic (32 on an
        L40S at tp<4). A decode batch above it silently runs eager and the
        run measures launch overhead, not the engine: 4,642 vs 14,042 tok/s
        on the same cell. vLLM captures up to max_num_seqs, so SGLang is given
        the same ceiling - the shape's concurrency (1 for latency shapes).
    report_timing:
      value: true
      rationale: >
        Streams every request so TTFT / inter-token gaps are stamped on
        delivery, the vantage pie and vLLM are measured from.
    page_size:
      value: 16
      rationale: >
        SGLang's default page is 1 token; 16 matches pie's page and vLLM's
        block so KV fragmentation is comparable across the three.

  arch:
    tpu-v5e:
      knobs:
        gpu_mem_util:
          value: 0.97
          rationale: >
            A v5e chip has 15.75 GiB: at 0.90 neither pie (0 MiB left for KV) nor vLLM-TPU
            (14.32 GiB used > 14.17 cap) boots gemma-4-E4B's 14.3 GiB of weights (b5 39658500805);
            every engine gets the same higher share there.

competitive:
  extends: default
  knobs:
    attention_backend:
      value: null
      rationale: >
        Unset leaves SGLang's own per-arch choice (fa3 on Hopper, flashinfer
        elsewhere), which is what a deployment gets. Override per arch below
        when the auto pick is known to trail.
    radix_cache:
      value: false
      flag: none
      rationale: >
        sglang_bench.py hard-codes disable_radix_cache=True and has no flag to
        turn it on, so the prefix_shared shape cannot give SGLang its cache
        yet. TODO(pie/benches): add --sglang-radix-cache. Recorded, not emitted.
    torch_compile:
      value: false
      flag: none
      rationale: >
        No --sglang-enable-torch-compile flag exists in the script. TODO(pie/benches).
        Recorded, not emitted.
  arch:
    hopper:
      knobs: {}
  family:
    gemma4:
      knobs:
        disable_hybrid_swa_memory:
          value: false
          rationale: >
            Gemma-4's global layers are wider than its sliding ones (head_dim 512 vs 256), so one uniform
            pool sized for the global rows fails every sliding-layer write (CUDA-graph capture: "shape
            '[-1, 1024]' is invalid for input of size 512", gemma-4-E4B on l40s-x1). SGLang 0.5.22 runs
            Gemma-4 on its split full/SWA pools, as it deploys it.
    gpt_oss:
      arch:
        ada:
          knobs:
            disable_piecewise_cuda_graph:
              value: true
              rationale: >
                SGLang 0.5.22 unpacks gpt-oss's MXFP4 experts on Ada and runs out of memory capturing its
                prefill graphs for the 120B miniature ("CUDA error: out of memory" at 2.07 GB free,
                num_tokens=4096, l40s-x1 pf4-512); prefill runs eager, decode keeps its graphs.
    gemma4_moe:
      knobs:
        disable_hybrid_swa_memory:
          value: false
          rationale: Same split full/SWA pools as gemma4 (global head_dim 512, sliding 256).
  workload_kind:
    prefix_shared:
      knobs:
        radix_cache:
          value: true
          flag: none
          rationale: Would be on for the prefix shape once the script exposes it.
  platform:
    rtx4090-x1:
      family:
        gpt_oss:
          knobs:
            gpu_mem_util:
              value: 0.95
              rationale: >
                At 0.90 of a 24 GB RTX 4090 gpt-oss-20b's kv pool holds about the 256 c256 lanes to their end
                and no more, so pie's seated admission held 16 of them back (7.0k tok/s); every engine gets
                the same higher share there.
        gemma4:
          knobs:
            gpu_mem_util:
              value: 0.95
              rationale: >
                gemma-4-E4B's 14.2 GiB of weights leave vLLM 0.32 no KV at 0.90 of a 24 GB RTX 4090 ("Available
                KV cache memory: -0.14 GiB", raw-512-256); every engine gets the same higher share there.
  artifact:
    glm-5.3-mini-tpu:
      platform:
        tpu-v5e-1:
          knobs:
            chunked_prefill_size:
              value: 2048
              rationale: >
                sglang-jax's default 4096-token prefill chunk needs 16.10G of HLO temporaries for the GLM-5.3 mini
                on a 15.75 GiB v5e (RESOURCE_EXHAUSTED, 41896625792); 2048 is the chunk vLLM-TPU prefills in
                (max_num_batched_tokens=2048).
            gpu_mem_util:
              value: 0.90
              rationale: >
                At 0.97 the KV pool leaves sglang-jax 180.63M for a program that reserves 530.41M at load
                (RuntimeProgramAllocationFailure, 42116961512); 0.90 leaves it the room.
    gpt-oss-120b-mxfp4-mini:
      platform:
        a40-x1:
          knobs:
            disable_piecewise_cuda_graph:
              value: true
              rationale: >
                As on Ada: SGLang 0.5.22 runs out of memory capturing the 120B miniature's prefill graphs on a
                48 GB A40 (c128, 2.15 GB free at 0.95, "num_active_captures_ > 0"); prefill runs eager, decode
                keeps its graphs.

# The fork that keeps every miniature running: branch pie-evals/v<release> holds one small Python fix per
# commit over upstream's tag v<release>, and the CUDA install overlays it on the PyPI wheel (baselines.ensure_fork).
# Fixes are shape guards, missing-arch fallbacks and loader fixes only: a full model's speed never changes.
fork: {repo: pie-project/sglang, upstream: sgl-project/sglang, src: python}
