# Splash recipes. The adapter boots `splash serve` once per model. Splash sizes
# its memory, pairs its own draft model and batches concurrent requests by
# itself, so there is little to set. Knob -> flag mapping is in
# SplashEngine.server_cmd.

default:
  knobs:
    max_context:
      value: null
      rationale: Splash default, sized automatically within its memory budget.
    server_extra:
      value: []
      rationale: Extra `splash serve` flags; none means Splash as shipped, DFlash2 drafting and INT8 KV included.
    flush_cache:
      value: true
      rationale: Single stream prefill must not be a prefix cache hit; the client shuffles each prompt.
    startup_timeout:
      value: 1800
      rationale: The first serve of a model downloads its draft and prepares the weights.

competitive:
  extends: default
  knobs:
    max_context:
      value: "$serve_context"
      rationale: Longest shape of the process, rounded like pie max-model-len.
  workload_kind:
    prefix_shared:
      knobs:
        flush_cache:
          value: false
          rationale: The cached prompt shape measures prefix reuse, so Splash keeps its cache.
