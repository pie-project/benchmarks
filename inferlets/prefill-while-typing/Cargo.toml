# Built in pie's examples workspace (cargo build --release --target wasm32-wasip2);
# web/assets/pie-web/prefill_while_typing.wasm is the result.
[package]
name = "prefill-while-typing"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
inferlet = { git = "https://github.com/pie-project/pie", rev = "a82675a0f" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
