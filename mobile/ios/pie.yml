packages:
  Pie:
    path: ${PIE_SWIFT_PACKAGE}
targets:
  PieBench:
    dependencies:
      - package: Pie
        product: PieServer
    sources:
      - path: Vendor/pie/text-completion-bench.wasm
        buildPhase: resources
        group: Pie
      - path: Vendor/pie/PieVendored.swift
        group: Pie
      - path: Vendor/pie/models
        buildPhase: resources
        optional: true
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -framework IOKit"
