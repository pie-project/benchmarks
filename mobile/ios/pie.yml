# Included by project.yml when PIE_ENABLED=YES (scripts/build-pie.sh).
packages:
  Pie:
    path: ${PIE_SWIFT_PACKAGE}
targets:
  PieBench:
    dependencies:
      - package: Pie
        product: PieServer
    sources:
      - path: Vendor/pie/text-completion-bench.wasm
        buildPhase: resources
        group: Pie
      - path: Vendor/pie/PieVendored.swift
        group: Pie
    settings:
      base:
        # pie's Metal engine reads GPU core counts through IOKit; its Package.swift does not link it for iOS.
        OTHER_LDFLAGS: "$(inherited) -framework IOKit"
