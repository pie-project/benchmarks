packages:
  MLCSwift:
    path: Vendor/mlc/MLCSwift
targets:
  PieBench:
    dependencies:
      - package: MLCSwift
        product: MLCSwift
    sources:
      - path: Vendor/mlc/mlc-app-config.json
        buildPhase: resources
        group: MLC
      - path: Vendor/mlc/MLCBuild.swift
        group: MLC
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]: "$(inherited) PIEBENCH_MLC"
        OTHER_LDFLAGS[sdk=iphoneos*]: "$(inherited) -Wl,-force_load,$(PROJECT_DIR)/Vendor/mlc/lib/libmodel_iphone.a -Wl,-force_load,$(PROJECT_DIR)/Vendor/mlc/lib/libmlc_llm.a -Wl,-force_load,$(PROJECT_DIR)/Vendor/mlc/lib/libtvm_runtime.a -Wl,-force_load,$(PROJECT_DIR)/Vendor/mlc/lib/libtvm_ffi_static.a -Wl,-force_load,$(PROJECT_DIR)/Vendor/mlc/lib/libtokenizers_cpp.a -Wl,-force_load,$(PROJECT_DIR)/Vendor/mlc/lib/libsentencepiece.a -Wl,-force_load,$(PROJECT_DIR)/Vendor/mlc/lib/libtokenizers_c.a -lc++"
