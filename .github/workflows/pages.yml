name: pages
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_run:
    workflows: [pie eval, smoke, nightly, weekly]
    types: [completed]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  # the Mac reads the database (liszt is on the tailnet, GitHub's runners are not)
  build:
    runs-on: [self-hosted, macos, m5-max-64g]
    env: { PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[web]"
      - name: site at /
        run: |
          .venv/bin/python tools/webdb.py
          mkdir -p site && cp -R web/. site/
          # a new build gets new links, so browsers never keep an old stylesheet or script
          python3 - <<'PY'
          import re, os
          p = "site/index.html"; v = os.environ.get("GITHUB_SHA", "")[:9] or "1"
          s = open(p).read()
          s = re.sub(r'(href|src)="(assets/[^"]+|data/[^"]+)"', lambda m: f'{m.group(1)}="{m.group(2)}?v={v}"', s)
          open(p, "w").write(s)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: site-files, path: site, retention-days: 3 }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site-files, path: site }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
