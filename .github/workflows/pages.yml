name: pages
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_run:
    workflows: [pie eval, quality, smoke, nightly, weekly, tpu, collect, parity import]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"   # results land in the database during a run; the site picks them up within 5 minutes
  workflow_dispatch:
permissions: { contents: read }
jobs:
  # the Mac reads the database (liszt is on the tailnet, GitHub's runners are not)
  build:
    runs-on: [self-hosted, laptop-pages]  # its own runner on the site laptop, never a bench Mac (one busy benching held a build for 15 minutes): the site runners also expand and collect benchmark runs, and a build queued behind them was replaced by the next before it started
    # a started build always finishes; only the newest waiting build is kept (GitHub drops older pending ones). Cancelling
    # in-flight builds starved the site while results and merges arrived every few minutes: no build finished for an hour
    concurrency: { group: pages-build-2, cancel-in-progress: false }
    permissions: { contents: write }  # pushes the built site to the gh-pages branch
    env: { PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[web]"
      # phone rows the tailnet ingest left in this laptop's inbox (mobile/, pie-evals phone-ingest) go into the database
      # first, so a phone's numbers are on the site within one build; a failure never holds the site back
      - name: phone inbox
        continue-on-error: true
        run: |
          inbox="$HOME/.pie-evals/phone-inbox"
          if compgen -G "$inbox/pending/*.jsonl" >/dev/null; then .venv/bin/pie-evals import-phone --spool "$inbox"; fi
      - name: site at /
        run: |
          .venv/bin/python tools/webdb.py
          mkdir -p site && cp -R web/. site/
          # a new build gets new links, so browsers never keep an old stylesheet or script
          python3 - <<'PY'
          import re, os
          p = "site/index.html"; v = os.environ.get("GITHUB_SHA", "")[:9] or "1"
          s = open(p).read()
          s = re.sub(r'(href|src)="(assets/[^"]+|data/[^"]+)"', lambda m: f'{m.group(1)}="{m.group(2)}?v={v}"', s)
          open(p, "w").write(s)
          PY
      # one open pie issue per platform ("[NVIDIA] Benchmarks") lists Pie Reports: the Outliers card's red dots and the reports
      # people filed, rewritten only when the list changes, and the issue numbers written beside the data for the site's links.
      # Runs with this laptop's gh login and Chrome; a failure never holds the site back
      - name: platform issues
        continue-on-error: true
        run: .venv/bin/python tools/outlier_issues.py site
      # the operator's localhost preview (a checkout on this laptop) gets the same data the site does
      - run: '[ -d "$HOME/Desktop/debug/pie-evals-live/web/data" ] && cp -R web/data/. "$HOME/Desktop/debug/pie-evals-live/web/data/" || true'
      # published as the gh-pages branch, which Pages serves: no Actions artifacts, whose org storage quota blocked every
      # deploy from 11-09 20:44 to 11-10 20:00 (the user: never use GitHub's quota). Only what changed is pushed.
      - name: publish to the gh-pages branch
        env: { TOKEN: "${{ github.token }}" }
        run: |
          echo benchmarks.pie-project.org > site/CNAME && touch site/.nojekyll
          P="$RUNNER_TEMP/ghpages"; rm -rf "$P"
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$P"
          rsync -a --delete --exclude .git site/ "$P/"
          cd "$P" && git add -A
          if git diff --cached --quiet; then echo "the site is unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "site ${GITHUB_SHA::9}"
          git push -q origin gh-pages
