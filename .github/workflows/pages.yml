name: pages
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_run:
    workflows: [pie eval, smoke, nightly, weekly]
    types: [completed]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: [self-hosted, macos, m5-max-128g]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[web]"
      - name: site at /
        env: { PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}" }
        run: |
          .venv/bin/python tools/webdb.py
          mkdir -p site && cp -R web/. site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
