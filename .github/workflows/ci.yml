name: ci
# pull requests only: a merge into main was already tested on its pull request
on:
  pull_request:
    paths-ignore: ["web/**", "docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # hosted minutes are billed: no job may run on for hours
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install ruff
      - run: .venv/bin/ruff check src tests
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv venv && uv pip install -e ".[dev,orchestrate]" pytest-xdist
      - run: .venv/bin/pytest -q -n auto -m "not slow"  # fast unit tests only; each test stops at 120 s (pytest-timeout)
      - run: .venv/bin/pie-evals check
