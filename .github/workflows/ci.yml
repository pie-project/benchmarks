name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "liszt"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --quiet --python 3.12 .venv
          uv pip install --quiet --python .venv/bin/python -e ".[dev,server]" pytest-xdist
      - name: lint
        run: .venv/bin/ruff check src server tests
      - name: postgres
        run: |
          if command -v docker >/dev/null && docker info >/dev/null 2>&1; then
            docker rm -f "pg-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
            docker run -d --name "pg-$GITHUB_RUN_ID" -e POSTGRES_USER=pie -e POSTGRES_PASSWORD=pie -e POSTGRES_DB=bench -p 127.0.0.1::5432 postgres:16-alpine >/dev/null
            port=$(docker port "pg-$GITHUB_RUN_ID" 5432 | head -1 | cut -d: -f2)
            for _ in $(seq 30); do docker exec "pg-$GITHUB_RUN_ID" pg_isready -U pie >/dev/null 2>&1 && break; sleep 1; done
            echo "PIE_BENCH_TEST_DB=postgresql://pie:pie@127.0.0.1:$port/bench" >> "$GITHUB_ENV"
          fi
      - name: test
        run: .venv/bin/pytest -q -n auto -m "not slow"
      - name: package
        run: |
          rm -rf dist
          uv build --quiet --out-dir dist
          uv venv --quiet --python 3.12 /tmp/pie-bench-wheel-$GITHUB_RUN_ID
          uv pip install --quiet --python /tmp/pie-bench-wheel-$GITHUB_RUN_ID/bin/python dist/*.whl
          /tmp/pie-bench-wheel-$GITHUB_RUN_ID/bin/pie-bench machines >/dev/null
          rm -rf /tmp/pie-bench-wheel-$GITHUB_RUN_ID
      - name: cleanup
        if: always()
        run: docker rm -f "pg-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
