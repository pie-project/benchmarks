name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install
        run: |
          uv venv --quiet --python 3.12 .venv
          uv pip install --quiet --python .venv/bin/python -e ".[dev,server]"
      - name: lint
        run: |
          .venv/bin/ruff check src server
          .venv/bin/ruff format --check src server
      - name: package
        run: |
          rm -rf dist
          uv build --quiet --out-dir dist
          uv venv --quiet --python 3.12 /tmp/pie-bench-wheel-$GITHUB_RUN_ID
          uv pip install --quiet --python /tmp/pie-bench-wheel-$GITHUB_RUN_ID/bin/python dist/*.whl
          /tmp/pie-bench-wheel-$GITHUB_RUN_ID/bin/pie-bench machines >/dev/null
          rm -rf /tmp/pie-bench-wheel-$GITHUB_RUN_ID
