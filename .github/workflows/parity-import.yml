name: parity import
# imports the parity and kernel stores a parity run has handed over so far (in its finished jobs' logs), so rows reach the site while it still runs
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "parity run whose parity/kernels/mac stores to import, or a tpu.yml parity run's from ~/pie-evals-handoff (empty: none)", required: false, default: "" }
      mac: { description: "runner Mac holding a saved parity-out (its store/ is imported too)", required: false, default: "" }
      mac_dir: { description: "that parity-out's path on the Mac", required: false, default: "~/qual/mac-rows/parity-out" }
permissions: { contents: read, actions: read }
jobs:
  mac:
    if: inputs.mac != ''
    runs-on: [self-hosted, macos, "${{ inputs.mac }}"]
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: infra/ci }
      - run: rm -rf saved && mkdir saved && cp -R ${{ inputs.mac_dir }}/store saved/
      - run: python3 infra/ci/handoff.py send "parity-${{ inputs.mac }}-saved" saved  # in this job's log, never GitHub's artifact storage
  import:
    needs: mac
    if: always() && needs.mac.result != 'failure'
    runs-on: [self-hosted, site, handoff]  # the site laptop: bookkeeping never shares a benchmark Mac; it holds tpu.yml's records
    concurrency: { group: "parity-import-${{ inputs.run_id }}", cancel-in-progress: false }
    env: { PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: the parity run's stores
        if: inputs.run_id != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 infra/ci/handoff.py recv --run-id "${{ inputs.run_id }}" --job 'parity|kernels|mac' out
          h="$HOME/pie-evals-handoff/out-${{ inputs.run_id }}"  # a tpu.yml parity run's
          if [ -d "$h" ]; then mkdir -p out && cp -R "$h" out/; fi
      - name: the saved store from the Mac
        if: inputs.mac != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 infra/ci/handoff.py recv --job mac out
      - name: import into the database
        run: |
          shopt -s nullglob
          for d in out/*/store out/*/parity/store; do echo "== $d"; .venv/bin/pie-evals import-store "$d"; done
