name: phone import
# The phone benchmark app's results (mobile/) without the tailnet: paste the app's "Copy for workflow" text (gzip+base64
# of its records.jsonl) or the records.jsonl itself as `records`. Runs on the site laptop, the only place that sees
# PIE_EVALS_DB, and also stores whatever the tailnet ingest left in that laptop's inbox. `drop_tag` deletes a test-* tag.
#   gh workflow run phone-import.yml -f records="$(gzip -c records.jsonl | base64)"
on:
  workflow_dispatch:
    inputs:
      records: { description: "the app's Copy for workflow text, or records.jsonl lines", required: false, default: "" }
      tag: { description: "tag for rows that name none (default: the newest release)", required: false, default: "" }
      drop_tag: { description: "a test-* tag to delete instead", required: false, default: "" }
permissions: { contents: read }
jobs:
  import:
    runs-on: [self-hosted, site]
    timeout-minutes: 15
    concurrency: { group: phone-import, cancel-in-progress: false }
    env:
      PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}"
      RECORDS: "${{ inputs.records }}"
      TAG: "${{ inputs.tag }}"
      DROP_TAG: "${{ inputs.drop_tag }}"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e .
      - name: drop a test tag
        if: ${{ inputs.drop_tag != '' }}
        run: |
          case "$DROP_TAG" in test-*) .venv/bin/pie-evals drop-tag "$DROP_TAG" ;; *) echo "only a test-* tag is dropped here" >&2; exit 1 ;; esac
      - name: store the rows
        if: ${{ inputs.drop_tag == '' }}
        run: |
          args=(); [ -n "$TAG" ] && args+=(--tag "$TAG")
          files=(); if [ -n "$RECORDS" ]; then printf '%s' "$RECORDS" > phone-records.txt; files+=(phone-records.txt); fi
          .venv/bin/pie-evals import-phone "${args[@]}" --spool "$HOME/.pie-evals/phone-inbox" "${files[@]}"
