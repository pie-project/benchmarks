name: pie eval
run-name: pie eval ${{ github.event.client_payload.tag || inputs.tag || 'manual' }}
permissions: { contents: read, actions: read }
concurrency:
  # manual runs go side by side (each Mac's own lock keeps two benchmarks off one machine); release dispatches queue per tag
  group: ${{ github.event_name == 'workflow_dispatch' && format('pie-eval-{0}', github.run_id) || format('pie-eval-{0}', github.event.client_payload.tag) }}
  cancel-in-progress: false
# Runs only for a release (the pie repo sends the tag) or by hand with a tag. No schedule, no per-commit runs.
on:
  repository_dispatch:
    types: [pie-eval]
  workflow_dispatch:
    inputs:
      tag: { description: "release tag (0.5.2) or a custom name; empty: manual-<time>", required: false, default: "" }
      pie_commit: { description: "pie commit (empty: the tag's commit, or pie main)", required: false, default: "" }
      suite: { description: "config.json suite measured when no models are given: targeted (Tier 1, what a release runs) or full", type: choice, options: [targeted, full], default: "targeted" }
      models: { description: "comma-separated model ids (empty: the suite's); a baseline arm brings its pie counterpart", required: false, default: "" }
      macs: { description: "comma-separated Mac ids (empty: config.json)", required: false, default: "" }
      benchmarks: { description: "comma-separated workload ids (empty: config.json)", required: false, default: "" }
      engines: { description: "any of pie,llamacpp,mlxlm,splash (default all)", required: false, default: "pie,llamacpp,mlxlm,splash" }

env:
  PIE_REPO: ${{ vars.PIE_REPO || 'pie-project/pie' }}

jobs:
  start:
    runs-on: ${{ fromJSON(vars.HOSTED_RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      tag_kind: ${{ steps.p.outputs.tag_kind }}
      pins: ${{ steps.p.outputs.pins }}
      commit: ${{ steps.p.outputs.commit }}
      artifacts: ${{ steps.p.outputs.artifacts }}
      macs: ${{ steps.p.outputs.macs }}
      skip: ${{ steps.p.outputs.skip }}
      workloads: ${{ steps.p.outputs.workloads }}
      engines: ${{ steps.p.outputs.engines }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - id: p
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT || github.token }}
          COMMIT: ${{ github.event.client_payload.pie_commit || github.event.inputs.pie_commit }}
          TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
          # a release dispatch measures the targeted suite
          SUITE: ${{ github.event.inputs.suite || 'targeted' }}
          IN_MODELS: ${{ github.event.inputs.models }}
          IN_MACS: ${{ github.event.inputs.macs }}
          IN_WORKLOADS: ${{ github.event.inputs.benchmarks }}
          IN_ENGINES: ${{ github.event.inputs.engines }}
        run: |
          # a run is a tag: a release from the pie repo, or a named manual run. Nothing else is measured.
          if [ "${{ github.event_name }}" != workflow_dispatch ] && [ -z "$TAG" ]; then echo "::notice::no tag, nothing to measure"; TAG=""; fi
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = workflow_dispatch ]; then TAG="manual-$(date -u +%Y%m%d-%H%M)"; fi
          [[ "$TAG" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          kind=manual; [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && kind=release
          if [ -z "$COMMIT" ]; then
            # a git tag names its commit; a manual name that is not a tag measures pie main
            c=$(gh api "repos/$PIE_REPO/commits/$TAG" --jq .sha 2>/dev/null) || c=""
            [[ "$c" =~ ^[0-9a-f]{40}$ ]] || c=$(gh api "repos/$PIE_REPO/commits/main" --jq .sha)
            COMMIT=$c
          fi
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pie_commit must be a full sha, got '$COMMIT'"; exit 1; }
          [[ "$SUITE" =~ ^(targeted|full)$ ]] || { echo "::error::bad suite '$SUITE'"; exit 1; }
          models=$(.venv/bin/pie-evals suite "$SUITE"); macs=$(jq -r '.machines // [] | join(",")' config.json); workloads=$(jq -r '.benchmarks // [] | join(",")' config.json)
          engines=pie,llamacpp,mlxlm,splash
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            [ -n "$IN_MODELS" ] && models=$IN_MODELS; [ -n "$IN_MACS" ] && macs=$IN_MACS; [ -n "$IN_WORKLOADS" ] && workloads=$IN_WORKLOADS; engines=${IN_ENGINES:-pie,llamacpp,mlxlm,splash}
          fi
          [[ "$models$macs$workloads$engines" =~ ^[a-z0-9.,-]*$ ]] || { echo "::error::bad input"; exit 1; }
          # an unknown workload id would silently leave only the control: refuse it instead
          unknown=$(.venv/bin/python -c "import sys,yaml; known={w['id'] for w in yaml.safe_load(open('matrix/workloads.yaml'))['workloads']}; print(','.join(w for w in sys.argv[1].split(',') if w and w not in known))" "$workloads")
          [ -z "$unknown" ] || { echo "::error::unknown workload id(s): $unknown"; exit 1; }
          artifacts=$(.venv/bin/python -c "import sys,yaml; want=set(filter(None,sys.argv[1].split(','))); arts=yaml.safe_load(open('matrix/models.yaml'))['artifacts']; pie={a.get('baseline_of') for a in arts if a['id'] in want}; print(','.join(a['id'] for a in arts if a['id'] in want or a['id'] in pie or (a['id'] not in pie and a.get('baseline_of') in want)))" "$models")
          skip=false; [ -n "$TAG" ] || skip=true; [ -n "$artifacts" ] && [ -n "$workloads" ] || skip=true
          # a pie commit that only touches docs or CI files cannot move a number; a manual run measures it anyway
          if [ "${{ github.event_name }}" != workflow_dispatch ] && [ "$(gh api "repos/$PIE_REPO/commits/$COMMIT" --jq '.files[].filename' | .venv/bin/pie-evals docs-only)" = true ]; then
            skip=true; echo "docs-only pie commit, nothing to measure" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "tag=$TAG tag_kind=$kind commit=$COMMIT suite=$SUITE models=$models artifacts=$artifacts macs=${macs:-every connected Mac} benchmarks=$workloads engines=$engines skip=$skip" | tee -a "$GITHUB_STEP_SUMMARY"
          # the competitors at their newest release today: a fair comparison at the time of this tag
          pins=$(.venv/bin/pie-evals pins latest)
          echo "competitors: $pins" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "pins=$pins" >> "$GITHUB_OUTPUT"
          { echo "tag=$TAG"; echo "tag_kind=$kind"; echo "commit=$COMMIT"; echo "artifacts=$artifacts"; echo "macs=$macs"; echo "workloads=$workloads"; echo "engines=$engines"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

  run:
    needs: start
    if: needs.start.outputs.skip != 'true'
    uses: ./.github/workflows/tier.yml
    with:
      tier: targeted
      pie_commit: ${{ needs.start.outputs.commit }}
      tag: ${{ needs.start.outputs.tag }}
      tag_kind: ${{ needs.start.outputs.tag_kind }}
      pins: ${{ needs.start.outputs.pins }}
      artifacts: ${{ needs.start.outputs.artifacts }}
      platforms: ${{ needs.start.outputs.macs }}
      workloads: ${{ needs.start.outputs.workloads }}
      engines: ${{ needs.start.outputs.engines }}
      # a run of named models is a quick rerun: no cool-down before single-stream rows (the full suite keeps it)
      # a tag is a fresh measurement of everything: pie at the tag, competitors at their releases today
      skip_recorded: false
      # a run started from a branch tries that branch's harness and saves nothing
      persist: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
