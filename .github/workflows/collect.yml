# Bookkeeping: lift node outputs into the Postgres store on liszt.
# Standalone (manual re-collect). tier.yml carries its own inline copy because a
# called workflow cannot call another reusable workflow.
name: collect
on:
  workflow_dispatch:
    inputs:
      tier: { type: string, required: true, default: targeted }
      run_id: { description: "run whose out-* artifacts to import (empty: this run)", required: false, default: "" }

jobs:
  collect:
    runs-on: [self-hosted, macos, m5-max-128g]
    env: { PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "out-*", path: out, run-id: "${{ inputs.run_id || github.run_id }}", github-token: "${{ github.token }}" }
      - name: check the database
        run: .venv/bin/pie-evals store-status
      - name: import into the database
        run: |
          shopt -s nullglob
          dirs=(out/out-*)
          [ ${#dirs[@]} -gt 0 ] && .venv/bin/pie-evals collect --tier "${{ inputs.tier }}" "${dirs[@]}" || echo "no node outputs"
