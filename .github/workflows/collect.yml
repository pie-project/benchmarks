# Bookkeeping: lift node outputs into the parquet store, render reports,
# commit both. Reusable from every tier workflow.
# Standalone bookkeeping (manual re-collect). tier.yml carries its own inline
# copy because a called workflow cannot call another reusable workflow.
name: collect
on:
  workflow_dispatch:
    inputs:
      tier: { type: string, required: true, default: targeted }
      run_id: { description: "run whose out-* artifacts to import (empty: this run)", required: false, default: "" }

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "out-*", path: out, run-id: "${{ inputs.run_id || github.run_id }}", github-token: "${{ github.token }}" }
      - name: import into store
        run: |
          shopt -s nullglob
          dirs=(out/out-*)
          [ ${#dirs[@]} -gt 0 ] && .venv/bin/pie-evals collect --tier "${{ inputs.tier }}" "${dirs[@]}" || echo "no node outputs"
      - name: reports
        id: report
        run: .venv/bin/pie-evals report --tier "${{ inputs.tier }}" --out reports
      - name: commit store + reports
        run: |
          git config user.name "pie-evals-bot"; git config user.email "pie-evals-bot@users.noreply.github.com"
          git add store reports
          git diff --cached --quiet || git commit -m "store: ${{ inputs.tier }} run ${{ inputs.run_id || github.run_id }}"
          git pull --rebase --quiet origin main && git push --quiet origin HEAD:main
