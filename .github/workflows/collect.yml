# Bookkeeping: lift node outputs into the Postgres store on liszt.
# Standalone (manual re-collect). tier.yml carries its own inline copy because a
# called workflow cannot call another reusable workflow.
name: collect
permissions: { contents: read, actions: read }
on:
  workflow_dispatch:
    inputs:
      tier: { type: string, required: true, default: targeted }
      run_id: { description: "run whose out-* artifacts to import (empty: this run)", required: false, default: "" }
      tag: { description: "tag the rows belong to (0.5.3-b1); empty: untagged", required: false, default: "" }
      tag_kind: { description: "release or manual (empty: from the tag)", required: false, default: "" }
      drop_tags: { description: "comma-separated manual tags to delete from the database instead of importing", required: false, default: "" }
      drop_engines: { description: "comma-separated engines whose results and quality scores to delete instead of importing", required: false, default: "" }
      drop_workloads: { description: "comma-separated workloads whose results to delete instead of importing", required: false, default: "" }
      move_tags: { description: "comma-separated src:dst tag pairs: move src's good rows into dst instead of importing", required: false, default: "" }
      runner: { description: "runner label to import on (site; or an idle Mac like m5-max-64g when the site laptop is backed up)", required: false, default: "site" }

jobs:
  collect:
    runs-on: [self-hosted, "${{ inputs.runner || 'site' }}"]  # the site laptop: bookkeeping shares a benchmark Mac only when asked to
    env: { PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: drop manual tags
        if: inputs.drop_tags != ''
        run: for t in $(echo "${{ inputs.drop_tags }}" | tr ',' ' '); do .venv/bin/pie-evals drop-tag "$t"; done
      - name: drop engines
        if: inputs.drop_engines != ''
        run: for e in $(echo "${{ inputs.drop_engines }}" | tr ',' ' '); do .venv/bin/pie-evals drop-engine "$e"; done
      - name: drop workloads
        if: inputs.drop_workloads != ''
        run: for w in $(echo "${{ inputs.drop_workloads }}" | tr ',' ' '); do .venv/bin/pie-evals drop-workload "$w"; done
      - name: move tags
        if: inputs.move_tags != ''
        run: for p in $(echo "${{ inputs.move_tags }}" | tr ',' ' '); do .venv/bin/pie-evals move-tag "${p%%:*}" "${p#*:}"; done
      - uses: actions/download-artifact@v4
        if: inputs.drop_tags == '' && inputs.drop_engines == '' && inputs.drop_workloads == '' && inputs.move_tags == ''
        with: { pattern: "out-*", path: out, run-id: "${{ inputs.run_id || github.run_id }}", github-token: "${{ github.token }}" }
      - name: check the database
        run: .venv/bin/pie-evals store-status
      - name: import into the database
        if: inputs.drop_tags == '' && inputs.drop_engines == '' && inputs.drop_workloads == '' && inputs.move_tags == ''
        run: |
          shopt -s nullglob
          # a node's outputs, or (a tpu.yml run) one directory a shard inside them
          dirs=(); for d in out/out-* out/out-*/*/; do [ -s "$d/records.jsonl" ] && dirs+=("${d%/}"); done
          tagargs=()
          [ -n "${{ inputs.tag }}" ] && tagargs+=(--tag "${{ inputs.tag }}")
          kind="${{ inputs.tag_kind }}"; [ -z "$kind" ] && [ -n "${{ inputs.tag }}" ] && { kind=manual; [[ "${{ inputs.tag }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && kind=release; }
          [ -n "$kind" ] && tagargs+=(--tag-kind "$kind")
          [ ${#dirs[@]} -gt 0 ] && .venv/bin/pie-evals collect --tier "${{ inputs.tier }}" "${tagargs[@]}" "${dirs[@]}" || echo "no node outputs"
