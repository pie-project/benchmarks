name: reap-tpu
# Hourly: delete any TPU VM in pie-project-510103 older than 4 hours. The nightly TPU run deletes its own VM when it
# ends (its bench is capped at 210 minutes), so anything older than 4 hours was left behind and is idle money.
on:
  schedule: [{ cron: "23 * * * *" }]
  workflow_dispatch:
    inputs:
      names: { description: "comma-separated pie-evals VM names to delete now, whatever their age (a run whose teardown was cancelled)", required: false, default: "" }
permissions: { contents: read }
jobs:
  reap:
    runs-on: ${{ fromJSON(vars.HOSTED_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.GCP_TPU_SA_KEY }}" }
      - uses: google-github-actions/setup-gcloud@v2
      - name: delete TPU VMs older than 4 hours
        run: |
          set -euo pipefail
          D=$(command -v gdate || echo date)  # the site laptops' BSD date has no -d
          cutoff=$($D -u -d '-4 hours' +%s)
          dev_cutoff=$($D -u -d '-24 hours' +%s)  # agents' dev VMs (not pie-evals-*) run long profiling sessions
          # name is projects/<p>/locations/<zone>/nodes/<name>: the list has no zone column of its own
          gcloud compute tpus tpu-vm list --zone=- --project pie-project-510103 --format=json |
          jq -r '.[] | (.name | split("/")) as $n | "\($n[-1]) \($n[3]) \(.createTime)"' |
          while read -r name zone created; do
            [ -n "$name" ] || continue
            t=$($D -u -d "$created" +%s)
            limit=$cutoff; [[ "$name" == pie-evals-* ]] || limit=$dev_cutoff
            if [ "$t" -lt "$limit" ] || [[ ",${{ inputs.names }}," == *",$name,"* ]]; then
              echo "deleting $name in $zone (created $created)"
              gcloud compute tpus tpu-vm delete "$name" --zone "$zone" --project pie-project-510103 --quiet
              # its data disk (vm.sh create) outlives it
              gcloud compute disks delete "$name-data" --zone "$zone" --project pie-project-510103 --quiet 2>/dev/null || true
            else
              echo "keeping $name (created $created)"
            fi
          done
      - name: the pie-evals data disks left (each belongs to a VM above, or was left behind)
        run: gcloud compute disks list --project pie-project-510103 --filter 'labels.owner=pie-evals' --format 'value(name,zone.basename(),users.len())'
