          ssh_() { for i in 1 2 3; do ssh -o BatchMode=yes -o ConnectTimeout=45 -o StrictHostKeyChecking=accept-new "root@$1" "$2" && return 0; sleep 10; done; return 1; }
          for p in ${PODS//,/ }; do
