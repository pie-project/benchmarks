name: pod import
# collects the benchmark outputs that agents leave on rented pods (/workspace/out/<job>/records.jsonl) into the
# database, from the site laptop: it is on the tailnet with the pods, and only a workflow job sees PIE_EVALS_DB.
# Collecting a run again replaces its rows, so every pass simply takes everything the pods hold so far.
on:
  workflow_dispatch:
    inputs:
      pods: { description: "comma-separated pod ids on the tailnet", required: false, default: "" }
      tag: { description: "site tag the rows are stored under", required: false, default: "l40s-full" }
      reset: { description: "drop every row of the tag first, so the pods' current /workspace/out is all the tag holds", type: boolean, required: false, default: false }
  schedule:
    - cron: "*/10 * * * *"
permissions: { contents: read }
env:
  PODS: "${{ inputs.pods || 'djar5c5imsbpdj,abkmiiao0gbm4c,hj06ul5pa8d1si,8ktv61dhwbaac5' }}"
  TAG: "${{ inputs.tag || 'l40s-full' }}"
jobs:
  import:
    if: ${{ !contains(fromJSON('["pro6000-full","h100-full","h200-full","b200-full"]'), inputs.tag) }}
    runs-on: [self-hosted, site]  # the site laptop: on the tailnet, and its jobs receive the database secret
    concurrency: { group: pod-import, cancel-in-progress: false }
    env: { PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: copy finished outputs from the pods (read only)
        run: |
          rm -rf pods unreachable new.sig && mkdir pods && touch new.sig
          # only the dirs whose records.jsonl changed (size and mtime) since the last import that took them; a reset takes all
          state=~/.pod-import/$TAG.state && mkdir -p ~/.pod-import && touch "$state"
          [ "${{ inputs.reset }}" = true ] && state=/dev/null
          # pods far away ride a Tailscale relay, whose first handshake can take tens of seconds: a long timeout, three tries
          ssh_() { for i in 1 2 3; do ssh -o BatchMode=yes -o ConnectTimeout=45 -o StrictHostKeyChecking=accept-new "root@$1" "$2" && return 0; sleep 10; done; return 1; }
          for p in ${PODS//,/ }; do
            sigs=$(ssh_ "$p" 'cd /workspace/out 2>/dev/null && for d in */; do [ -s "$d/records.jsonl" ] && echo "${d%/} $(stat -c %s.%Y "$d/records.jsonl")"; done; true' 2>/dev/null) || { echo "::warning::$p unreachable"; echo "$p" >> unreachable; continue; }
            changed=$(echo "$sigs" | while read -r d s; do [ -n "$d" ] && ! grep -qxF "$p $d $s" "$state" && echo "$p $d $s"; done; true)
            [ -n "$changed" ] || { echo "$p: nothing new"; continue; }
            dirs=$(echo "$changed" | cut -d' ' -f2 | tr '\n' ' ')
            mkdir -p "pods/$p"
            ssh_ "$p" "tar -C /workspace/out -czf - $dirs" | tar -C "pods/$p" -xzf - && echo "$changed" >> new.sig && echo "$p: $dirs"
          done
      - name: collect into the database
        run: |
          shopt -s nullglob
          dirs=(pods/*/*/)
          [ ${#dirs[@]} -gt 0 ] || { echo "no outputs yet"; exit 0; }
          # a reset clears what the pods no longer stand behind (smokes, sweeps, superseded runs) before the re-import
          # never with a pod missing: its rows would be dropped and not come back until the next pass reaches it
          if [ "${{ inputs.reset }}" = true ]; then
            if [ -s unreachable ]; then echo "::error::reset skipped: unreachable $(tr '\n' ' ' < unreachable)"; exit 1; fi
            .venv/bin/pie-evals drop-tag "$TAG"
          fi
          .venv/bin/pie-evals collect --tier weekly --tag "$TAG" --tag-kind manual "${dirs[@]}" > collect.log 2>&1 || rc=$?
          cat collect.log
          # remember each dir that landed, so the next pass skips it until its records change; a reset starts the state over
          state=~/.pod-import/$TAG.state && touch "$state"
          [ "${{ inputs.reset }}" = true ] && : > "$state"
          while read -r p d s; do grep -q "^pods/$p/$d -> " collect.log && echo "$p $d $s"; done < new.sig > landed || true
          awk 'NR==FNR { k[$1" "$2]; next } !(($1" "$2) in k)' landed "$state" > state.tmp && cat landed >> state.tmp && mv state.tmp "$state"
          exit ${rc:-0}
  # the pro6000-x1 evaluation, side by side with the run above
  import-pro6000:
    if: ${{ github.event_name == 'schedule' || inputs.tag == 'pro6000-full' }}
    runs-on: [self-hosted, site]  # the site laptop: on the tailnet, and its jobs receive the database secret
    concurrency: { group: pod-import-pro6000, cancel-in-progress: false }
    env:
      PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}"
      PODS: "${{ inputs.tag == 'pro6000-full' && inputs.pods || 'tpqh5rtwsneklz,j3a8sc17krfs3f' }}"
      TAG: pro6000-full
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: copy finished outputs from the pods (read only)
        run: |
          rm -rf pods unreachable new.sig && mkdir pods && touch new.sig
          # only the dirs whose records.jsonl changed (size and mtime) since the last import that took them; a reset takes all
          state=~/.pod-import/$TAG.state && mkdir -p ~/.pod-import && touch "$state"
          [ "${{ inputs.reset }}" = true ] && state=/dev/null
          # pods far away ride a Tailscale relay, whose first handshake can take tens of seconds: a long timeout, three tries
          ssh_() { for i in 1 2 3; do ssh -o BatchMode=yes -o ConnectTimeout=45 -o StrictHostKeyChecking=accept-new "root@$1" "$2" && return 0; sleep 10; done; return 1; }
          for p in ${PODS//,/ }; do
            sigs=$(ssh_ "$p" 'cd /workspace/out 2>/dev/null && for d in */; do [ -s "$d/records.jsonl" ] && echo "${d%/} $(stat -c %s.%Y "$d/records.jsonl")"; done; true' 2>/dev/null) || { echo "::warning::$p unreachable"; echo "$p" >> unreachable; continue; }
            changed=$(echo "$sigs" | while read -r d s; do [ -n "$d" ] && ! grep -qxF "$p $d $s" "$state" && echo "$p $d $s"; done; true)
            [ -n "$changed" ] || { echo "$p: nothing new"; continue; }
            dirs=$(echo "$changed" | cut -d' ' -f2 | tr '\n' ' ')
            mkdir -p "pods/$p"
            ssh_ "$p" "tar -C /workspace/out -czf - $dirs" | tar -C "pods/$p" -xzf - && echo "$changed" >> new.sig && echo "$p: $dirs"
          done
      - name: collect into the database
        run: |
          shopt -s nullglob
          dirs=(pods/*/*/)
          [ ${#dirs[@]} -gt 0 ] || { echo "no outputs yet"; exit 0; }
          # a reset clears what the pods no longer stand behind (smokes, sweeps, superseded runs) before the re-import
          # never with a pod missing: its rows would be dropped and not come back until the next pass reaches it
          if [ "${{ inputs.reset }}" = true ]; then
            if [ -s unreachable ]; then echo "::error::reset skipped: unreachable $(tr '\n' ' ' < unreachable)"; exit 1; fi
            .venv/bin/pie-evals drop-tag "$TAG"
          fi
          .venv/bin/pie-evals collect --tier weekly --tag "$TAG" --tag-kind manual "${dirs[@]}" > collect.log 2>&1 || rc=$?
          cat collect.log
          # remember each dir that landed, so the next pass skips it until its records change; a reset starts the state over
          state=~/.pod-import/$TAG.state && touch "$state"
          [ "${{ inputs.reset }}" = true ] && : > "$state"
          while read -r p d s; do grep -q "^pods/$p/$d -> " collect.log && echo "$p $d $s"; done < new.sig > landed || true
          awk 'NR==FNR { k[$1" "$2]; next } !(($1" "$2) in k)' landed "$state" > state.tmp && cat landed >> state.tmp && mv state.tmp "$state"
          exit ${rc:-0}
      - name: collect the pods' parity stores (/workspace/parity/store) into the database
        run: |
          rm -rf parity && mkdir parity
          ssh_() { for i in 1 2 3; do ssh -o BatchMode=yes -o ConnectTimeout=45 -o StrictHostKeyChecking=accept-new "root@$1" "$2" && return 0; sleep 10; done; return 1; }
          for p in ${PODS//,/ }; do
            ssh_ "$p" 'test -d /workspace/parity/store' 2>/dev/null || continue
            mkdir -p "parity/$p" && ssh_ "$p" 'tar -C /workspace/parity -czf - store' | tar -C "parity/$p" -xzf - || continue
            .venv/bin/pie-evals import-store "parity/$p/store"
          done

  # the h100-sxm-x1, h200-x1 and b200-x1 evaluations, side by side with the runs above
  import-eval:
    if: ${{ github.event_name == 'schedule' || contains(fromJSON('["h100-full","h200-full","b200-full"]'), inputs.tag) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: h100-full, pods: "yt6tq0eyp68itv,66r29refi3g9uw" }
          - { tag: h200-full, pods: "kt2kayb9c16mqq,yvumqzy9tyatci" }
    runs-on: [self-hosted, site]  # the site laptop: on the tailnet, and its jobs receive the database secret
    concurrency: { group: "pod-import-${{ matrix.tag }}", cancel-in-progress: false }
    env:
      PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}"
      PODS: "${{ inputs.tag == matrix.tag && inputs.pods || matrix.pods }}"
      TAG: "${{ matrix.tag }}"
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'schedule' || inputs.tag == matrix.tag }}
      - uses: astral-sh/setup-uv@v3
        if: ${{ github.event_name == 'schedule' || inputs.tag == matrix.tag }}
      - run: uv venv && uv pip install -e ".[orchestrate]"
        if: ${{ github.event_name == 'schedule' || inputs.tag == matrix.tag }}
      - name: copy finished outputs from the pods (read only)
        if: ${{ github.event_name == 'schedule' || inputs.tag == matrix.tag }}
        run: |
          rm -rf pods unreachable new.sig && mkdir pods && touch new.sig
          # only the dirs whose records.jsonl changed (size and mtime) since the last import that took them; a reset takes all
