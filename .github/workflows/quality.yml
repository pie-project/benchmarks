name: quality
run-name: quality ${{ github.event.client_payload.tag || inputs.tag || 'manual' }}
permissions: { contents: read, actions: read }
# one quality run per dispatch, in its own group: it runs beside the benchmark eval (pie-eval.yml), which has its own group
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('quality-{0}', github.run_id) || format('quality-{0}', github.event.client_payload.tag) }}
  cancel-in-progress: false
on:
  # the pie repo sends the same release dispatch as the benchmark eval, so a release is scored beside it
  repository_dispatch:
    types: [pie-eval]
  workflow_dispatch:
    inputs:
      tag: { description: "release tag (0.5.2) or a custom name; empty: manual-<time>", required: false, default: "" }
      pie_commit: { description: "pie commit (empty: the tag's commit, or pie main)", required: false, default: "" }
      suite: { description: "config.json suite scored when no artifacts are given: targeted (Tier 1, what a release runs) or full", type: choice, options: [targeted, full], default: "targeted" }
      artifacts: { description: "comma-separated artifact ids (empty: every arm of the suite, with its pie arm)", required: false, default: "" }
      tasks: { description: "comma-separated tasks (gsm8k, ifeval, mmlu, arc, math500)", required: false, default: "gsm8k,ifeval,mmlu,arc,math500" }
      n: { description: "questions per task", required: false, default: "100" }
      mac: { description: "Mac id, or auto: the fast Mac (m5-max-128g, then m5-max-64g) with an idle runner", required: false, default: "auto" }
      platform: { description: "store the rows under the Mac's platform id (true: a per-Mac Quality cell)", type: boolean, required: false, default: false }

jobs:
  start:
    runs-on: ${{ fromJSON(vars.HOSTED_RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      tag_kind: ${{ steps.p.outputs.tag_kind }}
      commit: ${{ steps.p.outputs.commit }}
      artifacts: ${{ steps.p.outputs.artifacts }}
      mac: ${{ steps.p.outputs.mac }}
      skip: ${{ steps.p.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - id: p
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT || github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.client_payload.pie_commit || github.event.inputs.pie_commit }}
          TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
          # a release dispatch scores the targeted suite
          SUITE: ${{ github.event.inputs.suite || 'targeted' }}
          IN_ARTIFACTS: ${{ github.event.inputs.artifacts }}
          IN_MAC: ${{ github.event.inputs.mac }}
        run: |
          # a run is a tag: a release from the pie repo, or a named manual run. Nothing else is scored.
          if [ "${{ github.event_name }}" != workflow_dispatch ] && [ -z "$TAG" ]; then echo "::notice::no tag, nothing to score"; TAG=""; fi
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = workflow_dispatch ]; then TAG="manual-$(date -u +%Y%m%d-%H%M)"; fi
          [[ "$TAG" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          kind=manual; [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && kind=release
          if [ -z "$COMMIT" ]; then
            # the commit the pie build comes from: a git tag names its commit; a manual name that is not a tag measures pie main
            c=$(gh api "repos/pie-project/pie/commits/$TAG" --jq .sha 2>/dev/null) || c=""
            [[ "$c" =~ ^[0-9a-f]{40}$ ]] || c=$(gh api "repos/pie-project/pie/commits/main" --jq .sha)
            COMMIT=$c
          fi
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pie_commit must be a full sha, got '$COMMIT'"; exit 1; }
          # every arm of the suite in config.json, and the pie arm each one is compared with
          [[ "$IN_MAC" =~ ^[a-z0-9-]*$ ]] || { echo "::error::bad mac '$IN_MAC'"; exit 1; }
          [[ "$SUITE" =~ ^(targeted|full)$ ]] || { echo "::error::bad suite '$SUITE'"; exit 1; }
          want=$(.venv/bin/pie-evals suite "$SUITE")
          artifacts=$(.venv/bin/python -c "import sys,yaml; want=set(filter(None,sys.argv[1].split(','))); arts=yaml.safe_load(open('matrix/models.yaml'))['artifacts']; pie={a.get('baseline_of') for a in arts if a['id'] in want}; print(','.join(a['id'] for a in arts if a['id'] in want or a['id'] in pie or (a['id'] not in pie and a.get('baseline_of') in want)))" "$want")
          # an explicit list is scored as given, so a run split across Macs does not repeat the pie arms
          [ -n "$IN_ARTIFACTS" ] && artifacts=$IN_ARTIFACTS
          # the fastest free Mac: the 128 GB one, then the 64 GB one, whichever has an idle runner first; none idle: the 128 GB one
          mac="$IN_MAC"
          if [ -z "$mac" ] || [ "$mac" = auto ]; then
            mac=m5-max-128g
            for cand in m5-max-128g m5-max-64g; do
              idle=$(gh api --paginate "repos/$REPO/actions/runners" --jq ".runners[] | select(any(.labels[]; .name == \"$cand\")) | select(.status == \"online\" and .busy == false) | .name" 2>/dev/null | wc -l | tr -d ' ')
              if [ "${idle:-0}" -gt 0 ]; then mac=$cand; break; fi
            done
          fi
          skip=false; [ -n "$TAG" ] || skip=true; [ -n "$artifacts" ] || skip=true
          echo "tag=$TAG tag_kind=$kind commit=$COMMIT suite=$SUITE mac=$mac artifacts=$artifacts skip=$skip" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "tag=$TAG"; echo "tag_kind=$kind"; echo "commit=$COMMIT"; echo "artifacts=$artifacts"; echo "mac=$mac"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

  quality:
    needs: start
    if: needs.start.outputs.skip != 'true'
    runs-on: [self-hosted, macos, "${{ needs.start.outputs.mac }}"]
    timeout-minutes: 1440
    env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: legacy-pipeline }
      - name: install harness
        run: |
          # the runner's service PATH may lack uv, cargo and Homebrew: add them for this step and every later one
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          printf '%s\n' "$HOME/.local/bin" "$HOME/.cargo/bin" /opt/homebrew/bin >> "$GITHUB_PATH"
          uv venv --quiet .venv && uv pip install --quiet --python .venv/bin/python -e ".[quality]"
      - name: pie root
        run: echo "PIE_ROOT=${PIE_ROOT:-$HOME/pie}" >> "$GITHUB_ENV"
      - name: pie build at the tag
        # the scores are the tag's pie: its build replaces the Mac's resident one (cached per commit)
        run: .venv/bin/pie-evals-node build --pie-commit "${{ needs.start.outputs.commit }}" --features metal --pie-root "$PIE_ROOT"
      - name: competitor releases
        # the same competitor releases a benchmark run takes (pie-eval.yml: pins latest), so scores and speeds
        # come from one mlx-lm and one llama.cpp (quality ran mlx-lm 0.31.3 beside a 0.32.0 benchmark)
        run: .venv/bin/pie-evals pins set "$(.venv/bin/pie-evals pins latest)"
      - name: baseline engines
        run: |
          # the pins and locations of the benchmark's competitor setup (tier.yml): mlx-lm, llama.cpp, Splash
          pin() { .venv/bin/python -c "import yaml,sys; print({e['id']: e for e in yaml.safe_load(open('matrix/engines.yaml'))['engines']}[sys.argv[1]]['pin'])" "$1"; }
          d="$HOME/.cache/pie-evals/baselines"; mlx=$(pin mlxlm); llama=$(pin llamacpp)
          py="$d/mlx-lm-$mlx"
          [ -x "$py/bin/python" ] || { uv venv --quiet --python 3.12 "$py" && uv pip install --quiet --python "$py/bin/python" "mlx-lm==$mlx" transformers; }
          bin="$d/llama-$llama"
          [ -x "$bin/llama-server" ] || { mkdir -p "$bin" && curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/$llama/llama-$llama-bin-macos-arm64.tar.gz" | tar xz -C "$bin" --strip-components=1; }
          { echo "MLX_PY=$py/bin/python"; echo "LLAMA_SERVER_BIN=$bin/llama-server"; } >> "$GITHUB_ENV"
          # mlx-lm has no Qwen3.8-Flash-Next model; its MLX arm runs on mlx-vlm (recipes/mlxlm.yaml, family qwen4_exp)
          vlm="$d/mlx-vlm-0.7.11"
          [ -x "$vlm/bin/python" ] || { uv venv --quiet --python 3.12 "$vlm" && uv pip install --quiet --python "$vlm/bin/python" "mlx-vlm==0.7.11"; }
          echo "MLX_VLM_PY=$vlm/bin/python" >> "$GITHUB_ENV"
          splash=$(pin splash); sdir="$d/splash-$splash"
          if [ ! -x "$sdir/bin/splash" ]; then
            rm -rf "$sdir" && mkdir -p "$sdir/bin"
            curl -fsSL "https://github.com/incoai/splash/releases/download/$splash/splash-$splash-arm64-macos26.tar.gz" | tar xz -C "$sdir" --strip-components=1
            printf '#!/bin/sh\nexport PYTHONDONTWRITEBYTECODE=1\nexec "%s/python/bin/python3" -u "%s/install/launcher.py" "$@"\n' "$sdir" "$sdir" > "$sdir/bin/splash"
            chmod 0755 "$sdir/bin/splash"
          fi
          if "$sdir/bin/splash" --version; then echo "SPLASH_BIN=$sdir/bin/splash" >> "$GITHUB_ENV"
          else echo "::warning::splash $splash does not run on this Mac; its arms will fail to load"; fi
      - name: run
        run: |
          # scores are stored under the tag, like benchmark runs: a release (0.5.2) or a named manual run
          TAG="${{ needs.start.outputs.tag }}"; kind="${{ needs.start.outputs.tag_kind }}"
          echo "tag=$TAG ($kind) on ${{ needs.start.outputs.mac }}" | tee -a "$GITHUB_STEP_SUMMARY"
          args=""
          for a in $(echo "${{ needs.start.outputs.artifacts }}" | tr ',' ' '); do args="$args --artifact $a"; done
          for t in $(echo "${{ inputs.tasks || 'gsm8k,ifeval,mmlu,arc,math500' }}" | tr ',' ' '); do args="$args --task $t"; done
          .venv/bin/pie-evals-node quality $args --n "${{ inputs.n || 100 }}" --pie-root "$PIE_ROOT" --tag "$TAG" --tag-kind "$kind" \
            ${{ inputs.platform && format('--platform {0}', needs.start.outputs.mac) || '' }}
      - name: free the Mac's disk
        # the last step, pass or fail: a Mac's disk fills over a night of jobs, and the next one must not start on a full disk
        if: always() && runner.os == 'macOS'
        run: bash infra/ci/mac-hooks/disk.sh
