# Diagnostic: one cell on one resident Mac, with macOS `sample` attached to the serving
# process while it runs (PIE_EVALS_SAMPLE_SECS, node/profile.py). Sampling slows the
# process, so the numbers from this run are not comparable; use the profile, not the tok/s.
name: profile
run-name: profile ${{ inputs.engine }} ${{ inputs.artifact }} on ${{ inputs.machine }}
on:
  workflow_dispatch:
    inputs:
      machine: { description: "Mac platform id, a runner label (e.g. m5-max-64g)", required: true, default: "m5-max-64g" }
      engine: { description: "pie, splash, mlxlm or llamacpp; cargo-test, which runs the engine-metal microbenchmark named in artifact at pie_commit; or splash-profile, Splash's own per-kernel decode-profile of the model artifact names (an HF id)", required: true, default: "splash" }
      artifact: { description: "artifact id from matrix/models.yaml", required: true, default: "qwen3.8-27b-splash" }
      workload: { description: "workload id", required: false, default: "ss-512-256" }
      pie_commit: { description: "pie commit", required: false, default: "424758165ecb6a78a72d0344c0f7abec7fec1aab" }
      sample_secs: { description: "seconds of sampling per engine boot", required: false, default: "120" }
permissions: { contents: read }
concurrency: { group: "profile-${{ inputs.machine }}", cancel-in-progress: false }  # one profile per Mac at a time
jobs:
  profile:
    runs-on: [self-hosted, "${{ inputs.machine }}"]
    timeout-minutes: 90
    env:
      HF_TOKEN: "${{ secrets.HF_TOKEN }}"
    steps:
      - uses: actions/checkout@v4
      # the runner's service PATH may lack ~/.local/bin (uv), ~/.cargo/bin (cargo, to build pie) and Homebrew, as tier.yml says
      - run: printf '%s\n' "$HOME/.local/bin" "$HOME/.cargo/bin" /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: splash
        if: inputs.engine == 'splash' || inputs.engine == 'splash-profile'
        run: |
          # same pinned release and wrapper as tier.yml, cached beside the other baselines
          pin=$(.venv/bin/python -c "import yaml; print({e['id']: e for e in yaml.safe_load(open('matrix/engines.yaml'))['engines']}['splash']['pin'])")
          # engine=splash: a release in pie_commit serves that Splash instead of the pinned one
          [[ "${{ inputs.engine }}" == splash && "${{ inputs.pie_commit }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && pin="${{ inputs.pie_commit }}"
          dir="$HOME/.cache/pie-evals/baselines/splash-$pin"
          if [ ! -x "$dir/bin/splash" ]; then
            rm -rf "$dir" && mkdir -p "$dir/bin"
            curl -fsSL "https://github.com/incoai/splash/releases/download/$pin/splash-$pin-arm64-macos26.tar.gz" | tar xz -C "$dir" --strip-components=1
            printf '#!/bin/sh\nexport PYTHONDONTWRITEBYTECODE=1\nexec "%s/python/bin/python3" -u "%s/install/launcher.py" "$@"\n' "$dir" "$dir" > "$dir/bin/splash"
            chmod 0755 "$dir/bin/splash"
          fi
          "$dir/bin/splash" --version
          echo "SPLASH_BIN=$dir/bin/splash" >> "$GITHUB_ENV"
      - name: cargo test
        if: inputs.engine == 'cargo-test'
        run: |
          # a throwaway shallow checkout of the commit, beside the runner's pie checkout, so neither disturbs the other
          src="${PIE_ROOT:-$HOME/pie}"; dir="$RUNNER_TEMP/pie-microbench"
          rm -rf "$dir" && git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/pie-project/pie.git "${{ inputs.pie_commit }}"
          git -C "$dir" checkout -q FETCH_HEAD
          mkdir -p out/profile
          (cd "$dir" && CARGO_TARGET_DIR="$HOME/.cache/pie-microbench-target" cargo test --release -p engine-metal --test engine_metal \
            "${{ inputs.artifact }}" -- --ignored --nocapture --test-threads=1) 2>&1 | tee out/profile/microbench.txt
      - name: splash decode-profile
        if: inputs.engine == 'splash-profile'
        run: |
          # Splash's per-kernel attribution of real DFlash cycles (dev/benchmarks/decode_profile.mm), built at the
          # pinned tag against the release's own metallib (no Metal compiler needed), over the model as Splash
          # prepared it for the benchmark
          # pie_commit names the Splash release here (empty: the pinned one)
          pin="${{ inputs.pie_commit }}"
          [[ "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || pin=$(.venv/bin/python -c "import yaml; print({e['id']: e for e in yaml.safe_load(open('matrix/engines.yaml'))['engines']}['splash']['pin'])")
          rel="$HOME/.cache/pie-evals/baselines/splash-$pin"; src="$RUNNER_TEMP/splash-src"
          if [ ! -f "$rel/engine/splash.metallib" ]; then
            rm -rf "$rel" && mkdir -p "$rel"
            curl -fsSL "https://github.com/incoai/splash/releases/download/$pin/splash-$pin-arm64-macos26.tar.gz" | tar xz -C "$rel" --strip-components=1
          fi
          echo "splash $pin"
          rm -rf "$src" && git clone -q --depth 1 --branch "$pin" https://github.com/incoai/splash.git "$src"
          mkdir -p "$src/build" && cp "$rel/engine/splash.metallib" "$src/build/splash.metallib"
          make -C "$src" -j8 -o build/splash.metallib build/engine-tests/decode-profile
          root=$(cd "$rel" && python/bin/python3 -P -c "import sys; sys.path.insert(0, '.'); from install import models, paths; print(models.Selection.of(paths.MODELS, sys.argv[1]).link.resolve())" "${{ inputs.artifact }}")
          echo "model root: $root"; ls "$root" | head
          mkdir -p out/profile
          "$src/build/engine-tests/decode-profile" "$src/build/splash.metallib" "$root" --prompt-tokens 512 --cycles 20 2>&1 | tee out/profile/splash_decode_profile.txt
      - name: job spec
        if: inputs.engine != 'cargo-test' && inputs.engine != 'splash-profile'
        run: |
          # a Splash release in pie_commit (engine=splash) leaves pie at the input's default commit
          pc="${{ inputs.pie_commit }}"; [[ "$pc" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && pc=424758165ecb6a78a72d0344c0f7abec7fec1aab
          .venv/bin/pie-evals jobs --tier targeted --pie-commit "$pc" \
            --platform "${{ inputs.machine }}" --engine "${{ inputs.engine }}" \
            --artifact "${{ inputs.artifact }}" --workload "${{ inputs.workload }}" --out jobs
          ls jobs
      - name: profile
        if: inputs.engine != 'cargo-test' && inputs.engine != 'splash-profile'
        run: |
          job="jobs/$(jq -r '.include[0].job_id' jobs/gh-matrix.json).json"  # beside it, gh-matrix, pods and policy
          out="out/profile"
          PIE_EVALS_SAMPLE_SECS="${{ inputs.sample_secs }}" .venv/bin/pie-evals-node run --job "$job" --pie-root "${PIE_ROOT:-$HOME/pie}" --out "$out" --download
      - name: summary
        if: always() && (inputs.engine == 'pie' || inputs.engine == 'splash')
        run: |
          # the results in the log, so reading a run needs no artifact download (the account's egress is metered)
          python3 .github/profile/summary.py out/profile || true
          for f in $(grep -rl "kernels: fire" out/profile | sort); do
            if grep -q "kernels: fire" "$f"; then echo "== $f"; python3 .github/profile/kprof.py "$f" | head -150; fi
          done
      - name: keep the profile on this Mac  # never GitHub's artifact storage; the summary above is in the log
        if: always()
        run: |
          k="$HOME/pie-evals-profiles"; mkdir -p "$k"
          [ -d out/profile ] && cp -R out/profile "$k/profile-${{ inputs.engine }}-${{ github.run_id }}" && echo "kept in $k/profile-${{ inputs.engine }}-${{ github.run_id }}"
          find "$k" -mindepth 1 -maxdepth 1 -mtime +14 -exec rm -rf {} + 2>/dev/null || true
