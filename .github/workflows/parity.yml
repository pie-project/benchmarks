name: parity
# pie against vLLM on the same weights and device (teacher-forced KL, top-1 agreement, greedy exact match),
# one RunPod pod per (platform, shard), plus one pod per platform for pie's kernel test suite.
# Pods are named qual-<run_id>-* and labeled qual-<run_id>-<platform>-<shard|k>: never shared with a benchmark run.
run-name: parity ${{ inputs.platforms }} ${{ inputs.tag }}
permissions: { contents: read, actions: read }
on:
  workflow_dispatch:
    inputs:
      platforms: { description: "comma-separated platform ids (none: a Mac-only run)", required: true, default: "b300-x1,b200-x1,h200-x1,pro6000-x1,a100-sxm-x1,h100-sxm-x1,a40-x1,l40s-x1,rtx5090-x1,rtx4090-x1,mi300x-x1" }
      artifacts: { description: "comma-separated artifact ids", required: true, default: "deepseek-v4.1-flash-mini8,glm-5.3-flash-mini8-fp8,glm-5.3-mini,hy4-mini6,mimo-v2.6-flash-mini,kimi-k3-mini8,qwen3.8-flash-next-mini,muse-spark-mini4,minimax-m3.1-flash-mini,nemotron-3-ultra-mini" }
      shards: { description: "pods per platform (artifacts split round-robin)", required: false, default: "2" }
      pie_commit: { description: "pie commit for parity", required: false, default: "main" }
      kernels_commit: { description: "pie commit for the kernel tests", required: false, default: "main" }
      tag: { description: "manual tag the rows are stored under", required: false, default: "0.5.3-b5" }
      kernels: { description: "also run the kernel test suite, one pod per platform", type: boolean, required: false, default: true }
      accuracy: { description: "comma-separated question sets (gsm8k,mmlu,arc,math500,ifeval): score the full models on them, pie and vLLM, instead of parity; use with an 8-GPU platform", required: false, default: "" }
      n: { description: "questions per set in an accuracy run", required: false, default: "100" }
      vllm: { description: "vLLM release (latest: the newest on PyPI)", required: false, default: "latest" }
      mac: { description: "a Mac platform id (pie on Metal against mlx-lm, on that runner); empty: none", required: false, default: "" }
      first_token: { description: "word-salad prompts, one token out: KL of the first-token distribution instead of teacher-forced answers", type: boolean, required: false, default: false }
      ref_only: { description: "first-token only: save the reference's distributions (parity-out/first-token-ref) for another device, no pie run, no row", type: boolean, required: false, default: false }
concurrency: { group: "parity-${{ github.run_id }}", cancel-in-progress: false }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: "${{ steps.p.outputs.shards }}"
      kernels: "${{ steps.p.outputs.kernels }}"
      pods: "${{ steps.p.outputs.pods }}"
      commit: "${{ steps.p.outputs.commit }}"
      kcommit: "${{ steps.p.outputs.kcommit }}"
      vllm: "${{ steps.p.outputs.vllm }}"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - id: p
        env:
          GH_TOKEN: "${{ github.token }}"
          P: "${{ inputs.platforms }}"
          A: "${{ inputs.artifacts }}"
          S: "${{ inputs.shards }}"
          C: "${{ inputs.pie_commit }}"
          KC: "${{ inputs.kernels_commit }}"
          K: "${{ inputs.kernels }}"
          T: "${{ inputs.tag }}"
          RUN: "${{ github.run_id }}"
        run: |
          [[ "$P" =~ ^[a-z0-9.,-]*$ && "$A" =~ ^[a-z0-9.,-]+$ && "$S" =~ ^[1-9][0-9]*$ && "$T" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad inputs"; exit 1; }
          sha() { local c="${1:-main}"; [[ "$c" =~ ^[0-9a-f]{40}$ ]] && echo "$c" || gh api "repos/pie-project/pie/commits/$c" --jq .sha; }
          echo "commit=$(sha "$C")" >> "$GITHUB_OUTPUT"
          echo "kcommit=$(sha "$KC")" >> "$GITHUB_OUTPUT"
          V="${{ inputs.vllm }}"; [ "$V" = latest ] && V=$(curl -fsSL https://pypi.org/pypi/vllm/json | jq -r .info.version)
          [[ "$V" =~ ^[0-9][0-9a-z.+-]*$ ]] || { echo "::error::bad vllm '$V'"; exit 1; }
          echo "vllm=$V" >> "$GITHUB_OUTPUT"
          uv run --no-project --with pyyaml python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          plats = {p["id"]: p for p in yaml.safe_load(open("matrix/platforms.yaml"))["platforms"]}
          arts = {a["id"] for a in yaml.safe_load(open("matrix/models.yaml"))["artifacts"]}
          P = [x for x in os.environ["P"].split(",") if x and x != "none"]
          A = [x for x in os.environ["A"].split(",") if x]
          bad = [x for x in P if x not in plats or not plats[x].get("runpod_gpu_type") or plats[x].get("backend") not in ("cuda", "rocm")] + [x for x in A if x not in arts]
          if bad:
              raise SystemExit(f"::error::unknown or non-RunPod GPU ids: {bad}")
          S, run = int(os.environ["S"]), os.environ["RUN"]
          shards, kernels = [], []
          for p in P:
              b = plats[p]["backend"]
              for s in range(S):
                  part = A[s::S]
                  if part:
                      shards.append({"platform": p, "shard": s, "backend": b, "label": f"qual-{run}-{p}-{s}", "artifacts": " ".join(f"--artifact {a}" for a in part)})
              if os.environ["K"] == "true":
                  kernels.append({"platform": p, "backend": b, "label": f"qual-{run}-{p}-k"})
          pods = [{"platform": e["platform"], "label": e["label"], "kill": 420} for e in shards] + [{"platform": e["platform"], "label": e["label"], "kill": 240} for e in kernels]
          print("shards=" + json.dumps({"include": shards}))
          print("kernels=" + json.dumps({"include": kernels}))
          print("pods=" + json.dumps({"include": pods}))
          PY

  launch:
    needs: plan
    if: fromJson(needs.plan.outputs.pods).include[0] != null
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: "${{ fromJson(needs.plan.outputs.pods) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: launch pod
        id: pod
        # RunPod's stock comes and goes: a type with none now is tried again for half an hour
        run: for i in 1 2 3 4 5 6 7; do .venv/bin/pie-evals launch-pod --platform "${{ matrix.platform }}" --labels "${{ matrix.label }}" --name-prefix "qual-${{ github.run_id }}" --repo "${{ github.repository }}" --image "${{ vars.RUNPOD_IMAGE || 'pieproject/runpod-ci-runner:latest' }}" --kill-minutes ${{ matrix.kill }} --idle-minutes 10 --wait-runner 600 && exit 0; [ $i = 7 ] || sleep 300; done; exit 1
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      - name: launched marker
        run: mkdir -p launched && echo "${{ steps.pod.outputs.pod_id }}" > "launched/${{ matrix.label }}.txt"
      - uses: actions/upload-artifact@v4
        with: { name: "launched-${{ matrix.label }}", path: launched/ }

  # only the shards whose pod came up: a label no pod carries would queue for a day and hold collect
  gate:
    needs: [plan, launch]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    outputs: { shards: "${{ steps.g.outputs.shards }}", kernels: "${{ steps.g.outputs.kernels }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "launched-*", path: launched, merge-multiple: true }
      - id: g
        env: { SHARDS: "${{ needs.plan.outputs.shards }}", KERNELS: "${{ needs.plan.outputs.kernels }}" }
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          up = {f[:-4] for f in os.listdir("launched")} if os.path.isdir("launched") else set()
          for k in ("shards", "kernels"):
              print(k + "=" + json.dumps({"include": [e for e in json.loads(os.environ[k.upper()])["include"] if e["label"] in up]}))
          PY
          echo "pods up: $(ls launched 2>/dev/null | tr '\n' ' ')"

  parity:
    needs: [plan, gate]
    if: always() && needs.gate.result == 'success' && fromJson(needs.gate.outputs.shards).include[0] != null
    strategy: { fail-fast: false, matrix: "${{ fromJson(needs.gate.outputs.shards) }}" }
    runs-on: ["${{ matrix.label }}"]
    timeout-minutes: 400
    env: { C: "${{ needs.plan.outputs.commit }}", F: "${{ matrix.backend }}", PARITY_VLLM_PIN: "${{ needs.plan.outputs.vllm }}", PARITY_FIRST_TOKEN: "${{ inputs.first_token && '1' || '' }}", PARITY_REF_ONLY: "${{ inputs.ref_only && '1' || '' }}" }
    steps:
      - uses: actions/checkout@v4
      - name: install harness
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          printf '%s\n' "$HOME/.local/bin" "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          uv venv --quiet .venv && uv pip install --quiet --python .venv/bin/python -e ".[quality]"
      - name: device
        run: nvidia-smi 2>/dev/null || rocm-smi 2>/dev/null || echo "no smi"
      - name: build pie
        run: .venv/bin/pie-evals-node build --pie-commit "$C" --features "$F" --pie-root "${PIE_ROOT:-/tmp/pie}"
      - name: parity
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: |
          nvidia-smi 2>/dev/null || rocm-smi 2>/dev/null || true
          .venv/bin/pie-evals-node parity ${{ matrix.artifacts }} --platform "${{ matrix.platform }}" --pie-root "${PIE_ROOT:-/tmp/pie}" \
            --pie-commit "$C" --features "$F" --store parity-out/store --tag "${{ inputs.tag }}" --tag-kind manual --out parity-out \
            ${{ inputs.accuracy != '' && format('--accuracy {0} --n {1}', inputs.accuracy, inputs.n) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "parity-${{ matrix.platform }}-${{ matrix.shard }}", path: parity-out/, if-no-files-found: warn, retention-days: 30 }
      - name: free the Mac's disk
        # the last step, pass or fail: a Mac's disk fills over a night of jobs, and the next one must not start on a full disk
        if: always() && runner.os == 'macOS'
        run: bash infra/ci/mac-hooks/disk.sh

  kernels:
    needs: [plan, gate]
    if: always() && needs.gate.result == 'success' && fromJson(needs.gate.outputs.kernels).include[0] != null
    strategy: { fail-fast: false, matrix: "${{ fromJson(needs.gate.outputs.kernels) }}" }
    runs-on: ["${{ matrix.label }}"]
    timeout-minutes: 220
    env: { KC: "${{ needs.plan.outputs.kcommit }}", PIE_KERNEL_ERR: "1" }
    steps:
      - uses: actions/checkout@v4
      - name: install harness
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          printf '%s\n' "$HOME/.local/bin" "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          uv venv --quiet .venv && uv pip install --quiet --python .venv/bin/python -e .
      - name: kernel tests
        run: |
          nvidia-smi 2>/dev/null || rocm-smi 2>/dev/null || echo "no smi"
          .venv/bin/pie-evals-node kernels --platform "${{ matrix.platform }}" --pie-root "${PIE_ROOT:-/tmp/pie}" --pie-commit "$KC" \
            --store kernels-out/store --tag "${{ inputs.tag }}" --tag-kind manual --out kernels-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "kernels-${{ matrix.platform }}", path: kernels-out/, if-no-files-found: warn, retention-days: 30 }

  # the Mac: pie on Metal against mlx-lm (vLLM has no Mac build), every model one after another on one runner
  mac:
    needs: plan
    if: inputs.mac != ''
    runs-on: [self-hosted, macos, "${{ inputs.mac }}"]
    timeout-minutes: 720
    env: { C: "${{ needs.plan.outputs.commit }}", KC: "${{ needs.plan.outputs.kcommit }}", HF_TOKEN: "${{ secrets.HF_TOKEN }}", PARITY_FIRST_TOKEN: "${{ inputs.first_token && '1' || '' }}", PARITY_REF_ONLY: "${{ inputs.ref_only && '1' || '' }}" }
    steps:
      - uses: actions/checkout@v4
      - name: install harness
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          printf '%s\n' "$HOME/.local/bin" "$HOME/.cargo/bin" /opt/homebrew/bin >> "$GITHUB_PATH"
          uv venv --quiet .venv && uv pip install --quiet --python .venv/bin/python -e ".[quality]"
          echo "PIE_ROOT=$HOME/qual/pie" >> "$GITHUB_ENV"
      - name: mlx-lm, latest release
        run: |
          v=$(curl -fsSL https://pypi.org/pypi/mlx-lm/json | jq -r .info.version)
          py="$HOME/.cache/pie-evals/baselines/mlx-lm-$v"
          [ -x "$py/bin/python" ] || { uv venv --quiet --python 3.12 "$py" && uv pip install --quiet --python "$py/bin/python" "mlx-lm==$v" transformers tiktoken; }
          echo "MLX_PY=$py/bin/python" >> "$GITHUB_ENV"
          # mlx-lm has no Qwen3.8-Flash-Next model: its reference runs on mlx-vlm (dist_run.mlx_python)
          vlm="$HOME/.cache/pie-evals/baselines/mlx-vlm-0.7.11"
          [ -x "$vlm/bin/python" ] || { uv venv --quiet --python 3.12 "$vlm" && uv pip install --quiet --python "$vlm/bin/python" "mlx-vlm==0.7.11"; }
          echo "MLX_VLM_PY=$vlm/bin/python" >> "$GITHUB_ENV"
      - name: parity
        run: |
          args=""; for a in $(echo "${{ inputs.artifacts }}" | tr ',' ' '); do args="$args --artifact $a"; done
          .venv/bin/pie-evals-node build --pie-commit "$C" --features metal --pie-root "$PIE_ROOT"
          .venv/bin/pie-evals-node parity $args --platform "${{ inputs.mac }}" --pie-root "$PIE_ROOT" --pie-commit "$C" --features metal \
            --store parity-out/store --tag "${{ inputs.tag }}" --tag-kind manual --out parity-out || echo "::warning::some models failed"
      # the parity rows leave the Mac before the kernel build can fill its disk and take the runner down
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "parity-${{ inputs.mac }}-mac-models", path: parity-out/, if-no-files-found: warn, retention-days: 30 }
      - name: kernel tests
        if: inputs.kernels
        env: { PIE_KERNEL_ERR: "1" }
        run: |
          .venv/bin/pie-evals-node kernels --platform "${{ inputs.mac }}" --pie-root "$HOME/qual/pie-k" --pie-commit "$KC" \
            --store parity-out/store --tag "${{ inputs.tag }}" --tag-kind manual --out kernels-out || echo "::warning::kernel tests failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "parity-${{ inputs.mac }}-mac", path: parity-out/, if-no-files-found: warn, retention-days: 30 }

  # the pods are this run's alone: end them now rather than at their 10-minute idle watchdog
      - name: free the Mac's disk
        # the last step, pass or fail: a Mac's disk fills over a night of jobs, and the next one must not start on a full disk
        if: always() && runner.os == 'macOS'
        run: bash infra/ci/mac-hooks/disk.sh
  teardown:
    needs: [launch, parity, kernels]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "launched-*", path: launched, merge-multiple: true }
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: astral-sh/setup-uv@v3
      - name: release pods
        working-directory: src
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
        run: |
          IDS=$(cat ../launched/*.txt 2>/dev/null | tr -s ' \n' ' ')
          [ -z "${IDS// /}" ] && { echo "no pods"; exit 0; }
          uv venv -q && uv pip install -q -e ".[orchestrate]"
          .venv/bin/pie-evals release-pods --repo "${{ github.repository }}" $IDS

  collect:
    needs: [plan, parity, kernels, mac]
    if: always() && needs.plan.result == 'success'
    runs-on: [self-hosted, site]  # the site laptop: bookkeeping never shares a benchmark Mac
    env: { PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "parity-*", path: out }
      - uses: actions/download-artifact@v4
        with: { pattern: "kernels-*", path: out }
      - name: import into the database
        run: |
          shopt -s nullglob
          n=0
          for d in out/*/store; do echo "== $d"; .venv/bin/pie-evals import-store "$d"; n=$((n + 1)); done
          [ "$n" -gt 0 ] || { echo "::error::no store from any pod"; exit 1; }
          for f in out/*/failed.json; do [ "$(cat "$f")" = "[]" ] || echo "::warning::$f: $(cat "$f" | head -c 1500)"; done
