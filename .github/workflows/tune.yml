name: tune
# `pie tune cuda` (the quick grid) on one RunPod GPU per platform: each pod builds pie at the commit, tunes,
# and prints the profile it wrote into its log (profile-<platform>), to be checked into pie's crates/engine-cuda/profiles:
# python3 infra/ci/handoff.py recv --run-id <run> --job tune <dir> (GH_TOKEN, GITHUB_REPOSITORY=pie-project/benchmarks) unpacks them.
run-name: tune ${{ inputs.platforms }}
permissions: { contents: read, actions: read }
on:
  workflow_dispatch:
    inputs:
      platforms: { description: "comma-separated platform ids (one pod each)", required: true, default: "b300-x1,h200-x1,pro6000-x1,h100-sxm-x1,a40-x1,rtx5090-x1,rtx4090-x1" }
      pie_commit: { description: "pie commit (default: main)", required: false, default: "" }
      model: { description: "HF repo pie imports and tunes against end to end", required: false, default: "openai/gpt-oss-20b" }
      args: { description: "extra pie tune arguments", required: false, default: "" }
concurrency: { group: "tune-${{ github.run_id }}", cancel-in-progress: false }

jobs:
  plan:
    runs-on: ${{ fromJSON(vars.HOSTED_RUNS_ON || '"ubuntu-latest"') }}
    outputs: { platforms: "${{ steps.p.outputs.platforms }}", commit: "${{ steps.p.outputs.commit }}" }
    steps:
      - id: p
        env: { GH_TOKEN: "${{ github.token }}", P: "${{ inputs.platforms }}", C: "${{ inputs.pie_commit }}" }
        run: |
          [[ "$P" =~ ^[a-z0-9.,-]+$ ]] || { echo "::error::bad platforms"; exit 1; }
          [ -z "$C" ] && C=main
          [[ "$C" =~ ^[0-9a-f]{40}$ ]] || C=$(gh api "repos/pie-project/pie/commits/$C" --jq .sha)
          echo "platforms=$(echo "$P" | jq -Rc 'split(",")')" >> "$GITHUB_OUTPUT"
          echo "commit=$C" >> "$GITHUB_OUTPUT"

  launch:
    needs: plan
    runs-on: ${{ fromJSON(vars.HOSTED_RUNS_ON || '"ubuntu-latest"') }}
    strategy: { fail-fast: false, matrix: { platform: "${{ fromJson(needs.plan.outputs.platforms) }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: launch pod
        # RunPod's stock comes and goes: a type with none now is tried again for half an hour
        run: for i in 1 2 3 4 5 6; do .venv/bin/pie-evals launch-pod --platform "${{ matrix.platform }}" --labels "tune-${{ github.run_id }}-${{ matrix.platform }}" --repo "${{ github.repository }}" --image "${{ vars.RUNPOD_IMAGE || 'pieproject/runpod-ci-runner:latest' }}" --kill-minutes 120 --idle-minutes 10 --wait-runner 600 && exit 0; sleep 300; done; exit 1
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}

  # not after launch: each tune waits only for its own pod's runner (its label), not for every other GPU's stock
  tune:
    needs: plan
    strategy: { fail-fast: false, matrix: { platform: "${{ fromJson(needs.plan.outputs.platforms) }}" } }
    runs-on: ["tune-${{ github.run_id }}-${{ matrix.platform }}"]
    timeout-minutes: 100
    env: { C: "${{ needs.plan.outputs.commit }}" }
    steps:
      - uses: actions/checkout@v4
      - name: build pie
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          printf '%s\n' "$HOME/.local/bin" "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          uv venv --quiet .venv && uv pip install --quiet --python .venv/bin/python -e .
          .venv/bin/pie-evals-node build --pie-commit "$C" --features cuda --pie-root "${PIE_ROOT:-/tmp/pie}"
      - name: tune
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: |
          nvidia-smi --query-gpu=name,utilization.gpu,memory.used --format=csv
          bin=$(ls -d "${PIE_EVALS_CACHE:-$HOME/.cache/pie-evals}"/builds/${C:0:12}-cuda/pie 2>/dev/null || echo "${PIE_ROOT:-/tmp/pie}/target/release/pie")
          # the tune serves the imported model to time each decision; without one it measures nothing
          "$bin" model import "${{ inputs.model }}" 2>&1 | tail -n 20
          "$bin" tune cuda ${{ inputs.args }} 2>&1 | tee tune.log
          mkdir -p profile && cp tune.log profile/
          find / -path '*/profiles/cuda/user/*.toml' 2>/dev/null | while read -r f; do cp "$f" profile/; done
          ls -la profile
      - name: hand the profile over in this job's log  # never GitHub's artifact storage; tune.log is in the log above
        if: always()
        run: |
          t=$(cd profile 2>/dev/null && ls *.toml 2>/dev/null) || true
          if [ -n "$t" ]; then python3 infra/ci/handoff.py send "profile-${{ matrix.platform }}" profile $t; else echo "::warning::no profile written"; fi
