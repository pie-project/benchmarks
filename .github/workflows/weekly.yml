name: weekly
# the called tier.yml's collect job commits to main; a called job may not
# request more than the caller grants (startup_failure otherwise)
permissions: { contents: read, actions: read }
on:
  # schedule disabled until the tier is calibrated: an unfiltered weekly launched 16 pods at once
  # (re-enable with a platforms/engines filter and max_jobs_per_platform)
  workflow_dispatch:
    inputs:
      pie_commit: { description: "pie commit (default: origin/main)", required: false, default: "" }
      platforms: { description: "comma-separated platform ids", required: false, default: "" }
      engines: { description: "comma-separated engine ids", required: false, default: "" }
      programs: { description: "comma-separated program ids", required: false, default: "" }
      max_jobs: { description: "cap on jobs", required: false, default: "" }
      build_platform: { description: "platform for the build/prepare pod", required: false, default: "" }
      max_jobs_per_platform: { description: "cap per platform", required: false, default: "" }
      artifacts: { description: "comma-separated artifact ids", required: false, default: "" }
      workloads: { description: "comma-separated workload ids (empty: every weekly workload)", required: false, default: "" }
      skip_recorded: { description: "skip cells already recorded at this pie commit (a retry)", required: false, default: "false" }
      tag: { description: "a tag for the site (0.5.3-b5): the results join that run beside the Macs'", required: false, default: "" }
      pins: { description: "competitor releases id=version,... (empty with a tag: the newest vLLM and SGLang on PyPI)", required: false, default: "" }
      pie_env: { description: "KEY=VALUE pairs set for the node run (A/B diagnostics)", required: false, default: "" }
      own_pods: { description: "rent this run's own pods, so runs go side by side", type: boolean, required: false, default: false }
jobs:
  resolve:
    runs-on: ${{ fromJSON(vars.HOSTED_RUNS_ON || '"ubuntu-latest"') }}
    outputs: { pie_commit: "${{ steps.c.outputs.commit }}", pins: "${{ steps.c.outputs.pins }}" }
    steps:
      - id: c
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          C="${{ github.event.inputs.pie_commit }}"
          [ -z "$C" ] && C=$(git ls-remote https://github.com/pie-project/pie.git refs/heads/main | cut -f1)
          # a short SHA or a branch name cannot be shallow-fetched on the pod; resolve it to the full SHA here
          if ! [[ "$C" =~ ^[0-9a-f]{40}$ ]]; then C=$(gh api "repos/pie-project/pie/commits/$C" --jq .sha); fi
          echo "commit=$C" >> "$GITHUB_OUTPUT"
          # a tagged run compares against the competitors' newest releases, as the Mac release run does
          P="${{ github.event.inputs.pins }}"
          if [ -z "$P" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            P="vllm=$(curl -fsS https://pypi.org/pypi/vllm/json | jq -r .info.version),sglang=$(curl -fsS https://pypi.org/pypi/sglang/json | jq -r .info.version)"
          fi
          echo "competitors: ${P:-matrix pins}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "pins=$P" >> "$GITHUB_OUTPUT"
  run:
    needs: resolve
    uses: ./.github/workflows/tier.yml
    with:
      tier: weekly
      pie_commit: ${{ needs.resolve.outputs.pie_commit }}
      platforms: ${{ github.event.inputs.platforms || '' }}
      engines: ${{ github.event.inputs.engines || '' }}
      programs: ${{ github.event.inputs.programs || '' }}
      max_jobs: ${{ github.event.inputs.max_jobs || '' }}
      build_platform: ${{ github.event.inputs.build_platform || '' }}
      max_jobs_per_platform: ${{ github.event.inputs.max_jobs_per_platform || '' }}
      artifacts: ${{ github.event.inputs.artifacts || '' }}
      workloads: ${{ github.event.inputs.workloads || '' }}
      skip_recorded: ${{ github.event.inputs.skip_recorded == 'true' }}
      tag: ${{ github.event.inputs.tag || '' }}
      tag_kind: ${{ github.event.inputs.tag && 'manual' || '' }}
      pins: ${{ needs.resolve.outputs.pins }}
      own_pods: ${{ github.event.inputs.own_pods == 'true' }}
      pie_env: ${{ github.event.inputs.pie_env || '' }}
    secrets: inherit
