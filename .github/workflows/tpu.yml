name: tpu
# pie's TPU engine (crates/engine-xla, crates/kernels-xla) on one Trillium chip (or, by hand, on another TPU platform:
# platforms.yaml's tpu: settings say how infra/tpu/vm.sh gets that generation's smallest single-host VM). A Cloud TPU VM
# is created for the run and deleted after it, whatever happens. The schedule measures pie main
# only when a commit since the last measured one touched the XLA crates; a manual run always runs.
# Results go to the database as nightly rows on tpu-v6e-1, tagged main-<first 9 of the sha>.
# A weekly plan (a release's Raw row) also holds the TPU builds of vLLM and SGLang on the same checkpoint:
# the VM installs vllm-tpu and sglang-jax at the engines.yaml pins into their own venvs and runs them after pie.
permissions: { contents: read, actions: read }
on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      pie_commit: { description: "pie commit (default: main)", required: false, default: "" }
      tier: { description: "matrix tier the job is planned from (nightly, or weekly for a release's Raw rows)", required: false, default: "nightly" }
      workloads: { description: "comma-separated workload ids (empty: every workload of the tier)", required: false, default: "" }
      artifacts: { description: "comma-separated artifact ids (empty: every one that runs on the TPU)", required: false, default: "" }
      engines: { description: "comma-separated engines (empty: pie, vllm and sglang)", required: false, default: "" }
      tag: { description: "a tag for the site (0.5.3-b5); empty: main-<sha>", required: false, default: "" }
      zone: { description: "comma-separated zones to try in order (empty: the platform's tpu.zones; v6e: us-east5-b first)", required: false, default: "" }
      parity: { description: "comma-separated artifact ids: pie vs vLLM-TPU quality parity instead of the benchmark (empty: the benchmark)", required: false, default: "" }
      kernels: { description: "a cargo test filter: engine-xla's kernel tests on the chip instead of the benchmark (cargo test -p engine-xla --test engine_xla -- <filter>, e.g. kernels_attn); the run log holds their output", required: false, default: "" }
      accuracy: { description: "parity only: comma-separated question sets (gsm8k,mmlu,arc,math500,ifeval): score the models on them, pie and vLLM-TPU, instead of KL parity", required: false, default: "" }
      n: { description: "questions per set in an accuracy run", required: false, default: "100" }
      vllm: { description: "parity only: vllm-tpu release (latest: the newest on PyPI; pin: the engines.yaml pin; or a version, e.g. 0.32.0). An empty value is the default, latest: GitHub fills an empty input with it", required: false, default: "latest" }
      lanes: { description: "parity only: models run side by side, one chip each (a v5p-8 has 4)", required: false, default: "1" }
      done: { description: "accuracy only: <row artifact>/<task> pairs already stored, skipped (a rerun after a spot VM was taken back)", required: false, default: "" }
      vllm_tp: { description: "accuracy only: vLLM over this many chips (pie keeps one)", required: false, default: "" }
      vm_env: { description: "parity only: extra PARITY_*/PIE_* settings for the VM, space-separated KEY=VALUE (PARITY_PIE_PREWARM=0)", required: false, default: "" }
      model_minutes: { description: "accuracy only: a model's cap in minutes", required: false, default: "150" }
      on_demand: { description: "1: on-demand VMs only, the zones retried for up to 2 hours; retry: on demand then spot, retried alike (empty: on demand, then spot, once)", required: false, default: "" }
      platform: { description: "TPU platform (platforms.yaml): tpu-v6e-1, tpu-v5e-1, tpu-v5p-8, tpu-v4-8, tpu7x-4", required: false, default: "tpu-v6e-1" }
# the schedule one at a time; every manual run its own VM, in parallel with the others (each deletes its own)
concurrency: { group: "tpu-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'schedule' }}", cancel-in-progress: false }
env:
  GCP_PROJECT: pie-project-510103
  PLATFORM: ${{ github.event.inputs.platform || 'tpu-v6e-1' }}
  TPU_NAME: pie-evals-tpu-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  decide:
    runs-on: ${{ fromJSON(vars.HOSTED_RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      commit: ${{ steps.c.outputs.commit }}
      run: ${{ steps.d.outputs.run }}
      vm: ${{ steps.vm.outputs.vm }}
    steps:
      - uses: actions/checkout@v4
      - id: vm
        name: the platform's TPU VM settings
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install -q --break-system-packages pyyaml 2>/dev/null || python3 -m pip install -q --user pyyaml
          s=$(bash infra/tpu/vm.sh resolve "$PLATFORM")
          Z="${{ github.event.inputs.zone }}"
          # a full zone answers "no more capacity": a manual run can name others to try first
          [ -n "$Z" ] && s=$(echo "$s" | grep -v '^TPU_ZONES='; echo "TPU_ZONES=$(echo "$Z" | tr ',' ' ')")
          echo "$s"
          echo "vm=$(echo "$s" | jq -Rn '[inputs | capture("^(?<key>[^=]+)=(?<value>.*)$")] | from_entries' -c)" >> "$GITHUB_OUTPUT"
      - id: c
        name: pie commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          C="${{ github.event.inputs.pie_commit }}"
          [ -z "$C" ] && C=$(git ls-remote https://github.com/pie-project/pie.git refs/heads/main | cut -f1)
          if ! [[ "$C" =~ ^[0-9a-f]{40}$ ]]; then C=$(gh api "repos/pie-project/pie/commits/$C" --jq .sha); fi
          echo "commit=$C" >> "$GITHUB_OUTPUT"
      - id: d
        name: did the XLA crates change since the last TPU run?
        env: { GH_TOKEN: "${{ github.token }}", C: "${{ steps.c.outputs.commit }}" }
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # the collect job of every run that stored results uploads the commit it measured
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=tpu-last-commit&per_page=100" \
               --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          last=""
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > last.zip
            last=$(unzip -p last.zip commit.txt | tr -d '[:space:]')
          fi
          if [ -z "$last" ]; then echo "no earlier TPU run: measuring $C"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$last" = "$C" ]; then echo "$C already measured"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! gh api "repos/pie-project/pie/compare/$last...$C" > compare.json; then
            echo "cannot compare $last...$C: measuring"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(jq '.files | length' compare.json)
          xla=$(jq '[.files[].filename | select(startswith("crates/engine-xla/") or startswith("crates/kernels-xla/"))] | length' compare.json)
          echo "since ${last:0:9}: $files files changed, $xla in the XLA crates"
          # the compare API lists at most 300 files: a longer list may hide an XLA change
          if [ "$xla" -gt 0 ] || [ "$files" -ge 300 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  bench:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.HOSTED_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 340  # a plan of several shards runs them one after another
    env: { C: "${{ needs.decide.outputs.commit }}" }
    outputs:
      job_id: ${{ steps.jobs.outputs.job_id }}
      created: ${{ steps.create.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: VM settings
        env: { VM: "${{ needs.decide.outputs.vm }}" }
        run: echo "$VM" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e .
      - name: job spec
        id: jobs
        if: github.event.inputs.parity == '' && github.event.inputs.kernels == ''
        run: |
          args=()
          for w in $(echo "${{ github.event.inputs.workloads }}" | tr ',' ' '); do args+=(--workload "$w"); done
          for a in $(echo "${{ github.event.inputs.artifacts }}" | tr ',' ' '); do args+=(--artifact "$a"); done
          for e in $(echo "${{ github.event.inputs.engines }}" | tr ',' ' '); do args+=(--engine "$e"); done
          .venv/bin/pie-evals jobs --tier "${{ github.event.inputs.tier || 'nightly' }}" --pie-commit "$C" --platform "$PLATFORM" --out jobs "${args[@]}"
          n=$(jq '.include | length' jobs/gh-matrix.json)
          [ "$n" -ge 1 ] || { echo "::error::the plan has no $PLATFORM job"; exit 1; }
          # a plan the budget split into shards: every shard on this one VM, one after another
          echo "job_id=$(jq -r '[.include[].job_id] | join(" ")' jobs/gh-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.GCP_TPU_SA_KEY }}" }
      - uses: google-github-actions/setup-gcloud@v2
      - name: create the TPU VM
        id: create
        run: |
          z=$(TPU_ON_DEMAND="${{ github.event.inputs.on_demand }}" bash infra/tpu/vm.sh create)
          echo "TPU_ZONE=${z#zone=}" >> "$GITHUB_ENV"; echo "created in ${z#zone=}"
      - name: wait for the VM
        run: bash infra/tpu/vm.sh wait
      - name: copy the harness and the job
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", PARITY: "${{ github.event.inputs.parity }}", VLLM: "${{ github.event.inputs.vllm }}", TAG: "${{ github.event.inputs.tag }}", ACCURACY: "${{ github.event.inputs.accuracy }}", NQ: "${{ github.event.inputs.n }}", LANES: "${{ github.event.inputs.lanes }}", MINUTES: "${{ github.event.inputs.model_minutes }}", ENGINES: "${{ github.event.inputs.engines }}", DONE: "${{ github.event.inputs.done }}", VTP: "${{ github.event.inputs.vllm_tp }}", VMENV: "${{ github.event.inputs.vm_env }}", KERNELS: "${{ github.event.inputs.kernels }}" }
        run: |
          tar czf "$RUNNER_TEMP/pie-evals.tgz" --exclude=.git --exclude=.venv .  # no .git: provenance reads PIE_EVALS_HARNESS_COMMIT
          ( umask 077; echo "export PIE_EVALS_HARNESS_COMMIT=${{ github.sha }}" > "$RUNNER_TEMP/vm.env"; [ -n "$PARITY" ] && printf 'export PARITY_ARTIFACTS=%q PARITY_PLATFORM=%q PARITY_TAG=%q\n' "$PARITY" "$PLATFORM" "${TAG:-main-${C:0:9}}" >> "$RUNNER_TEMP/vm.env" || true; [ -n "$ACCURACY" ] && printf 'export PARITY_ACCURACY=%q PARITY_N=%q PARITY_MODEL_MINUTES=%q\n' "$ACCURACY" "${NQ:-100}" "${MINUTES:-150}" >> "$RUNNER_TEMP/vm.env" || true; [ -n "$PARITY" ] && printf 'export PARITY_LANES=%q\n' "${LANES:-1}" >> "$RUNNER_TEMP/vm.env" || true; [ -n "$PARITY" ] && [ -n "$ENGINES" ] && printf 'export PARITY_ENGINES=%q\n' "$ENGINES" >> "$RUNNER_TEMP/vm.env" || true; [ -n "$PARITY" ] && [ -n "$DONE" ] && printf 'export PARITY_DONE=%q\n' "$DONE" >> "$RUNNER_TEMP/vm.env" || true; [ -n "$PARITY" ] && [ -n "$VTP" ] && printf 'export PARITY_VLLM_TP=%q\n' "$VTP" >> "$RUNNER_TEMP/vm.env" || true; for kv in $VMENV; do [[ "$kv" =~ ^(PARITY|PIE)_[A-Z0-9_]+=[A-Za-z0-9._,:/-]*$ ]] && printf 'export %s=%q\n' "${kv%%=*}" "${kv#*=}" >> "$RUNNER_TEMP/vm.env" || true; done; [ "$VLLM" = latest ] && VLLM=$(curl -fsSL https://pypi.org/pypi/vllm-tpu/json | jq -r .info.version); [ "$VLLM" = pin ] && VLLM=; [ -z "$VLLM" ] || [[ "$VLLM" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "::error::vllm: not latest, pin or a version: $VLLM"; exit 1; }; [ -n "$PARITY" ] && [ -n "$VLLM" ] && printf 'export PARITY_VLLM_PIN=%q\n' "$VLLM" >> "$RUNNER_TEMP/vm.env" || true; [ -n "$HF_TOKEN" ] && printf 'export HF_TOKEN=%q\n' "$HF_TOKEN" >> "$RUNNER_TEMP/vm.env" || true; [ -n "$KERNELS" ] && printf 'export KERNELS_TEST=%q\n' "$KERNELS" >> "$RUNNER_TEMP/vm.env" || true; [ -n "${TPU_ALL_CHIPS:-}" ] && echo "export TPU_ALL_CHIPS=1" >> "$RUNNER_TEMP/vm.env" || true )
          # the first ssh pushes the key; retried while the VM's sshd and the key settle
          for i in 1 2 3 4 5; do
            bash infra/tpu/vm.sh put "$RUNNER_TEMP/pie-evals.tgz" "$RUNNER_TEMP/vm.env" && break
            [ "$i" = 5 ] && exit 1; sleep 20
          done
          bash infra/tpu/vm.sh ssh 'rm -rf ~/pie-evals && mkdir ~/pie-evals && tar xzf ~/pie-evals.tgz -C ~/pie-evals'
      - name: build pie, set up vllm-tpu and sglang-jax (when the plan has their cells) and run the job
        env: { JOB_ID: "${{ steps.jobs.outputs.job_id }}" }
        run: |
          vm() { bash infra/tpu/vm.sh ssh "$1"; }
          # detached on the VM, so a dropped ssh session does not stop the build or the bench
          # the launch returns at once; capped, as an ssh that never returns would otherwise hold the job
          # the boot it starts on: a VM restarted under the run (a maintenance event) loses the process and never writes run.done
          timeout 300 bash infra/tpu/vm.sh ssh "cat /proc/sys/kernel/random/boot_id > ~/run.boot; cd ~/pie-evals && setsid nohup bash -c 'set -a; . ~/vm.env; set +a; bash infra/tpu/run-on-vm.sh $C $([ -z "$JOB_ID" ] || printf 'jobs/%s.json ' $JOB_ID); echo \$? > ~/run.done' > ~/run.log 2>&1 < /dev/null &" || true
          while ! rc=$(timeout 300 bash infra/tpu/vm.sh ssh 'cat ~/run.done 2>/dev/null || [ "$(cat ~/run.boot)" = "$(cat /proc/sys/kernel/random/boot_id)" ] || echo restarted' 2>/dev/null) || [ -z "$rc" ]; do
            # a spot VM taken back mid-run never writes run.done
            st=$(bash infra/tpu/vm.sh state 2>/dev/null || echo unknown)
            case "$st" in READY|RUNNING) ;; *) echo "::error::the VM is $st"; exit 1 ;; esac
            # parity: the models done so far, so a spot VM taken back keeps them
            [ -z "${{ github.event.inputs.parity }}" ] || { mkdir -p out; timeout 300 bash infra/tpu/vm.sh get --recurse pie-evals/out/parity out/ >/dev/null 2>&1 || true; }
            # a bench's records so far, every 10 minutes: a spot VM taken back keeps the cells it finished
            n=$((${n:-0} + 1))
            if [ -n "$JOB_ID" ] && [ $((n % 10)) = 0 ]; then
              mkdir -p out; for j in $JOB_ID; do timeout 300 bash infra/tpu/vm.sh get --recurse "pie-evals/out/$j" out/ >/dev/null 2>&1 || true; done
            fi
            sleep 60
          done
          vm 'tail -n 200 ~/run.log'
          echo "exit $rc"; [ "$rc" = 0 ]
      - name: fetch the records
        if: always() && (steps.jobs.outputs.job_id != '' || github.event.inputs.parity != '' || github.event.inputs.kernels != '')
        run: |
          mkdir -p out
          [ -n "${TPU_ZONE:-}" ] || exit 0  # no VM was created
          [ -z "${{ github.event.inputs.parity }}" ] || bash infra/tpu/vm.sh get --recurse pie-evals/out/parity out/ || echo "::warning::no parity output on the VM"
          for j in ${{ steps.jobs.outputs.job_id }}; do bash infra/tpu/vm.sh get --recurse "pie-evals/out/$j" out/ || echo "::warning::no node output for $j on the VM"; done
          bash infra/tpu/vm.sh get run.log out/ || true
      - uses: actions/upload-artifact@v4
        if: always() && (steps.jobs.outputs.job_id != '' || github.event.inputs.parity != '' || github.event.inputs.kernels != '')
        with: { name: "out-${{ github.run_id }}", path: "out/", retention-days: 30, if-no-files-found: warn }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tpu-run-log, path: out/run.log, retention-days: 30, if-no-files-found: ignore }

  # its own job, so the VM is deleted even when the bench job's runner is lost or the job times out
  teardown:
    needs: [decide, bench]
    if: always() && needs.decide.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.HOSTED_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.GCP_TPU_SA_KEY }}" }
      - uses: google-github-actions/setup-gcloud@v2
      - name: delete the TPU VM (in every zone the run may have created it in)
        env: { VM: "${{ needs.decide.outputs.vm }}" }
        run: |
          eval "$(echo "$VM" | jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"')"
          bash infra/tpu/vm.sh delete
          # every pie-evals VM still up in these zones: a run's own is gone; any other is another run's (or a leak)
          for z in $TPU_ZONES; do
            if [ "$TPU_KIND" = tpu ]; then gcloud compute tpus tpu-vm list --project "$GCP_PROJECT" --zone "$z" --format 'value(name,state)' 2>/dev/null
            else gcloud compute instances list --project "$GCP_PROJECT" --zones "$z" --filter 'labels.owner=pie-evals' --format 'value(name,status)' 2>/dev/null; fi | sed "s|^|$z: |"
          done

  # the Mac reaches the database on liszt over the tailnet; GitHub's runners do not
  collect:
    needs: [decide, bench]
    if: always() && needs.decide.outputs.run == 'true' && (needs.bench.outputs.job_id != '' || github.event.inputs.parity != '') && needs.bench.outputs.created == 'true'  # no VM: nothing to import
    runs-on: [self-hosted, site]  # the site laptop's runners, on the tailnet with liszt: a benchmark Mac busy benching held finished TPU runs' imports for hours
    # no concurrency group: a group keeps one pending job and cancels the one before it
    env: { PIE_EVALS_DB: "${{ secrets.PIE_EVALS_DB }}", C: "${{ needs.decide.outputs.commit }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "out-*", path: out }
      - name: import into the database
        id: import
        run: |
          shopt -s nullglob
          if [ -n "${{ github.event.inputs.parity }}" ]; then
            d=(out/out-*/parity/store)
            [ -n "${d[*]}" ] || { echo "::error::no parity store from the TPU"; exit 1; }
            .venv/bin/pie-evals import-store "${d[0]}"
            exit 0
          fi
          dirs=(out/out-*/*/)  # one directory a shard
          n=0; for d in "${dirs[@]}"; do [ -s "$d/records.jsonl" ] && n=$((n + 1)); done
          [ "$n" -gt 0 ] || { echo "::error::no records from the TPU"; exit 1; }
          T="${{ github.event.inputs.tag }}"
          .venv/bin/pie-evals collect --tier "${{ github.event.inputs.tier || 'nightly' }}" --tag "${T:-main-${C:0:9}}" --tag-kind manual "${dirs[@]}"
          mkdir -p last && echo "$C" > last/commit.txt
      # what the next scheduled run compares against
      - uses: actions/upload-artifact@v4
        if: steps.import.outcome == 'success' && env.PLATFORM == 'tpu-v6e-1' && github.event.inputs.parity == ''  # the schedule measures the v6e only
        with: { name: tpu-last-commit, path: last/commit.txt, retention-days: 90 }
